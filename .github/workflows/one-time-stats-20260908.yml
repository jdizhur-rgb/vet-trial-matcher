name: One-time read-only catalog statistics 2026-09-08
on:
  push:
    paths:
      - '.github/workflows/one-time-stats-20260908.yml'
permissions:
  contents: read
jobs:
  stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Calculate effective catalog statistics without writing files
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from collections import Counter
          root=Path('.')
          base=json.loads((root/'data/trials_base.json').read_text(encoding='utf-8'))
          by_id={t['id']:t for t in base}
          patch_paths=[root/'data/trial_updates.json']+sorted((root/'data').glob('catalog_patch_*.json'))
          for path in patch_paths:
              if not path.exists(): continue
              doc=json.loads(path.read_text(encoding='utf-8'))
              for rid in doc.get('delete',[]): by_id.pop(rid,None)
              for patch in doc.get('upsert',[]):
                  rid=patch['id']
                  if rid in by_id:
                      merged=dict(by_id[rid])
                      for key,value in patch.items():
                          if key in {'requires','excludes'} and isinstance(value,dict):
                              nested=dict(merged.get(key,{})); nested.update(value); merged[key]=nested
                          else: merged[key]=value
                      by_id[rid]=merged
                  else: by_id[rid]=patch
          rows=list(by_id.values())
          matching=[r for r in rows if r.get('study_type')=='treatment' and r.get('available_for_matching') is True]
          def scalar(v):
              if isinstance(v,list): return '/'.join(map(str,v)) if v else 'Unknown'
              return str(v) if v not in (None,'') else 'Unknown'
          stats={
            'effective_total_records':len(rows),
            'current_treatment_opportunities':len(matching),
            'by_country':dict(sorted(Counter(scalar(r.get('country')) for r in matching).items())),
            'by_species':dict(sorted(Counter(scalar(r.get('species')) for r in matching).items())),
            'patch_files_loaded':[p.name for p in patch_paths],
          }
          print('CATALOG_STATS_BEGIN')
          print(json.dumps(stats,indent=2,ensure_ascii=False))
          print('CATALOG_STATS_END')
          PY
