name: Merge Europe primary sweep C
on:
  push:
    paths:
      - 'data/europe_primary_sweep_20260905_c.json'
      - '.github/workflows/merge-europe-primary-sweep-20260905-c.yml'
permissions:
  contents: write
jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Merge verified records safely
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          patch=json.loads(Path('data/europe_primary_sweep_20260905_c.json').read_text())
          p=Path('data/trial_updates.json')
          data=json.loads(p.read_text()) if p.exists() else {'upsert':[], 'delete':[]}
          if isinstance(data,list): data={'upsert':data,'delete':[]}
          ups=data.setdefault('upsert',[])
          byid={r.get('id'):i for i,r in enumerate(ups) if r.get('id')}
          for r in patch.get('upsert',[]):
              rid=r['id']
              if rid in byid: ups[byid[rid]]=r
              else: byid[rid]=len(ups); ups.append(r)
          p.write_text(json.dumps(data,indent=2,ensure_ascii=False)+'\n')
          PY
      - name: Commit merge
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add data/trial_updates.json
          git diff --cached --quiet || git commit -m 'Merge verified Madrid and Ghent treatment trials'
          git push
