name: Expand verified Other Oncology Options
on:
  push:
    paths:
      - '.github/workflows/expand-other-options-20260906.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add verified options
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('pages/2_Additional_Oncology_Options.py')
          s=p.read_text()
          marker='OPTIONS = [\n'
          assert marker in s
          additions = '''    {"id":"osa-elias-eci","species":"Dog","countries":["USA"],"cancers":["Osteosarcoma"],"situations":["After amputation / local control","Adjuvant systemic treatment planning"],"name":"ELIAS Cancer Immunotherapy (ECI)","summary":"USDA-approved autologous vaccine-enhanced adoptive T-cell therapy for canine osteosarcoma, manufactured from the patient’s tumor and immune cells.","access":"USA — available through authorized ECI treatment centers; ELIAS maintains a current nationwide provider directory.","evidence":"Prospective canine clinical evidence supports ECI after amputation. ELIAS also reported an 18-month 2026 ASCENT analysis evaluating one dose of carboplatin followed by ECI versus matched historical carboplatin controls.","evidence_level":"USDA-approved autologous prescription product + prospective canine clinical evidence","sample":"Tumor tissue is required to manufacture the personalized vaccine component; coordinate with an authorized ECI center before surgery/tissue handling whenever possible.","travel":"Treatment is available through authorized centers across the USA; repeated treatment visits are required.","url":"https://eliasanimalhealth.com/ascent-study-summary-18-month-update/","provider_url":"https://eliasanimalhealth.com/","access_url":"https://eliasanimalhealth.com/available-locations/","access_label":"Find an ECI provider","contact_note":"Contact an authorized ECI center before or around amputation so tumor-tissue collection and the treatment sequence can be coordinated.","limitations":"This is a specialized multimodal treatment, not a substitute for appropriate local control. Published and conference evidence should be interpreted in the context of study design; the 2026 ASCENT update used matched historical controls rather than randomized concurrent controls."},
    {"id":"mct-stelfonta","species":"Dog","countries":["USA","Europe"],"cancers":["Mast cell tumor"],"situations":["Non-metastatic injectable mast cell tumor","Surgery unsuitable / local treatment alternative"],"name":"STELFONTA (tigilanol tiglate)","summary":"Intratumoral anticancer treatment that destroys eligible non-metastatic canine mast cell tumors without surgical excision.","access":"USA — FDA-approved prescription treatment with a current Virbac veterinarian locator. Europe — centrally authorized veterinary medicine for eligible non-metastatic canine mast cell tumors.","evidence":"Regulatory approval is supported by prospective clinical efficacy and safety data. Current U.S. labeling covers eligible non-metastatic cutaneous MCTs and subcutaneous MCTs at or distal to the elbow/hock; European authorization is for non-resectable, non-metastatic eligible tumors.","evidence_level":"FDA-approved / EU-authorized veterinary anticancer drug","sample":"A confirmed mast cell tumor diagnosis and staging are needed; no manufacturing tissue sample is required.","travel":"Administered intratumorally by a veterinarian. Availability depends on clinic and country.","url":"https://www.ema.europa.eu/en/medicines/veterinary/EPAR/stelfonta","provider_url":"https://vet-us.virbac.com/stelfonta","access_url":"https://us.virbac.com/stelfonta-find-a-vet","access_label":"Find a STELFONTA veterinarian","contact_phone":"800-338-3659","contact_note":"Ask a veterinarian whether tumor location, volume and metastatic status meet the product indication.","limitations":"Local therapy only; it is not systemically active and is not indicated for metastatic disease. Wound formation is an expected treatment effect and mast-cell degranulation can cause severe reactions; labeled pre/post medications and monitoring are important."},
    {"id":"lymphoma-tanovea","species":"Dog","countries":["USA"],"cancers":["Lymphoma"],"situations":["Lymphoma treatment planning","Relapsed / rescue treatment"],"name":"TANOVEA (rabacfosadine)","summary":"FDA fully approved intravenous antineoplastic drug specifically indicated for canine lymphoma.","access":"USA — prescription oncology treatment administered as a 30-minute IV infusion, generally every 3 weeks for up to five treatments.","evidence":"FDA approval and prospective canine lymphoma studies support antitumor activity. Current Elanco material reports response data and positions TANOVEA as an option including rescue treatment.","evidence_level":"FDA fully approved veterinary anticancer drug","sample":"No manufacturing sample required; lymphoma diagnosis and clinical assessment are required.","travel":"Given in a veterinary clinic as an IV infusion.","url":"https://my.elanco.com/us/tanovea","provider_url":"https://my.elanco.com/us/tanovea","access_url":"https://my.elanco.com/us/tanovea","access_label":"TANOVEA information","contact_note":"Discuss with a veterinary oncologist, especially when considering rescue therapy or an alternative lymphoma regimen.","limitations":"Can cause GI toxicity, neutropenia, dermatologic adverse effects and potentially life-threatening pulmonary fibrosis. It should be selected in context of lymphoma phenotype, prior therapy, comorbidities and standard multidrug options."},
    {"id":"lymphoma-laverdia","species":"Dog","countries":["USA"],"cancers":["Lymphoma"],"situations":["Lymphoma treatment planning","Oral / at-home treatment option"],"name":"LAVERDIA (verdinexor)","summary":"Oral selective inhibitor of nuclear export for canine lymphoma, administered at home by the owner under veterinary prescription.","access":"USA — FDA fully approved for canine lymphoma; prescription only. Full approval replaced the earlier conditional approval in 2026.","evidence":"FDA granted full approval after the sponsor generated effectiveness data required to convert the earlier conditional approval. It is administered twice weekly with at least 72 hours between doses.","evidence_level":"FDA fully approved veterinary anticancer drug","sample":"No manufacturing sample required; confirmed lymphoma diagnosis and veterinary monitoring are required.","travel":"Oral at-home administration after veterinary prescription; monitoring visits remain necessary.","url":"https://www.fda.gov/animal-veterinary/cvm-updates/fda-grants-full-approval-first-oral-treatment-lymphoma-dogs","provider_url":"https://www.anivive.com/","access_url":"https://www.fda.gov/animal-veterinary/cvm-updates/fda-grants-full-approval-first-oral-treatment-lymphoma-dogs","access_label":"FDA approval information","contact_note":"Ask the treating veterinarian/oncologist whether LAVERDIA fits the dog’s lymphoma type and treatment goals and review the cytotoxic-handling instructions before home dosing.","limitations":"Response rates are lower than those expected from standard multidrug chemotherapy in many canine lymphomas. Cytotoxic handling precautions apply, and GI and other adverse effects require monitoring."},
    {"id":"oral-melanoma-oncept","species":"Dog","countries":["USA"],"cancers":["Oral melanoma"],"situations":["Stage II–III after local disease control","Adjuvant immunotherapy"],"name":"ONCEPT Canine Melanoma Vaccine, DNA","summary":"USDA-licensed DNA immunotherapy used as an adjunct after local control of stage II or III canine oral melanoma.","access":"USA — veterinary biologic supplied to approved veterinary practices; the manufacturer has a current purchase-application pathway.","evidence":"Licensed indication is to aid in extending survival in dogs with stage II or III oral melanoma after local disease control. Published evidence includes the original prospective program, while later literature has raised uncertainty about magnitude of benefit; this should be discussed explicitly with an oncologist.","evidence_level":"USDA-licensed veterinary cancer immunotherapy + mixed clinical evidence","sample":"No personalized tumor-manufacturing sample required. Local disease control and appropriate staging are prerequisites for labeled use.","travel":"Administered through veterinary practices able to obtain and deliver ONCEPT using the VET JET system.","url":"https://animalhealth.boehringer-ingelheim.com/pets/canine/products/therapeutics/oncept","provider_url":"https://animalhealth.boehringer-ingelheim.com/pets/canine/products/therapeutics/oncept","access_url":"https://animalhealth.boehringer-ingelheim.com/pets/canine/products/therapeutics/oncept","access_label":"ONCEPT product & access","contact_note":"After local tumor control, ask the veterinary oncologist whether ONCEPT is appropriate and whether their practice can obtain/administer it.","limitations":"Adjunctive treatment, not local tumor control. Evidence for survival benefit is not uniformly convincing across studies, so licensed status should not be interpreted as proof of benefit for every patient."},
    {"id":"ect-usa-europe","species":"Dog","countries":["USA","Europe"],"cancers":["Mast cell tumor","Soft tissue sarcoma","Squamous cell carcinoma","Oral melanoma","Solid tumor — other"],"situations":["Incomplete surgical margins / scar treatment","Superficial or localized tumor","Surgery difficult or not feasible"],"name":"Veterinary electrochemotherapy (ECT)","summary":"Local cancer treatment combining chemotherapy, commonly bleomycin, with brief electric pulses to greatly increase drug uptake in the treated tumor or surgical bed.","access":"USA and Europe — available at selected veterinary oncology/referral centers. Access is center-specific rather than a single commercial program.","evidence":"Multiple canine and feline clinical studies and a 2024 Veterinary and Comparative Oncology review support ECT as an adjuvant or alternative local treatment for selected tumors. Current referral services such as the Royal Veterinary College describe use for incompletely excised tumors and gross superficial/localized tumors.","evidence_level":"Published veterinary clinical evidence + current specialty-center access","sample":"Definitive cancer diagnosis and appropriate staging are generally required; no manufacturing tissue sample is required.","travel":"Requires treatment at a center with an electroporator and trained oncology team; short anesthesia or deep sedation is commonly used.","url":"https://pubmed.ncbi.nlm.nih.gov/38866596/","provider_url":"https://www.rvc.ac.uk/small-animal-vet/specialist-referrals/clinical-services/veterinary-oncology/electrochemotherapy-for-small-animals","access_url":"https://www.rvc.ac.uk/small-animal-vet/specialist-referrals/clinical-services/veterinary-oncology/electrochemotherapy-for-small-animals","access_label":"Example specialist ECT service","contact_note":"Ask a veterinary oncologist whether ECT is appropriate for the tumor type/location and identify the nearest center that currently performs it.","limitations":"Local treatment, not a systemic metastasis treatment. Suitability and evidence vary substantially by tumor type, size, location and whether gross disease or microscopic residual disease is being treated."},
'''
          ids=['osa-elias-eci','mct-stelfonta','lymphoma-tanovea','lymphoma-laverdia','oral-melanoma-oncept','ect-usa-europe']
          for i in ids:
              assert f'"id":"{i}"' not in s
          s=s.replace(marker, marker+additions,1)
          p.write_text(s)
          PY
          python -m py_compile pages/2_Additional_Oncology_Options.py
          for id in osa-elias-eci mct-stelfonta lymphoma-tanovea lymphoma-laverdia oral-melanoma-oncept ect-usa-europe; do grep -q "\"id\":\"$id\"" pages/2_Additional_Oncology_Options.py; done
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add pages/2_Additional_Oncology_Options.py
          git diff --cached --quiet || git commit -m 'Expand verified Other Oncology Options'
          git push
