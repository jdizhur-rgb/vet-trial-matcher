name: Expand Other Options
on:
  push:
    paths:
      - '.github/workflows/expand-other-options-20260906.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/expand_other_options_20260906.py
      - run: python -m py_compile pages/2_Additional_Oncology_Options.py
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add pages/2_Additional_Oncology_Options.py
          git diff --cached --quiet || git commit -m 'Expand verified Other Oncology Options'
          git push
