name: Apply verified weekly oncology catalog corrections

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/weekly-db-audit-fix-20260914.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply narrowly scoped catalog corrections
        run: |
          python - <<'PY'
          import json
          from collections import Counter
          from pathlib import Path

          path = Path('data/trials_base.json')
          rows = json.loads(path.read_text(encoding='utf-8'))
          by_id = {}
          for r in rows:
              by_id.setdefault(r.get('id'), []).append(r)

          required = {
              'fr-oniris-osa-biocera-vet-cement',
              'osu-probiome-bladder',
              'osu-probiome-bladder-cancer',
              'penn-mammary-margin',
              'penn-mammary-margin-imaging-2026',
          }
          missing = sorted(x for x in required if x not in by_id)
          if missing:
              raise SystemExit(f'expected target records missing: {missing}')

          raw_dups = {rid:n for rid,n in Counter(r.get('id') for r in rows).items() if rid and n > 1}
          print('RAW_DUPLICATE_IDS', raw_dups)
          unexpected = sorted(set(raw_dups) - required)
          if unexpected:
              raise SystemExit(f'unexpected exact duplicate IDs require separate review: {unexpected}')

          def best(rid):
              return max(by_id[rid], key=lambda r: (len(r), len(json.dumps(r, ensure_ascii=False)))) .copy()

          # Oniris BIOCERA-VET is currently recruiting, but the primary page describes
          # palliative bone stabilization/pain relief rather than an anticancer therapy.
          # Keep it in the catalog as verified research, but outside the treatment matcher.
          oniris = best('fr-oniris-osa-biocera-vet-cement')
          oniris.update({
              'center': 'Oniris Veterinary Teaching Hospital',
              'cancers': ['Osteosarcoma'],
              'url': 'https://chuv.oniris-nantes.fr/animaux-de-compagnie/chirurgie/osteosarcomes-appendiculaires-chez-le-chien',
              'contacts': 'Oniris Small Animal Surgery — chirurgie-ac@oniris-nantes.fr; +33 2 40 68 76 22',
              'status': 'Recruiting — primary Oniris page confirms enrollment is currently open',
              'status_confidence': 'confirmed_current',
              'verified': '2026-09-14',
              'available_for_matching': False,
              'study_type': 'supportive_care',
              'owner_prescreen_required': True,
              'notes': 'Oniris currently recruits large- and giant-breed dogs with appendicular osteosarcoma for minimally invasive BIOCERA-VET calcium-phosphate bone-cement injection. The primary page describes this as a palliative limb-preserving approach intended to stabilize the tumor-bearing bone and relieve pain; it does not provide tumor-directed anticancer therapy, so it is excluded from the treatment matcher under the treatment-only scope.'
          })
          oniris.pop('cancer_type', None)

          # Ohio State's July 2026 current-enrolling list no longer includes the
          # Probiome bladder-cancer protocol. Absence is not proof of closure, so do
          # not call it closed; hide it pending protocol-level reconfirmation.
          osu = best('osu-probiome-bladder')
          osu.update({
              'status': 'Enrollment requires reconfirmation — not listed on Ohio State’s July 2026 current-enrolling trial list',
              'status_confidence': 'needs_reconfirmation',
              'available_for_matching': False,
              'verified': '2026-09-14',
              'notes': 'All enrolled dogs in the published protocol receive standard vinblastine plus piroxicam; probiotic versus placebo applies only to the experimental adjunct. Ohio State’s July 2026 current-enrolling list no longer includes this protocol, so current enrollment must be reconfirmed directly before it can return to patient-facing matching.'
          })

          # Penn's direct 2026 page confirms the mammary surgical-margin study is
          # recruiting. Retain the newer direct-source record and remove the older
          # semantic duplicate.
          penn = best('penn-mammary-margin-imaging-2026')
          penn.update({
              'status': 'Recruiting — Penn Vet current clinical trials page',
              'status_confidence': 'confirmed_current',
              'available_for_matching': True,
              'verified': '2026-09-14'
          })

          replacements = {
              'fr-oniris-osa-biocera-vet-cement': oniris,
              'osu-probiome-bladder': osu,
              'penn-mammary-margin-imaging-2026': penn,
          }
          remove = {'osu-probiome-bladder-cancer', 'penn-mammary-margin'}
          emitted = set()
          out = []
          for r in rows:
              rid = r.get('id')
              if rid in remove:
                  continue
              if rid in replacements:
                  if rid in emitted:
                      continue
                  out.append(replacements[rid])
                  emitted.add(rid)
              else:
                  out.append(r)

          if set(replacements) - emitted:
              raise SystemExit(f'failed to emit replacements: {sorted(set(replacements)-emitted)}')
          ids = [r.get('id') for r in out]
          if len(ids) != len(set(ids)):
              dup = [x for x,n in Counter(ids).items() if x and n > 1]
              raise SystemExit(f'exact duplicate IDs remain after correction: {dup}')
          assert 'osu-probiome-bladder-cancer' not in ids
          assert 'penn-mammary-margin' not in ids
          assert next(r for r in out if r['id']=='osu-probiome-bladder')['available_for_matching'] is False
          assert next(r for r in out if r['id']=='fr-oniris-osa-biocera-vet-cement')['study_type'] == 'supportive_care'
          assert next(r for r in out if r['id']=='penn-mammary-margin-imaging-2026')['status_confidence'] == 'confirmed_current'

          path.write_text(json.dumps(out, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')
          print('CATALOG_ROWS', len(rows), '->', len(out))
          PY
      - name: Validate catalog and matcher
        run: |
          python scripts/full_catalog_audit.py data/trials_base.json
          python -m py_compile app.py pages/1_Clinical_Trial_Finder.py
          python - <<'PY'
          import json
          from pathlib import Path
          rows=json.loads(Path('data/trials_base.json').read_text())
          active=[r for r in rows if r.get('available_for_matching',True) and r.get('status_confidence') in {'current','confirmed_current'} and r.get('study_type','treatment') in {'treatment','other_treatment_access'}]
          ids={r['id'] for r in active}
          assert 'penn-mammary-margin-imaging-2026' in ids
          assert 'penn-mammary-margin' not in ids
          assert 'osu-probiome-bladder' not in ids
          assert 'osu-probiome-bladder-cancer' not in ids
          assert 'fr-oniris-osa-biocera-vet-cement' not in ids
          print('ACTIVE_TREATMENTS_AFTER_AUDIT', len(active))
          PY
          read add del file <<<"$(git diff --numstat -- data/trials_base.json)"
          echo "DIFF_LINES add=$add del=$del file=$file"
          if [ $((add + del)) -gt 500 ]; then
            echo 'Unexpectedly large catalog rewrite; refusing to commit.' >&2
            exit 1
          fi
      - name: Commit verified corrections and remove one-time workflow
        run: |
          rm .github/workflows/weekly-db-audit-fix-20260914.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/trials_base.json .github/workflows/weekly-db-audit-fix-20260914.yml
          git diff --cached --check
          git commit -m 'Apply verified weekly oncology catalog audit'
          git push
