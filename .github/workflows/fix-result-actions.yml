name: Fix result actions
on:
  push:
    paths:
      - '.github/workflows/fix-result-actions.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch frameless result actions
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('app.py')
          s=p.read_text()
          anchor='_orig={n:getattr(st,n) for n in ["markdown","title","header","selectbox","checkbox","number_input","radio","text_input","multiselect","expander","link_button","write","button"]}\n'
          patch='''_components_html_orig=components.html\ndef _components_html(body,*a,**k):\n    if isinstance(body,str) and "Copy results" in body and "Save as PDF" in body:\n        return st.html(body, unsafe_allow_javascript=True)\n    return _components_html_orig(body,*a,**k)\ncomponents.html=_components_html\n'''
          if patch not in s:
              assert anchor in s, 'app.py anchor not found'
              s=s.replace(anchor,anchor+patch,1)
          old='''finally:\n    for n,v in _orig.items():setattr(st,n,v)\n'''
          new='''finally:\n    components.html=_components_html_orig\n    for n,v in _orig.items():setattr(st,n,v)\n'''
          if new not in s:
              assert old in s, 'restore anchor not found'
              s=s.replace(old,new,1)
          p.write_text(s)
          PY
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app.py
          git diff --cached --quiet || git commit -m "Fix Copy and Save PDF actions"
          git push
