name: Refresh owner cancer copy 2026-09-10
on:
  push:
    paths: ['.github/workflows/refresh-owner-cancer-copy-20260910.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile and regenerate complete SEO site
        run: |
          python -m py_compile seo/generate_seo.py seo/generate_seo_strict.py seo/cancer_page_enhancements.py seo/cancer_owner_content.py
          python seo/generate_seo_strict.py
      - name: Verify every English cancer page uses reviewed owner copy
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          root=Path('seo/site')
          pages=(list(root.glob('north-america/dogs/*/index.html'))+
                 list(root.glob('north-america/cats/*/index.html'))+
                 list(root.glob('uk-europe/dogs/*/index.html'))+
                 list(root.glob('uk-europe/cats/*/index.html')))
          assert pages, 'No English cancer pages found'
          for p in pages:
              s=p.read_text(encoding='utf-8')
              assert 'How it is usually treated' in s, p
              assert 'What can affect treatment choices' in s, p
              assert 'Standard treatment' not in s, p
              assert '<div class="cancer-page">' in s, p
              assert re.search(r'<link rel="canonical" href="https://jdizhur-rgb.github.io/vet-trial-matcher/', s), p
              assert '100% FREE' in s, p
          assert (root/'centers').exists(), 'Center pages disappeared'
          assert (root/'sitemap.xml').exists(), 'Sitemap missing'
          print('OWNER_COPY_VERIFIED', len(pages))
          PY
      - name: Commit generated pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add seo/site
          git commit -m "Refresh owner-facing copy on all cancer pages" && git push || true
