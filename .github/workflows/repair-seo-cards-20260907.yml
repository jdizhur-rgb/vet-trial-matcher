name: Repair SEO treatment cards
on:
  push:
    paths:
      - 'scripts/repair_seo_cards_20260907.py'
      - '.github/workflows/repair-seo-cards-20260907.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/repair_seo_cards_20260907.py
      - run: python -m py_compile seo/generate_seo.py
      - run: python seo/generate_seo.py
      - name: Verify representative rich page
        run: |
          P=seo/site/north-america/dogs/histiocytic-sarcoma/index.html
          test -f "$P"
          grep -q 'Key eligibility:' "$P"
          grep -q 'Official study / treatment page' "$P"
          grep -q '@media(max-width:600px)' "$P"
          grep -q 'Cancer Trial Finder For Dogs And Cats' "$P"
          ! grep -q 'csu-tcell-osa-sts-2026' "$P" || true
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add seo/generate_seo.py
          git diff --cached --quiet || git commit -m "Restore detailed SEO treatment cards"
          git push
