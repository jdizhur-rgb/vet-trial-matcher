name: Connect modular trial patches

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/connect-modular-trial-patches.yml'

permissions:
  contents: write

jobs:
  patch-loader:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch only the catalog loader
        shell: bash
        run: |
          python -c 'from pathlib import Path; p=Path("pages/1_Clinical_Trial_Finder.py"); s=p.read_text(encoding="utf-8"); old="    _updates_path = _root / \"data\" / \"trial_updates.json\"\n    if _updates_path.exists():\n        with _updates_path.open(encoding=\"utf-8\") as _fh:\n            _doc = _json.load(_fh)\n        for _trial_id in _doc.get(\"delete\", []):\n            _by_id.pop(_trial_id, None)\n        for _patch in _doc.get(\"upsert\", []):\n            _trial_id = _patch[\"id\"]\n            if _trial_id in _by_id:\n                _by_id[_trial_id].update(_patch)\n            else:\n                _by_id[_trial_id] = _patch\n"; new="    # Legacy consolidated updates plus explicitly approved small catalog patches.\n    # New catalog work belongs in small JSON files; do not grow trial_updates.json.\n    _patch_paths = [\n        _root / \"data\" / \"trial_updates.json\",\n        _root / \"data\" / \"discovery_aurelius_20260905.json\",\n    ]\n    for _updates_path in _patch_paths:\n        if not _updates_path.exists():\n            continue\n        with _updates_path.open(encoding=\"utf-8\") as _fh:\n            _doc = _json.load(_fh)\n        for _trial_id in _doc.get(\"delete\", []):\n            _by_id.pop(_trial_id, None)\n        for _patch in _doc.get(\"upsert\", []):\n            _trial_id = _patch[\"id\"]\n            if _trial_id in _by_id:\n                _by_id[_trial_id].update(_patch)\n            else:\n                _by_id[_trial_id] = _patch\n"; assert s.count(old)==1, "Expected loader block not found exactly once; refusing edit"; p.write_text(s.replace(old,new,1),encoding="utf-8")'

      - name: Validate before commit
        shell: bash
        run: |
          python -m py_compile pages/1_Clinical_Trial_Finder.py
          python -c 'import json; from pathlib import Path; p=Path("data/discovery_aurelius_20260905.json"); d=json.loads(p.read_text(encoding="utf-8")); assert isinstance(d.get("upsert"), list); assert isinstance(d.get("delete"), list)'
          git diff --check
          git diff -- pages/1_Clinical_Trial_Finder.py

      - name: Commit validated loader change
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add pages/1_Clinical_Trial_Finder.py
          git diff --cached --quiet && exit 0
          git commit -m "Connect Aurelius modular catalog patch"
          git push
