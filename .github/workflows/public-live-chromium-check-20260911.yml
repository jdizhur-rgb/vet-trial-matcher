name: Public live Chromium check
on:
  push:
    branches: [main]
    paths: ['.github/workflows/public-live-chromium-check-20260911.yml']
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install Playwright
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium
      - name: Compare public wrapper, embed, and inner app
        run: |
          python - <<'PY'
          from playwright.sync_api import sync_playwright
          URLS=[
            ('BASE','https://c-trials.streamlit.app/'),
            ('EMBED','https://c-trials.streamlit.app/?embed=true'),
            ('INNER','https://c-trials.streamlit.app/~/+/'),
          ]
          with sync_playwright() as p:
              b=p.chromium.launch(headless=True)
              for label,url in URLS:
                  ctx=b.new_context(viewport={"width":390,"height":844},is_mobile=True,has_touch=True)
                  page=ctx.new_page(); errs=[]; nav=[]
                  page.on('pageerror',lambda e: errs.append(str(e)))
                  page.on('framenavigated',lambda f: nav.append(f.url) if f==page.main_frame else None)
                  r=page.goto(url,wait_until='domcontentloaded',timeout=60000)
                  print(label,'STATUS',r.status if r else None)
                  for i in range(6):
                      page.wait_for_timeout(3000)
                      txt=page.locator('body').inner_text()
                      inner=[]
                      for f in page.frames:
                          if f != page.main_frame:
                              try: inner.append((f.url,len(f.locator('body').inner_text())))
                              except: pass
                      print(label,'TICK',i+1,'BODYLEN',len(txt),'HEAD',repr(txt[:160]),'FRAMES',inner)
                  btn=page.get_by_role('button',name='Find potential trials')
                  print(label,'MATCH_BUTTONS',btn.count(),'ERRORS',errs,'NAV',nav)
                  if btn.count():
                      btn.first.click(); page.wait_for_timeout(4000)
                      txt=page.locator('body').inner_text(); print(label,'MATCH_CLICKED','Results' in txt,'BODYLEN',len(txt))
                  ctx.close()
              b.close()
          PY
