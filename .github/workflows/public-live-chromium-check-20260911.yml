name: Public live Chromium check
on:
  push:
    branches: [main]
    paths: ['.github/workflows/public-live-chromium-check-20260911.yml']
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install Playwright
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium
      - name: Trace public live app
        run: |
          python - <<'PY'
          from playwright.sync_api import sync_playwright
          with sync_playwright() as p:
              b=p.chromium.launch(headless=True)
              page=b.new_page()
              nav=[]
              page.on('console', lambda m: print('CONSOLE:',m.type,m.text))
              page.on('pageerror', lambda e: print('PAGEERROR:',e))
              page.on('framenavigated', lambda f: nav.append(f.url) if f==page.main_frame else None)
              page.on('response', lambda r: print('HTTP',r.status,r.url) if r.status>=400 else None)
              page.on('requestfailed', lambda r: print('REQFAIL',r.url,r.failure))
              def ws(w):
                  print('WS OPEN',w.url)
                  w.on('close',lambda: print('WS CLOSE',w.url))
                  w.on('socketerror',lambda e: print('WS ERROR',w.url,e))
              page.on('websocket',ws)
              page.goto('https://c-trials.streamlit.app/',wait_until='domcontentloaded',timeout=60000)
              for i in range(6):
                  page.wait_for_timeout(5000)
                  print('TICK',i+1,'BODYLEN',len(page.locator('body').inner_text()),'URL',page.url)
              print('NAV',nav)
              b.close()
          PY
