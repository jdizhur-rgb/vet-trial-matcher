name: Public live Chromium check
on:
  push:
    branches: [main]
    paths: ['.github/workflows/public-live-chromium-check-20260911.yml']
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install Playwright
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium
      - name: Wait for Streamlit cold rebuild
        run: sleep 60
      - name: Check public live app
        run: |
          python - <<'PY'
          from playwright.sync_api import sync_playwright
          with sync_playwright() as p:
              b=p.chromium.launch(headless=True)
              page=b.new_page()
              events=[]
              page.on('console', lambda m: print('CONSOLE:',m.type,m.text))
              page.on('pageerror', lambda e: print('PAGEERROR:',e))
              page.on('framenavigated', lambda f: events.append(('nav',f.url)) if f==page.main_frame else None)
              page.goto('https://c-trials.streamlit.app/',wait_until='domcontentloaded',timeout=60000)
              for i in range(6):
                  page.wait_for_timeout(5000)
                  print('TICK',i+1,'URL',page.url,'TITLE',page.title(),'BODY',page.locator('body').inner_text()[:500].replace('\n',' | '))
              print('NAV_EVENTS',events)
              b.close()
          PY
