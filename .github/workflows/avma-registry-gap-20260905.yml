name: AVMA registry gap audit 2026-09-05
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/apply_avma_registry_gap_20260905.py'
      - '.github/workflows/avma-registry-gap-20260905.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply AVMA registry gap records
        run: python scripts/apply_avma_registry_gap_20260905.py
      - name: Validate JSON
        run: python -m json.tool data/trial_updates.json >/dev/null
      - name: Commit results
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/trial_updates.json
          git diff --cached --quiet || git commit -m 'Add treatment opportunities found in AVMA registry gap audit'
          git push
