name: OA prototype checks

on:
  push:
    branches: ["research/oa-matcher"]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate OA catalog and matcher
        run: |
          python scripts/validate_oa_prototype.py
          python scripts/test_oa_matcher.py
          python scripts/test_streamlit_pages.py
