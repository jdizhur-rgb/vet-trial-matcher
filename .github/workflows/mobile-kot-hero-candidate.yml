name: Mobile Kot hero candidate check

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/mobile-kot-hero-candidate.yml'

permissions:
  contents: read

jobs:
  build-candidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Assemble current production stack with refined mobile hero and desktop Kot crop
        run: |
          cp seo/center_directory.py /tmp/main-center-directory.py
          git fetch origin cancer-page-audit --depth=1
          git checkout FETCH_HEAD -- seo/
          cp /tmp/main-center-directory.py seo/center_directory.py
          git fetch origin mobile-kot-hero-safe-20260912 --depth=1
          git checkout FETCH_HEAD -- seo/site_shell.py seo/assets/kot-home.jpg
          python - <<'PY'
          from pathlib import Path
          p=Path('seo/site_shell.py')
          s=p.read_text(encoding='utf-8')
          desktop_old='.hero-photo img{width:100%;height:100%;aspect-ratio:auto;object-fit:cover;object-position:center 48%;border:0;border-radius:0;box-shadow:none}'
          desktop_new='.hero-photo img{width:110%;max-width:none;height:100%;aspect-ratio:auto;object-fit:cover;object-position:left 48%;border:0;border-radius:0;box-shadow:none}'
          if desktop_old not in s:
              raise SystemExit('expected desktop hero image rule not found')
          s=s.replace(desktop_old,desktop_new,1)
          old='@media(max-width:800px){.site-header{left:auto;width:auto}.home-hero{position:relative;display:block!important;min-height:clamp(440px,120vw,540px);padding:0!important;overflow:hidden;border-radius:10px;background:#17324d}.hero-photo{position:absolute;inset:0;max-width:none;width:100%;height:100%;margin:0}.hero-photo:after{content:"";display:block;position:absolute;inset:0;background:linear-gradient(180deg,rgba(10,28,45,.90) 0%,rgba(10,28,45,.76) 48%,rgba(10,28,45,.28) 100%)}.hero-photo img{width:100%;height:100%;aspect-ratio:auto;object-fit:cover;object-position:62% 48%;border:0;border-radius:0;box-shadow:none}.hero-copy{position:relative;z-index:1;max-width:none;padding:28px 22px 24px;color:#fff}.hero-copy h1{color:#fff;font-size:clamp(30px,8.5vw,38px);line-height:1.08;margin:0 0 13px}.hero-copy .eyebrow,.hero-copy .lead{color:#fff}.hero-copy .lead{font-size:16px;line-height:1.45;max-width:520px}.hero-copy .cta{background:#fff;color:#175b8c!important}.hero-copy .secondary-cta{border-color:rgba(255,255,255,.75);background:rgba(23,50,77,.3);color:#fff!important}}'
          new='@media(max-width:800px){.site-header{left:auto;width:auto}.home-hero{position:relative;display:block!important;min-height:360px;padding:0!important;overflow:hidden;border-radius:10px;background:#17324d}.hero-photo{position:absolute;inset:0;max-width:none;width:100%;height:100%;margin:0}.hero-photo:after{content:"";display:block;position:absolute;inset:0;background:linear-gradient(90deg,rgba(10,28,45,.86) 0%,rgba(10,28,45,.70) 42%,rgba(10,28,45,.20) 72%,rgba(10,28,45,.06) 100%)}.hero-photo img{width:100%;height:100%;aspect-ratio:auto;object-fit:cover;object-position:72% 52%;border:0;border-radius:0;box-shadow:none}.hero-copy{position:relative;z-index:1;max-width:68%;padding:24px 18px 20px;color:#fff}.hero-copy h1{color:#fff;font-size:clamp(25px,7vw,31px);line-height:1.08;margin:0 0 10px}.hero-copy .eyebrow,.hero-copy .lead{color:#fff}.hero-copy .eyebrow{font-size:13px;line-height:1.28}.hero-copy .lead{font-size:14px;line-height:1.38;max-width:360px}.hero-actions{gap:9px;margin:16px 0 0}.hero-copy .cta,.hero-copy .secondary-cta{padding:9px 12px;font-size:14px}.hero-copy .cta{background:#fff;color:#175b8c!important}.hero-copy .secondary-cta{border-color:rgba(255,255,255,.75);background:rgba(23,50,77,.22);color:#fff!important}}'
          if old not in s:
              raise SystemExit('expected mobile hero block not found')
          p.write_text(s.replace(old,new),encoding='utf-8')
          PY
      - name: Build candidate
        run: python seo/build_production_site.py
      - name: Include static files
        run: cp -a seo/static/. seo/site/
      - name: Validate desktop Kot crop and existing mobile invariants
        run: |
          python - <<'PY'
          from pathlib import Path
          root=Path('seo/site')
          pages=list(root.rglob('index.html'))
          assert len(pages)>=100, len(pages)
          home=(root/'index.html').read_text(encoding='utf-8')
          assert '<header class="site-header">' in home
          assert '<section class="home-hero">' in home
          assert '/assets/kot-home.jpg' in home
          assert 'min-height:390px' in home
          assert 'width:110%;max-width:none;height:100%' in home
          assert 'object-position:left 48%' in home
          assert '.site-header{left:auto;width:auto;margin-left:-26px;margin-right:-26px' in home
          assert 'min-height:360px' in home
          assert 'object-position:72% 52%' in home
          assert 'max-width:68%' in home
          assert 'clamp(440px,120vw,540px)' not in home
          assert 'Find clinical trials and cancer treatment options for your pet' in home
          asset=root/'assets/kot-home.jpg'
          assert asset.exists() and asset.stat().st_size>10000, asset
          cancer=[]
          for region in ('north-america','uk-europe'):
            for species in ('dogs','cats'):
              cancer += list((root/region/species).glob('*/index.html'))
          assert len(cancer)>=88, len(cancer)
          print('DESKTOP_KOT_RIGHT_CANDIDATE_OK',len(pages),len(cancer),asset.stat().st_size)
          PY
      - name: Save candidate artifact
        uses: actions/upload-artifact@v4
        with:
          name: desktop-kot-right-candidate
          path: seo/site/
          retention-days: 3
