name: Restore funding highlight styling
on:
  push:
    branches: [main]
    paths: ['.github/workflows/restore-funding-highlight-20260910.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore funding badges
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('app.py')
          s=p.read_text(encoding='utf-8')
          old='def markdown(body,*a,**k):\n    if isinstance(body,str):'
          new='''def markdown(body,*a,**k):
    if isinstance(body,str):
        if body.startswith("**Trial funding:**"):
            funding=body.split(":**",1)[1].strip() if ":**" in body else body.replace("**Trial funding:**","").strip()
            low=funding.lower()
            if any(x in low for x in ("fully funded","no cost to the owner","at no cost","all treatments and procedures")):
                cls="funding-full"
            elif any(x in low for x in ("partially funded","partial funding","partially covered","some study costs","some costs")):
                cls="funding-partial"
            else:
                cls="funding-neutral"
            return _orig["markdown"](f'<div class="{cls}"><strong>Trial funding:</strong> {funding}</div>',unsafe_allow_html=True)
'''
          if old not in s:
              raise SystemExit('markdown hook not found')
          s=s.replace(old,new,1)
          css='''.funding-full{background:#edf7ef;border:1px solid #cfe6d4;border-radius:.65rem;padding:.55rem .7rem;margin:.35rem 0;color:#285b38}.funding-full strong{color:#285b38}.funding-partial{background:#fff8e6;border:1px solid #eadcaf;border-radius:.65rem;padding:.55rem .7rem;margin:.35rem 0;color:#6b5722}.funding-neutral{background:#f6f6f6;border:1px solid #e3e3e3;border-radius:.65rem;padding:.55rem .7rem;margin:.35rem 0;color:#4b4642}\n'''
          marker='</style>""",unsafe_allow_html=True)'
          if marker not in s:
              raise SystemExit('style marker not found')
          s=s.replace(marker,css+marker,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py
          git diff --cached --quiet || git commit -m "Restore funding highlight badges"
          git push
