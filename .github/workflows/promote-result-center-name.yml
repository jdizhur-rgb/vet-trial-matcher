name: Promote result center name

on:
  push:
    paths:
      - 'scripts/promote_result_center_name.py'
      - '.github/workflows/promote-result-center-name.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply exact UI patch
        run: python scripts/promote_result_center_name.py
      - name: Commit app presentation change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py
          if git diff --cached --quiet; then
            echo "Result-center presentation already current"
          else
            git commit -m "Make institution name prominent above trial title"
            git push origin main
          fi
