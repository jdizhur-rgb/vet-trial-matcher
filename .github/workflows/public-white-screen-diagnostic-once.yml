name: Public white-screen diagnostic once
on:
  push:
    branches: [streamlit-prod]
    paths: ['.github/workflows/public-white-screen-diagnostic-once.yml']
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser
        run: |
          pip install playwright
          python -m playwright install chromium
      - name: Inspect public app runtime
        run: |
          python - <<'PY'
          from playwright.sync_api import sync_playwright
          import time
          url='https://c-trials.streamlit.app/'
          with sync_playwright() as p:
              b=p.chromium.launch(headless=True)
              page=b.new_page(viewport={'width':1440,'height':1200})
              page.on('console', lambda m: print('CONSOLE',m.type,m.text))
              page.on('pageerror', lambda e: print('PAGEERROR',e))
              page.on('requestfailed', lambda r: print('REQFAILED',r.url,r.failure))
              try:
                  resp=page.goto(url,wait_until='domcontentloaded',timeout=90000)
                  print('HTTP', resp.status if resp else None)
              except Exception as e:
                  print('GOTO_ERROR',repr(e))
              for sec in (2,5,10,20,40):
                  page.wait_for_timeout((sec-(0 if sec==2 else prev))*1000 if 'prev' in locals() else sec*1000)
                  prev=sec
                  body=page.locator('body').inner_text(timeout=10000)
                  html=page.locator('body').inner_html(timeout=10000)
                  print('AT',sec,'BODY_LEN',len(body),'HTML_LEN',len(html),'TEXT',repr(body[:800]))
                  print('SELECTBOXES',page.locator('[data-testid="stSelectbox"]').count(),'BUTTONS',page.get_by_role('button').count())
              page.screenshot(path='/tmp/public-white-screen.png',full_page=True)
              print('FINAL_URL',page.url)
              b.close()
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: public-white-screen
          path: /tmp/public-white-screen.png
