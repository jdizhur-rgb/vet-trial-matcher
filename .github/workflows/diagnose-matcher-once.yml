name: Diagnose matcher once
on:
  push:
    branches: [streamlit-prod]
    paths: ['.github/workflows/diagnose-matcher-once.yml']
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: streamlit-prod
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Execute real Streamlit widget flow
        run: |
          python - <<'PY'
          from streamlit.testing.v1 import AppTest
          at=AppTest.from_file('app.py', default_timeout=30).run()
          def sb(label):
              for x in at.selectbox:
                  if x.label==label:return x
              raise RuntimeError(f'missing selectbox {label}; have {[x.label for x in at.selectbox]}')
          sb('Country / region').select('USA')
          sb('Cancer type').select('Oral melanoma')
          at.run()
          sb('How certain is the diagnosis?').select('Confirmed by pathology/cytology')
          sb('Current tumor status').select('Tumor still present / measurable')
          sb('Metastases').select('Confirmed metastases')
          sb('Has your veterinarian said the disease is localized?').select('No')
          at.run()
          buttons=[b for b in at.button if b.label=='Find potential trials']
          if not buttons: raise RuntimeError(f'Find button missing; have {[b.label for b in at.button]}')
          buttons[0].click()
          at.run()
          print('===RENDERED===')
          for kind in ('markdown','text','caption','info','success','warning','error'):
              for e in getattr(at,kind):
                  v=getattr(e,'value',None)
                  if v is not None and any(s in str(v) for s in ['Ethos','Participating sites','Metropolitan Veterinary','Summit Veterinary','Veterinary Specialty Hospital','Contact:','UC Davis','Bridge Animal']):
                      print(kind,repr(str(v)))
          print('EXCEPTIONS=',[(getattr(e,'message',None),getattr(e,'stack_trace',None)) for e in at.exception])
          PY