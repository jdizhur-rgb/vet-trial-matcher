name: Apply company pipeline promotions

on:
  push:
    paths:
      - 'scripts/apply_company_pipeline_promotions_20260906.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply verified promotions
        run: python scripts/apply_company_pipeline_promotions_20260906.py
      - name: Validate JSON
        run: python -m json.tool data/trial_updates.json >/dev/null
      - name: Commit catalog update
        run: |
          if git diff --quiet -- data/trial_updates.json; then
            echo 'No catalog changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/trial_updates.json
          git commit -m 'Promote verified company pipeline treatment trials'
          git push
