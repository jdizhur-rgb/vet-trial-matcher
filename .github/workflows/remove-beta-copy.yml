name: Remove beta copy
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/remove-beta-copy.yml'
      - 'scripts/remove_beta_copy_20260906.py'
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/remove_beta_copy_20260906.py
      - run: python -m py_compile app.py pages/1_Clinical_Trial_Finder.py
      - name: Commit changes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app.py pages/1_Clinical_Trial_Finder.py
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Remove beta label and update treatment finder copy"
          git push
