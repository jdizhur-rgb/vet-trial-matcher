name: Add Vidium SearchLight option
on:
  push:
    paths:
      - 'scripts/add_vidium_option_20260907.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/add_vidium_option_20260907.py
      - run: python -m py_compile pages/2_Additional_Oncology_Options.py
      - run: grep -q 'vidium-searchlight-genomic-guidance' pages/2_Additional_Oncology_Options.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pages/2_Additional_Oncology_Options.py
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Add Vidium SearchLight genomic guidance"
            git push
          fi
