name: Feature database stats

on:
  push:
    branches:
      - feature/database-stats

permissions:
  contents: write

jobs:
  patch-and-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/database-stats
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Add safe database statistics line
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('pages/1_Clinical_Trial_Finder.py')
          text = path.read_text(encoding='utf-8')
          marker = '# SAFE_DATABASE_STATS_V1'
          if marker not in text:
              anchor = "st.title('🐾 Vet Cancer Trial Finder')\nst.markdown('Answer what you know. It is completely fine to choose **I don’t know**.')"
              replacement = "\n".join([
                  "st.title('🐾 Vet Cancer Trial Finder')",
                  "",
                  "# SAFE_DATABASE_STATS_V1",
                  "# Read-only summary of the catalog already loaded into TRIALS.",
                  "_stats_trials = [",
                  "    t for t in TRIALS",
                  "    if t.get('available_for_matching', True)",
                  "    and is_current_trial(t)",
                  "    and t.get('study_type', 'treatment') in {'treatment', 'other_treatment_access'}",
                  "]",
                  "_stats_centers = {str(t.get('center', '')).strip() for t in _stats_trials if str(t.get('center', '')).strip()}",
                  "_stats_excluded_cancers = {'Cancer — any type', 'Other / not sure', UNLISTED_CANCER}",
                  "_stats_cancers = {",
                  "    c for c in CANCERS",
                  "    if c not in _stats_excluded_cancers",
                  "    and any(trial_accepts_diagnosis(t, c)[0] for t in _stats_trials)",
                  "}",
                  "_stats_country_aliases = {'United Kingdom': 'UK', 'The Netherlands': 'Netherlands', 'Czech Republic': 'Czechia'}",
                  "_stats_countries = {",
                  "    _stats_country_aliases.get(str(t.get('country', 'USA')).strip(), str(t.get('country', 'USA')).strip())",
                  "    for t in _stats_trials",
                  "    if str(t.get('country', 'USA')).strip()",
                  "}",
                  "st.caption(",
                  "    f\"{len(_stats_trials)} active treatment opportunities · \"",
                  "    f\"{len(_stats_centers)} centers · \"",
                  "    f\"{len(_stats_cancers)} cancer types · \"",
                  "    f\"{len(_stats_countries)} countries\"",
                  ")",
                  "",
                  "st.markdown('Answer what you know. It is completely fine to choose **I don’t know**.')",
              ])
              if anchor not in text:
                  raise SystemExit('Expected title/intro anchor not found; refusing to modify file')
              text = text.replace(anchor, replacement, 1)
              path.write_text(text, encoding='utf-8')
          PY

      - name: Syntax check
        run: python -m py_compile pages/1_Clinical_Trial_Finder.py app.py

      - name: Compute and verify displayed statistics
        run: |
          python - <<'PY'
          import ast, json
          from pathlib import Path

          src = Path('pages/1_Clinical_Trial_Finder.py').read_text(encoding='utf-8')
          tree = ast.parse(src)
          values = {}
          wanted = {'CANCER_ALIASES','DIAGNOSIS_FAMILIES','CANCERS','UNLISTED_CANCER'}
          for node in tree.body:
              if isinstance(node, ast.Assign):
                  for target in node.targets:
                      if isinstance(target, ast.Name) and target.id in wanted:
                          values[target.id] = ast.literal_eval(node.value)
          aliases = values['CANCER_ALIASES']
          families = values['DIAGNOSIS_FAMILIES']
          cancers = values['CANCERS']
          unlisted = values['UNLISTED_CANCER']

          root = Path('.')
          base = json.loads((root/'data'/'trials_base.json').read_text(encoding='utf-8'))
          by_id = {t['id']: t for t in base}
          paths = [root/'data'/'trial_updates.json'] + sorted((root/'data').glob('catalog_patch_*.json'))
          for p in paths:
              if not p.exists():
                  continue
              doc = json.loads(p.read_text(encoding='utf-8'))
              for tid in doc.get('delete', []):
                  by_id.pop(tid, None)
              for patch in doc.get('upsert', []):
                  tid = patch['id']
                  if tid in by_id:
                      merged = dict(by_id[tid])
                      for k, v in patch.items():
                          if k in {'requires', 'excludes'} and isinstance(v, dict):
                              nested = dict(merged.get(k, {})); nested.update(v); merged[k] = nested
                          else:
                              merged[k] = v
                      by_id[tid] = merged
                  else:
                      by_id[tid] = patch

          active = [t for t in by_id.values() if t.get('available_for_matching', True) and t.get('status_confidence') in {'current','confirmed_current'} and t.get('study_type','treatment') in {'treatment','other_treatment_access'}]

          def accepts(tr, diagnosis):
              tc = set(tr.get('cancers', []))
              exact = {diagnosis, *aliases.get(diagnosis, [])}
              if diagnosis == 'Spindle cell sarcoma':
                  exact.add('Soft tissue sarcoma')
              if exact.intersection(tc):
                  return True
              fam = families.get(diagnosis)
              if not fam:
                  return False
              broad = set(tr.get('broad_disease_families', []))
              return 'all_tumors' in broad or 'Cancer — any type' in tc or bool(set(fam).intersection(broad))

          centers = {str(t.get('center','')).strip() for t in active if str(t.get('center','')).strip()}
          excluded = {'Cancer — any type','Other / not sure',unlisted}
          cancer_types = {c for c in cancers if c not in excluded and any(accepts(t,c) for t in active)}
          country_aliases = {'United Kingdom':'UK','The Netherlands':'Netherlands','Czech Republic':'Czechia'}
          countries = {country_aliases.get(str(t.get('country','USA')).strip(), str(t.get('country','USA')).strip()) for t in active if str(t.get('country','USA')).strip()}
          line = f"{len(active)} active treatment opportunities · {len(centers)} centers · {len(cancer_types)} cancer types · {len(countries)} countries"
          print(line)
          if 'SAFE_DATABASE_STATS_V1' not in src:
              raise SystemExit('Stats marker missing')
          PY

      - name: Commit feature change if needed
        run: |
          if git diff --quiet; then
            echo "No patch needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pages/1_Clinical_Trial_Finder.py
          git commit -m "Add safe live database statistics"
          git push origin HEAD:feature/database-stats
