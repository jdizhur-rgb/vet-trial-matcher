name: Public live smoke once
on:
  push:
    branches: [main]
    paths: ['.github/workflows/live-smoke-once.yml']
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install browser
        run: pip install playwright && python -m playwright install chromium
      - name: Verify deployed public app
        run: |
          python - <<'PY'
          import time
          from playwright.sync_api import sync_playwright
          URL='https://c-trials.streamlit.app/'
          NEEDED=[
            'Ethos Veterinary Health',
            'Metropolitan Veterinary Hospital — Cleveland, OH',
            'Summit Veterinary Referral Center — Tacoma, WA',
            'Veterinary Specialty Hospital — San Diego, CA',
            '8401 Main St, Edmonds, WA 98026',
          ]
          last=''
          with sync_playwright() as p:
              b=p.chromium.launch(headless=True)
              for attempt in range(1,13):
                  g=b.new_page(viewport={'width':1280,'height':1600})
                  try:
                      g.goto(URL,wait_until='domcontentloaded',timeout=90000)
                      g.get_by_text('Country / region',exact=True).wait_for(timeout=90000)
                      country=g.get_by_text('Country / region',exact=True).locator("xpath=ancestor::div[contains(@class,'stSelectbox')][1]").get_by_role('combobox')
                      country.click();country.fill('USA');country.press('Enter')
                      cancer=g.get_by_text('Cancer type',exact=True).locator("xpath=ancestor::div[contains(@class,'stSelectbox')][1]").get_by_role('combobox')
                      cancer.click();cancer.fill('Oral melanoma');cancer.press('Enter')
                      g.get_by_role('button',name='Find potential trials').click()
                      g.get_by_text('Results',exact=True).wait_for(timeout=45000)
                      last=g.locator('body').inner_text()
                      missing=[x for x in NEEDED if x not in last]
                      print('attempt',attempt,'missing',missing)
                      if not missing:
                          print('PUBLIC_LIVE_OK')
                          b.close()
                          raise SystemExit(0)
                  except Exception as e:
                      print('attempt',attempt,'error',repr(e))
                  finally:
                      try:g.close()
                      except:pass
                  time.sleep(20)
              print(last[-12000:])
              b.close()
              raise SystemExit('public app did not expose repaired Ethos/BARC metadata after retries')
          PY
