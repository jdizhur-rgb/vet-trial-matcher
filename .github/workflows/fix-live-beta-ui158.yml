name: Fix live beta copy on ui-158
on:
  push:
    paths:
      - '.github/workflows/fix-live-beta-ui158.yml'
  workflow_dispatch:

jobs:
  patch-live-branch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui-158-compat
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Remove beta copy and update disclaimer
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('pages/1_Clinical_Trial_Finder.py')
          s = p.read_text(encoding='utf-8')
          s = s.replace("st.set_page_config(page_title='Vet Cancer Trial Finder — Beta', page_icon='🐾', layout='centered')", "st.set_page_config(page_title='Vet Cancer Treatment Finder', page_icon='🐾', layout='centered')")
          s = s.replace("st.markdown('**Beta prototype.** Answer what you know. It is completely fine to choose **I don’t know**.')", "st.markdown('Answer what you know. It is completely fine to choose **I don’t know**.')")
          s = s.replace("st.info('This tool screens for clinical trials that may be worth contacting. It does not determine eligibility and does not replace your veterinarian or oncologist.')", "st.info('This finder identifies potentially relevant cancer treatment options. It does not determine eligibility. Final eligibility and treatment decisions are determined by the treating or research team. It is not a substitute for veterinary advice.')")
          s = s.replace("with st.expander('Help us improve this beta'):", "with st.expander('Help us improve this finder'):")
          s = s.replace("st.caption('Beta: trial information can change. Always confirm recruiting status, eligibility, costs, travel requirements, and treatment details directly with the research team.')", "st.caption('Trial information can change. Always confirm recruiting status, eligibility, costs, travel requirements, and treatment details directly with the research or treatment team.')")
          s = s.replace('st.caption("This finder identifies potentially relevant clinical trials; it does not determine eligibility. Final eligibility is determined by the study investigators. It is not a substitute for veterinary advice.")', 'st.caption("This finder identifies potentially relevant cancer treatment options. It does not determine eligibility. Final eligibility and treatment decisions are determined by the treating or research team. It is not a substitute for veterinary advice.")')
          p.write_text(s, encoding='utf-8')

          p = Path('app.py')
          s = p.read_text(encoding='utf-8')
          s = s.replace('.beta-corner {text-align:right;font-size:.72rem;color:#8a8580;margin:.02rem .15rem .12rem}', '.beta-corner {display:none}')
          s = s.replace('  .beta-corner {text-align:left}\n', '')
          old = '''        if body.startswith("**Beta prototype.**"):\n            rest = body.replace("**Beta prototype.**", "", 1).strip()\n            _orig["markdown"]('<div class="beta-corner">Beta prototype</div>', unsafe_allow_html=True)\n            _orig["markdown"](f'<div class="intro-answer">{rest}</div>', unsafe_allow_html=True)\n            return'''
          new = '''        if body.startswith("Answer what you know."):\n            _orig["markdown"](f'<div class="intro-answer">{body}</div>', unsafe_allow_html=True)\n            return'''
          s = s.replace(old, new)
          p.write_text(s, encoding='utf-8')
          PY
          python -m py_compile app.py pages/1_Clinical_Trial_Finder.py
      - name: Verify beta is gone
        run: |
          if grep -RniE 'Beta prototype|Beta: trial|improve this beta|Trial Finder — Beta' app.py pages/1_Clinical_Trial_Finder.py; then
            echo 'Beta copy still present' >&2
            exit 1
          fi
      - name: Commit to live branch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app.py pages/1_Clinical_Trial_Finder.py
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Remove beta copy from live ui-158 deployment"
          git push origin HEAD:ui-158-compat
