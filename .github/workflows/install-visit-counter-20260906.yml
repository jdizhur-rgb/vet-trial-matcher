name: Install standalone visit counter
on:
  push:
    paths:
      - '.github/workflows/install-visit-counter-20260906.yml'
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install counter
        run: |
          cat > visit_counter.py <<'PY'
          import json
          import urllib.request
          from datetime import datetime
          from zoneinfo import ZoneInfo
          import streamlit as st

          BASE = "https://countapi.mileshilliard.com/api/v1"
          PREFIX = "vctf_6f9e4d2b7a31c85e"
          ET = ZoneInfo("America/New_York")

          def _hit(key):
              try:
                  with urllib.request.urlopen(f"{BASE}/hit/{key}", timeout=4) as r:
                      data = json.loads(r.read().decode("utf-8"))
                      return int(data.get("value", 0))
              except Exception:
                  return None

          def _get(key):
              try:
                  with urllib.request.urlopen(f"{BASE}/get/{key}", timeout=4) as r:
                      data = json.loads(r.read().decode("utf-8"))
                      return int(data.get("value", 0))
              except Exception:
                  return 0

          def _keys(now=None):
              now = now or datetime.now(ET)
              iso_year, iso_week, _ = now.isocalendar()
              return {
                  "total": f"{PREFIX}_total",
                  "today": f"{PREFIX}_day_{now:%Y%m%d}",
                  "week": f"{PREFIX}_week_{iso_year}{iso_week:02d}",
                  "month": f"{PREFIX}_month_{now:%Y%m}",
              }

          def record_visit():
              """Count one visit per live Streamlit session. Never blocks the app."""
              if st.session_state.get("_visit_counter_done"):
                  return
              keys = _keys()
              ok = False
              for key in keys.values():
                  if _hit(key) is not None:
                      ok = True
              if ok:
                  st.session_state["_visit_counter_done"] = True

          def read_stats():
              keys = _keys()
              return {name: _get(key) for name, key in keys.items()}
          PY

          cat > pages/3_Private_Stats.py <<'PY'
          import streamlit as st
          from visit_counter import read_stats

          st.title("📊 Visit stats")
          stats = read_stats()
          cols = st.columns(4)
          cols[0].metric("All visits", stats["total"])
          cols[1].metric("Today", stats["today"])
          cols[2].metric("This week", stats["week"])
          cols[3].metric("This month", stats["month"])
          st.caption("Counts Streamlit sessions, not unique people. Refreshes inside the same live session are not counted again. No pet, search, IP, email, or browser data is sent to the counter service. Periods use Eastern Time.")
          PY

          python - <<'PY'
          from pathlib import Path
          p = Path('app.py')
          s = p.read_text()
          if 'from visit_counter import record_visit' not in s:
              s = s.replace('import json, urllib.request, re\n', 'import json, urllib.request, re\nfrom visit_counter import record_visit\n')
          old = 'PAGES=[st.Page("pages/1_Clinical_Trial_Finder.py",title="Clinical Trial Finder",icon="🐾",default=True),st.Page("pages/2_Additional_Oncology_Options.py",title="Additional Oncology Options",icon="🧬")]'
          new = 'PAGES=[st.Page("pages/1_Clinical_Trial_Finder.py",title="Clinical Trial Finder",icon="🐾",default=True),st.Page("pages/2_Additional_Oncology_Options.py",title="Additional Oncology Options",icon="🧬"),st.Page("pages/3_Private_Stats.py",title="Visit Stats",url_path="private-stats-9f4c2")]'
          if old not in s:
              raise SystemExit('Expected PAGES declaration not found; refusing unsafe patch')
          s = s.replace(old, new, 1)
          marker = 'page=st.navigation(PAGES,position="hidden")\n'
          if 'record_visit()' not in s:
              s = s.replace(marker, marker + 'if getattr(page,"url_path","") != "private-stats-9f4c2": record_visit()\n', 1)
          p.write_text(s)
          PY

          rm -f .github/workflows/install-visit-counter-20260906.yml
      - name: Verify syntax and wiring
        run: |
          python -m py_compile app.py visit_counter.py pages/3_Private_Stats.py
          grep -q 'from visit_counter import record_visit' app.py
          grep -q 'private-stats-9f4c2' app.py
          ! grep -RInE 'install_analytics|GA_MEASUREMENT_ID|GA_API_SECRET|ga_debug' app.py visit_counter.py pages || exit 1
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Add standalone privacy-friendly visit counter'
          git push
