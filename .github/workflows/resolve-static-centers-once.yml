name: Resolve static centers once
on:
  push:
    paths: ['.github/workflows/resolve-static-centers-once.yml']
permissions:
  contents: write
jobs:
  resolve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Resolve by verified center
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=Path('data'); target=d/'catalog_patch_zzzzzzzz_static_locations_all.json'
          base=json.loads((d/'trials_base.json').read_text()); by={x['id']:dict(x) for x in base}
          for p in [d/'trial_updates.json']+sorted(d.glob('catalog_patch_*.json')):
            if not p.exists() or p==target: continue
            q=json.loads(p.read_text()); ups=q if isinstance(q,list) else q.get('upsert',[])
            for z in ups:
              i=z.get('id'); x=dict(by.get(i,{})); x.update(z); by[i]=x
          doc=json.loads(target.read_text())
          one={
          'Anivive Lifesciences — multicenter':['Cornell University Hospital for Animals, 930 Campus Rd, Ithaca, NY 14853'],
          'Ontario Veterinary College / Hospital for Sick Children':['Ontario Veterinary College, 50 Stone Rd E, Guelph, ON N1G 2W1, Canada','The Hospital for Sick Children, 555 University Ave, Toronto, ON M5G 1X8, Canada'],
          'Johns Hopkins Center for Image-Guided Animal Therapy (CIGAT) / Kubanda Cryotherapy':['Johns Hopkins Center for Image-Guided Animal Therapy, 600 N Wolfe St, Park 311, Baltimore, MD 21287'],
          'Penn Vet Comparative Immunotherapy Program':['Penn Vet Ryan Veterinary Hospital, 3900 Spruce St, Philadelphia, PA 19104'],
          'Purdue University Veterinary Hospital / Werling Comparative Oncology Research Center':['Purdue University Veterinary Hospital, 625 Harrison St, West Lafayette, IN 47907'],
          'UC Davis Weill School of Veterinary Medicine / Translational Brain Tumor Center':['UC Davis Veterinary Medical Teaching Hospital, 1 Garrod Dr, Davis, CA 95616'],
          'UT Southwestern Veterinary Radiation Oncology Clinic (VROC)':['UT Southwestern Veterinary Research and Oncology Clinic, 5801 Forest Park Rd, Dallas, TX 75235']}
          for r in doc['upsert']:
            t=by.get(r['id'],{}); c=t.get('center',''); title=t.get('title','')
            labels=one.get(c)
            if c=='ELIAS Animal Health / University of Missouri':
              if 'chemotherapy' in title.lower(): r.update(available_for_matching=False,status_confidence='closed',sites=[],location_unresolved=False); continue
              labels=['University of Missouri Veterinary Health Center, 900 E Campus Dr, Columbia, MO 65211']
            if c=='Ethos Discovery / Veterinary Specialty Hospital - North County': labels=['Veterinary Specialty Hospital - North County, 2055 Montiel Rd, San Marcos, CA 92069','Gulf Coast Veterinary Specialists, 8042 Katy Fwy, Houston, TX 77024']
            if c=='Veterinary Specialty Hospital - North County / Ethos network': labels=['Bridge Animal Referral Center, 8401 Main St, Edmonds, WA 98026','Colorado Animal Specialty & Emergency, 2972 Iris Ave, Boulder, CO 80301','Metropolitan Veterinary Hospital - Cleveland East, 734 Alpha Drive, Highland Heights, OH 44143','Veterinary Specialty Hospital - North County, 2055 Montiel Rd, San Marcos, CA 92069']
            if c=='MedVet Clinical Studies Center': labels=['MedVet Salt Lake City, 331 W Bearcat Dr, Salt Lake City, UT 84115','MedVet Cincinnati, 3964 Red Bank Rd, Cincinnati, OH 45227','MedVet Cleveland, 20400 Emerald Pkwy, Cleveland, OH 44135','MedVet Pittsburgh, 2810 Washington Rd, McMurray, PA 15317']; r['inactive_sites']=[{'label':'MedVet Chicago, 3305 N California Ave, Chicago, IL 60618 — enrollment paused','status':'inactive'}]
            if c=='European multicenter study — Floryne Buishand': r.update(available_for_matching=False,status_confidence='closed',sites=[],location_unresolved=False); continue
            if 'Zhongnong Dongjun' in c or 'Vaxcell Bio' in c or c.startswith('University Hospital for Companion Animals, University of Copenhagen'):
              r.update(available_for_matching=False,status_confidence='needs_reconfirmation',sites=[],location_unresolved=False); continue
            if labels: r.update(sites=[{'label':x,'status':'active'} for x in labels],location_unresolved=False,location_verified='2026-09-11')
          target.write_text(json.dumps(doc,ensure_ascii=False,indent=2)+'\n')
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/catalog_patch_zzzzzzzz_static_locations_all.json
          git commit -m 'Resolve all remaining static trial centers'
          git push origin main
