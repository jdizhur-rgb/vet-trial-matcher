name: Detailed location audit once
on:
  push:
    branches: [streamlit-prod]
    paths: ['.github/workflows/location-audit-report-once.yml']
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: streamlit-prod
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Print records lacking display locations
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from seo.center_directory import addresses_for
          root=Path('.')
          by_id={t['id']:t for t in json.loads((root/'data/trials_base.json').read_text())}
          for p in [root/'data/trial_updates.json']+sorted((root/'data').glob('catalog_patch_*.json')):
              d=json.loads(p.read_text())
              for tid in d.get('delete',[]): by_id.pop(tid,None)
              for x in d.get('upsert',[]):
                  tid=x['id']; m=dict(by_id.get(tid,{}))
                  for k,v in x.items():
                      if k in {'requires','excludes'} and isinstance(v,dict):
                          n=dict(m.get(k,{})); n.update(v); m[k]=n
                      else: m[k]=v
                  by_id[tid]=m
          for t in by_id.values():
              if not t.get('available_for_matching',True): continue
              if t.get('status_confidence') not in {'current','confirmed_current'}: continue
              if t.get('study_type','treatment') not in {'treatment','other_treatment_access'}: continue
              if t.get('sites') or addresses_for(t.get('center','')): continue
              print(json.dumps({k:t.get(k) for k in ['id','title','center','state','country','url','registry_url','contacts']},ensure_ascii=False))
          PY