name: Renderer repair final
on:
  push:
    branches: [live-main-repair]
    paths: ['.github/workflows/renderer-repair-final.yml']
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: live-main-repair}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Patch
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('app.py');s=p.read_text()
          s=s.replace('        if body.startswith("**Contact:**"):_pending["contact"]=body.replace("**Contact:**","",1).strip();return\n','')
          s=s.replace('        if body.startswith("**Participating sites:**"):_pending["sites"]=body.replace("**Participating sites:**","",1).strip();return\n','')
          compile(s,'app.py','exec');p.write_text(s)
          p=Path('pages/1_Clinical_Trial_Finder.py');s=p.read_text()
          for a,b in [("tr['notes']","tr.get('notes', 'See the official study page for current study details.')"),("tr['status']","tr.get('status', 'Status not recorded')"),("tr['center']","tr.get('center', 'Study center')"),("tr['title']","tr.get('title', 'Clinical study')")]:s=s.replace(a,b)
          compile(s,'pages/1_Clinical_Trial_Finder.py','exec');p.write_text(s)
          p=Path('seo/center_directory.py');s=p.read_text()
          line='    "Bridge Animal Referral Center (BARC)": "Bridge Animal Referral Center, 8401 Main St, Edmonds, WA 98026",\n'
          if line not in s:
            a='    "Aurelius Biotherapeutics": "Aurelius Biotherapeutics, 720 Virginia St, Bellingham, WA 98225",\n';s=s.replace(a,a+line,1)
          compile(s,'seo/center_directory.py','exec');p.write_text(s)
          PY
      - name: Install
        run: pip install -r requirements.txt playwright && python -m playwright install chromium
      - name: Static
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from seo.center_directory import addresses_for
          a=Path('app.py').read_text();p=Path('pages/1_Clinical_Trial_Finder.py').read_text()
          assert ':**"):_pending' not in a
          assert "tr['notes']" not in p and "tr['status']" not in p
          by={x['id']:x for x in json.loads(Path('data/trials_base.json').read_text())}
          for f in [Path('data/trial_updates.json')]+sorted(Path('data').glob('catalog_patch_*.json')):
            d=json.loads(f.read_text())
            for x in d.get('upsert',[]):
              m=dict(by.get(x['id'],{}));m.update(x);by[x['id']]=m
          assert len(by['ethos-gilvetmab-melanoma']['sites'])==3
          assert addresses_for('Bridge Animal Referral Center (BARC)')
          print('STATIC_OK')
          PY
      - name: AppTest
        run: |
          python - <<'PY'
          from streamlit.testing.v1 import AppTest
          a=AppTest.from_file('app.py',default_timeout=30).run()
          def s(n):return next(x for x in a.selectbox if x.label==n)
          s('Country / region').select('USA');s('Cancer type').select('Oral melanoma');a.run();next(x for x in a.button if x.label=='Find potential trials').click();a.run()
          t='\n'.join(str(getattr(e,'value','')) for k in ('markdown','text','caption') for e in getattr(a,k))
          for x in ['Ethos Veterinary Health','Metropolitan Veterinary Hospital — Cleveland, OH','Summit Veterinary Referral Center — Tacoma, WA','Veterinary Specialty Hospital — San Diego, CA','8401 Main St, Edmonds, WA 98026']:assert x in t,x
          assert not a.exception
          print('APPTEST_OK')
          PY
      - name: Browser
        run: |
          streamlit run app.py --server.headless=true --server.port=8501 >/tmp/st.log 2>&1 &
          for i in {1..60};do curl -fsS http://127.0.0.1:8501/_stcore/health >/dev/null && break;sleep 1;done
          python - <<'PY'
          from playwright.sync_api import sync_playwright
          with sync_playwright() as p:
            b=p.chromium.launch();g=b.new_page();g.goto('http://127.0.0.1:8501',wait_until='domcontentloaded',timeout=60000)
            g.get_by_text('Country / region',exact=True).wait_for(timeout=60000)
            country=g.get_by_text('Country / region',exact=True).locator("xpath=ancestor::div[contains(@class,'stSelectbox')][1]").get_by_role('combobox')
            country.click();country.fill('USA');country.press('Enter')
            cancer=g.get_by_text('Cancer type',exact=True).locator("xpath=ancestor::div[contains(@class,'stSelectbox')][1]").get_by_role('combobox')
            cancer.click();cancer.fill('Oral melanoma');cancer.press('Enter')
            g.get_by_role('button',name='Find potential trials').click();g.get_by_text('Results',exact=True).wait_for(timeout=30000);t=g.locator('body').inner_text()
            for x in ['Ethos Veterinary Health','Metropolitan Veterinary Hospital — Cleveland, OH','Summit Veterinary Referral Center — Tacoma, WA','Veterinary Specialty Hospital — San Diego, CA','8401 Main St, Edmonds, WA 98026']:assert x in t,x
            b.close()
          print('BROWSER_OK')
          PY
      - name: Commit
        run: |
          git config user.name github-actions[bot];git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app.py pages/1_Clinical_Trial_Finder.py seo/center_directory.py
          git commit -m 'Fix live trial metadata rendering'
          git push origin HEAD:live-main-repair
