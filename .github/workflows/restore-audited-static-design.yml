name: Restore tested Kot design

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/restore-audited-static-design.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-candidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore production builder and tested Kot visual layer
        run: |
          cp seo/center_directory.py /tmp/main-center-directory.py
          git fetch origin cancer-page-audit --depth=1
          git checkout FETCH_HEAD -- seo/
          cp /tmp/main-center-directory.py seo/center_directory.py
          git fetch origin mobile-kot-hero-safe-20260912 --depth=1
          git checkout 6c90fc9476f17a20545e29ba94cabb6697fe55d1 -- seo/site_shell.py seo/assets/kot-home.jpg
      - name: Build candidate
        run: python seo/build_production_site.py
      - name: Include static files
        run: cp -a seo/static/. seo/site/
      - name: Validate tested Kot design with current catalog
        run: |
          python - <<'PY'
          from pathlib import Path
          root=Path('seo/site')
          pages=list(root.rglob('index.html'))
          assert len(pages)>=100, len(pages)
          home=(root/'index.html').read_text(encoding='utf-8')
          assert '<header class="site-header">' in home
          assert '<section class="home-hero">' in home
          assert '/assets/kot-home.jpg' in home
          assert 'min-height:390px' in home
          assert 'object-position:center 48%' in home
          assert '.site-header{left:auto;width:auto;margin-left:-26px;margin-right:-26px' in home
          assert 'min-height:clamp(440px,120vw,540px)' in home
          assert 'object-position:62% 48%' in home
          assert 'linear-gradient(180deg' in home
          assert 'display:flex!important;flex-direction:column' not in home
          assert 'Find clinical trials and cancer treatment options for your pet' in home
          assert 'jdizhur-rgb.github.io/vet-trial-matcher' not in home
          asset=root/'assets/kot-home.jpg'
          assert asset.exists() and asset.stat().st_size>10000, asset
          cancer=[]
          for region in ('north-america','uk-europe'):
            for species in ('dogs','cats'):
              cancer += list((root/region/species).glob('*/index.html'))
          assert len(cancer)>=88, len(cancer)
          for p in cancer:
            s=p.read_text(encoding='utf-8')
            assert '<header class="site-header">' in s,p
            assert '<link rel="canonical"' in s,p
          print('TESTED_KOT_CANDIDATE_OK',len(pages),len(cancer),asset.stat().st_size)
          PY
      - name: Save exact candidate artifact
        uses: actions/upload-artifact@v4
        with:
          name: tested-kot-design-candidate
          path: seo/site/
          retention-days: 3
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: seo/site/

  deploy:
    runs-on: ubuntu-latest
    needs: build-candidate
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy tested Kot design
        id: deployment
        uses: actions/deploy-pages@v4
