name: Restore tested Kot design
# Contact email: About, Help and the shared footer
# Cancer copy source: cancer-page-audit-depth@a3aad79
# Center pages: current main generator, refined shell, legacy URL aliases\n# Center imagery: verified editorial and institution sources (complete pass)\n# Center layout: photo below About, compact facts, footer note\n# Center facts: owner-relevant fields only\n# Center directory: canonical duplicates merged\n# Johns Hopkins CIGAT: official scanner photo\n# Center headings: compact line height\n# Center type: readable mobile sizing

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/restore-audited-static-design.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-candidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore production builder and refined Kot visual layer
        run: |
          cp seo/center_directory.py /tmp/main-center-directory.py
          cp seo/generate_seo_strict.py /tmp/main-generate-seo-strict.py
          cp seo/generate_seo.py /tmp/main-generate-seo.py
          cp seo/ensure_center_images.py /tmp/main-ensure-center-images.py
          cp seo/center_profiles.py /tmp/main-center-profiles.py
          cp seo/center_profiles_extra.py /tmp/main-center-profiles-extra.py
          git fetch origin cancer-page-audit --depth=1
          git checkout FETCH_HEAD -- seo/
          cp /tmp/main-center-directory.py seo/center_directory.py
          cp /tmp/main-generate-seo-strict.py seo/generate_seo_strict.py
          cp /tmp/main-generate-seo.py seo/generate_seo.py
          cp /tmp/main-ensure-center-images.py seo/ensure_center_images.py
          cp /tmp/main-center-profiles.py seo/center_profiles.py
          cp /tmp/main-center-profiles-extra.py seo/center_profiles_extra.py
          git fetch origin cancer-page-audit-depth --depth=1
          git checkout FETCH_HEAD -- \
            seo/cancer_benchmark_content.py \
            seo/cancer_branch_depth.py \
            seo/cancer_owner_depth.py \
            seo/cancer_page_polish.py \
            seo/cancer_treatment_factors.py \
            seo/feline_branch_content.py \
            seo/hs_owner_page.py \
            seo/owner_friendly_descriptions.py \
            seo/owner_friendly_factors.py \
            seo/owner_friendly_next_steps.py \
            seo/owner_friendly_prognosis.py \
            seo/owner_friendly_treatment_tests.py \
            seo/practical_cancer_pages.py \
            seo/validate_cancer_depth.py
          git fetch origin mobile-kot-hero-safe-20260912 --depth=1
          git checkout 6c90fc9476f17a20545e29ba94cabb6697fe55d1 -- seo/site_shell.py seo/assets/kot-home.jpg
          python - <<'PY'
          from pathlib import Path
          p=Path('seo/site_shell.py')
          s=p.read_text(encoding='utf-8')
          desktop_old='.hero-photo img{width:100%;height:100%;aspect-ratio:auto;object-fit:cover;object-position:center 48%;border:0;border-radius:0;box-shadow:none}'
          desktop_new='.hero-photo img{width:100%;height:100%;aspect-ratio:auto;object-fit:cover;object-position:center 30%;transform:translateX(25%);border:0;border-radius:0;box-shadow:none}'
          if desktop_old not in s: raise SystemExit('expected desktop hero image rule not found')
          s=s.replace(desktop_old,desktop_new,1)
          old='@media(max-width:800px){.site-header{left:auto;width:auto}.home-hero{position:relative;display:block!important;min-height:clamp(440px,120vw,540px);padding:0!important;overflow:hidden;border-radius:10px;background:#17324d}.hero-photo{position:absolute;inset:0;max-width:none;width:100%;height:100%;margin:0}.hero-photo:after{content:"";display:block;position:absolute;inset:0;background:linear-gradient(180deg,rgba(10,28,45,.90) 0%,rgba(10,28,45,.76) 48%,rgba(10,28,45,.28) 100%)}.hero-photo img{width:100%;height:100%;aspect-ratio:auto;object-fit:cover;object-position:62% 48%;border:0;border-radius:0;box-shadow:none}.hero-copy{position:relative;z-index:1;max-width:none;padding:28px 22px 24px;color:#fff}.hero-copy h1{color:#fff;font-size:clamp(30px,8.5vw,38px);line-height:1.08;margin:0 0 13px}.hero-copy .eyebrow,.hero-copy .lead{color:#fff}.hero-copy .lead{font-size:16px;line-height:1.45;max-width:520px}.hero-copy .cta{background:#fff;color:#175b8c!important}.hero-copy .secondary-cta{border-color:rgba(255,255,255,.75);background:rgba(23,50,77,.3);color:#fff!important}}'
          new='.mobile-hero-copy,.mobile-hero-lead{display:none}@media(max-width:800px){.site-header{left:auto;width:auto;margin-bottom:14px}.site-nav{padding:8px 0;min-height:0}.brand-row{gap:8px}.brand{font-size:1.08rem}.brand-free{font-size:.6rem;padding:4px 6px}.site-nav nav{justify-content:flex-start;margin-top:6px;gap:6px 12px}.site-nav nav a{font-size:.82rem;line-height:1.2}.home-hero{position:relative;display:block!important;min-height:300px;padding:0!important;overflow:hidden;border-radius:10px;background:#17324d}.hero-photo{position:absolute;inset:0;max-width:none;width:100%;height:100%;margin:0}.hero-photo:after{content:"";display:block;position:absolute;inset:0;background:linear-gradient(90deg,rgba(10,28,45,.82) 0%,rgba(10,28,45,.58) 40%,rgba(10,28,45,.12) 72%,rgba(10,28,45,.03) 100%)}.hero-photo img{width:100%;height:100%;aspect-ratio:auto;object-fit:cover;object-position:72% 52%;border:0;border-radius:0;box-shadow:none}.hero-copy{display:none}.mobile-hero-copy{display:flex;position:absolute;z-index:1;left:16px;right:16px;bottom:14px;max-width:none;padding:0;color:#fff;flex-direction:column;align-items:flex-start}.mobile-hero-copy h1{color:rgba(255,255,255,.82)!important;transform:translateY(-8px);font-size:clamp(20px,5.5vw,24px);line-height:1.05;margin:0 0 16px;max-width:285px}.mobile-hero-copy h1 .mobile-line{display:block;white-space:nowrap}.mobile-hero-copy .hero-actions{display:flex!important;justify-content:flex-start!important;align-items:stretch!important;align-self:flex-start!important;width:auto!important;flex-wrap:nowrap!important;gap:6px;margin:0!important}.mobile-hero-copy .cta,.mobile-hero-copy .secondary-cta{display:flex;align-items:center;box-sizing:border-box;height:34px;padding:0 9px;font-size:12px!important;line-height:1!important;border:1px solid rgba(255,255,255,.8);border-radius:6px;white-space:nowrap;background:rgba(23,50,77,.22);color:#fff!important}.mobile-hero-lead{display:block;margin:14px 2px 20px;color:#52677b;font-size:15px;line-height:1.45}}'
          if old not in s: raise SystemExit('expected mobile hero block not found')
          s=s.replace(old,new,1)
          badge_old='.brand-free{font-size:.68rem;line-height:1;'
          badge_new='.brand-free{display:inline-flex;align-items:center;justify-content:center;align-self:center;transform:translateY(-1px);font-size:.68rem;line-height:1;'
          if badge_old not in s: raise SystemExit('expected free badge rule not found')
          s=s.replace(badge_old,badge_new,1)
          heading_old='.share-panel p{color:#52677b}'
          heading_new='.share-panel p{color:#52677b}main h1,main h2,main h3{color:#315f7d!important}main .cta{padding:8px 13px;border-radius:7px;font-size:.9rem;font-weight:650}.home-hero .cta{padding:12px 18px;border-radius:9px;font-size:inherit;font-weight:750}main .eligibility-cta{display:inline-block!important;width:auto!important;padding:8px 13px;border-radius:7px;font-size:.9rem;font-weight:600}'
          if heading_old not in s: raise SystemExit('expected heading insertion point not found')
          s=s.replace(heading_old,heading_new,1)
          hero_old='<div class="hero-copy"><p class="eyebrow">Clinical Trials &amp; Experimental Treatments for Dogs and Cats</p><h1>Find clinical trials and cancer treatment options for your pet</h1><p class="lead">Search current studies by diagnosis, check participating hospitals, and find other oncology options in one place. The site is free to use.</p><div class="hero-actions"><a class="cta" href="{FINDER}">Find Trials</a><a class="secondary-cta" href="{SITE}/help/">How it works</a></div></div></section><h2>Start here</h2>'
          hero_new='<div class="hero-copy"><p class="eyebrow">Clinical Trials &amp; Experimental Treatments for Dogs and Cats</p><h1>Find clinical trials and cancer treatment options for your pet</h1><p class="lead">Search current studies by diagnosis, check participating hospitals, and find other oncology options in one place. The site is free to use.</p><div class="hero-actions"><a class="cta" href="{FINDER}">Find Trials</a><a class="secondary-cta" href="{SITE}/help/">How it works</a></div></div><div class="mobile-hero-copy"><h1><span class="mobile-line">Find cancer trials</span><span class="mobile-line">for your pet</span></h1><div class="hero-actions"><a class="cta" href="{FINDER}">Find Trials</a><a class="secondary-cta" href="{SITE}/help/">How it works</a></div></div></section><p class="mobile-hero-lead">Search current studies by diagnosis, check participating hospitals, and find other oncology options in one place. The site is free to use.</p><h2>Start here</h2>'
          if hero_old not in s: raise SystemExit('expected homepage hero markup not found')
          s=s.replace(hero_old,hero_new,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Build candidate
        run: |
          python seo/build_production_site.py
          PYTHONPATH=seo python seo/validate_cancer_depth.py --site seo/site
      - name: Include static files and restore About photos last
        run: |
          cp -a seo/static/. seo/site/
          python - <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0, 'seo')
          from about_page import _write_embedded_about_assets
          _write_embedded_about_assets(Path('seo/site'))
          PY
      - name: Apply production search indexing policy
        run: python seo_index_cleanup.py
      - name: Update Help for current location features
        run: python help_content_update.py
      - name: Add real ZIP search to oncology-center directory
        run: python center_zip_search.py
      - name: Validate refined Kot design with current catalog
        run: |
          python - <<'PY'
          from pathlib import Path
          root=Path('seo/site'); pages=list(root.rglob('index.html')); assert len(pages)>=100, len(pages)
          home=(root/'index.html').read_text(encoding='utf-8')
          assert '<header class="site-header">' in home
          assert '<section class="home-hero">' in home
          assert '/assets/kot-home.jpg' in home
          assert 'min-height:390px' in home
          assert 'object-position:center 30%' in home
          assert 'transform:translateX(25%)' in home
          assert 'min-height:300px' in home
          assert 'object-position:72% 52%' in home
          assert '<span class="mobile-line">Find cancer trials</span><span class="mobile-line">for your pet</span>' in home
          assert 'color:rgba(255,255,255,.82)!important' in home
          assert 'transform:translateY(-8px)' in home
          assert 'font-size:.82rem' in home
          assert 'align-self:flex-start!important' in home
          assert 'height:34px' in home
          assert 'font-size:12px!important' in home
          assert 'main h1,main h2,main h3{color:#315f7d!important}' in home
          assert 'transform:translateY(-1px)' in home
          assert 'main .cta{padding:8px 13px' in home
          assert '.home-hero .cta{padding:12px 18px' in home
          assert 'main .eligibility-cta{display:inline-block!important;width:auto!important' in home
          assert 'background:rgba(23,50,77,.22);color:#fff!important' in home
          assert 'class="mobile-hero-lead"' in home
          assert '.hero-copy{display:none}' in home
          assert 'Find clinical trials and cancer treatment options for your pet' in home
          assert 'jdizhur-rgb.github.io/vet-trial-matcher' not in home
          asset=root/'assets/kot-home.jpg'; assert asset.exists() and asset.stat().st_size>10000, asset
          about=(root/'about/index.html').read_text(encoding='utf-8')
          assert 'class="about-story-v2"' in about
          assert 'class="story-intro"' in about
          assert 'class="story-break"' in about
          assert 'color:#315f7d!important' in about
          assert 'This project started because two dogs taught me' not in about
          assert 'second surgery to remove the dirty margins' in about
          assert 'experimental treatments, looking for something that might give him better chances' in about
          assert 'We don’t promise anything and we don’t give false hope.' in about
          assert 'Yuliia Dizhur' in about and 'Founder, Vet Trial Finder' in about
          assert '.story-scene{display:flow-root' in about
          assert 'float:left;width:26%;max-width:225px' in about
          assert '.story-scene.yasha .story-photo{float:right' in about
          assert 'width:31%;max-width:140px' in about
          assert 'height:auto;object-fit:contain' in about
          assert '/assets/senya-about.jpg?v=about-v5' in about
          assert '/assets/yasha-about.jpg?v=about-v4' in about
          sitemap=(root/'sitemap.xml').read_text(encoding='utf-8')
          assert 'https://vettrialfinder.com/' in sitemap
          assert 'jdizhur-rgb.github.io' not in sitemap
          assert 'https://vettrialfinder.com/uk-europe/' not in sitemap
          assert not any(f'https://vettrialfinder.com/{lang}/' in sitemap for lang in ('de','fr','es','it','nl'))
          assert sitemap.count('/centers/') >= 49
          assert 'https://vettrialfinder.com/how-we-verify/' in sitemap
          assert '<lastmod>2026-09-12</lastmod>' in sitemap
          assert all('/uk-europe/' not in url for url in sitemap.split('<loc>')[1:])
          assert '"@type": "WebSite"' in home and '"@type": "Organization"' in home
          assert 'BreadcrumbList' in (root/'north-america/dogs/lymphoma/index.html').read_text(encoding='utf-8')
          assert (root/'404.html').exists()
          verification=(root/'how-we-verify/index.html').read_text(encoding='utf-8')
          assert '<h1>How We Verify Listings</h1>' in verification
          assert 'What this site does not do' in verification
          assert 'How We Verify</a>' in home
          assert 'mailto:info@vettrialfinder.com' in home
          assert 'mailto:info@vettrialfinder.com' in about
          centers=(root/'centers/index.html').read_text(encoding='utf-8')
          assert 'async function searchByZip' in centers
          assert 'api.zippopotam.us/us/' in centers
          assert 'data-zips=' in centers and 'center-search-status' in centers
          center_pages=list((root/'centers').glob('*/index.html'))
          assert center_pages
          content_center_pages=[p for p in center_pages if '<meta name="robots" content="noindex' not in p.read_text(encoding='utf-8')]
          assert all('Before you contact the center' in p.read_text(encoding='utf-8') for p in content_center_pages)
          assert all('<div class="center-facts">' in p.read_text(encoding='utf-8') for p in content_center_pages)
          source=Path('seo/about_page.py').read_text(encoding='utf-8')
          assert not any(x in source for x in ('assets_embedded','base64','urllib.request','fallback_url'))
          senya=root/'assets/senya-about.jpg'; yasha=root/'assets/yasha-about.jpg'
          assert senya.exists() and senya.stat().st_size>50000, senya.stat().st_size
          assert yasha.exists() and yasha.stat().st_size>50000, yasha.stat().st_size
          help_page=(root/'help/index.html').read_text(encoding='utf-8')
          assert help_page.count('<details>') == 15
          assert help_page.count('<summary>') == 15
          assert 'class="help-faq"' in help_page
          assert '.help-center .cta{padding:8px 13px' in help_page
          assert 'Which countries are included?' in help_page
          assert 'How do I find the nearest clinical trial centers?' in help_page
          assert 'mailto:info@vettrialfinder.com' in help_page
          cancer=[]
          for region in ('north-america','uk-europe'):
            for species in ('dogs','cats'): cancer += list((root/region/species).glob('*/index.html'))
          assert len(cancer)>=88, len(cancer)
          print('ABOUT_STORY_V2_PRODUCTION_OK',len(pages),len(cancer),senya.stat().st_size,yasha.stat().st_size)
          PY
      - name: Save exact candidate artifact
        uses: actions/upload-artifact@v4
        with:
          name: refined-kot-design-candidate
          path: seo/site/
          retention-days: 3
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: seo/site/
  deploy:
    runs-on: ubuntu-latest
    needs: build-candidate
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy refined Kot design
        id: deployment
        uses: actions/deploy-pages@v4

