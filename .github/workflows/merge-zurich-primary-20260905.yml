name: Merge Zurich oncology primary sweep
on:
  push:
    paths:
      - 'data/zurich_primary_sweep_20260905.json'
      - '.github/workflows/merge-zurich-primary-20260905.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Semantic merge and recalculate stats
        run: |
          python - <<'PY'
          import json,re
          from pathlib import Path
          from collections import Counter
          base=json.loads(Path('data/trials_base.json').read_text())
          p=Path('data/trial_updates.json'); upd=json.loads(p.read_text())
          sweep=json.loads(Path('data/zurich_primary_sweep_20260905.json').read_text())
          ups=upd.setdefault('upsert',[])
          deletes=set(upd.get('delete',[]))
          def norm(x): return re.sub(r'[^a-z0-9]+',' ',str(x).lower()).strip()
          def toks(r):
            cancers=r.get('cancers',[]); cancers=cancers if isinstance(cancers,list) else [cancers]
            return set(norm(' '.join([str(r.get('title','')),str(r.get('center','')),' '.join(map(str,cancers))])).split())
          eff={r.get('id'):r for r in base if r.get('id') and r.get('id') not in deletes}
          for r in ups:
            if r.get('id') and r.get('id') not in deletes: eff[r['id']]={**eff.get(r['id'],{}),**r}
          added=[]
          for r in sweep['upsert']:
            if r['id'] in eff: continue
            rt=toks(r); dup=False
            for e in eff.values():
              same_center=norm(r.get('center'))==norm(e.get('center'))
              if same_center:
                et=toks(e)
                if rt and et and len(rt&et)/max(1,min(len(rt),len(et))) >= .68:
                  dup=True; break
            if not dup:
              ups.append(r); eff[r['id']]=r; added.append(r['id'])
          p.write_text(json.dumps(upd,indent=2,ensure_ascii=False)+'\n')
          matching=[r for r in eff.values() if r.get('available_for_matching') is True and r.get('study_type')=='treatment']
          def vals(v): return v if isinstance(v,list) else [v]
          countries=Counter(); species=Counter()
          for r in matching:
            for x in vals(r.get('country','Unknown')): countries[str(x)]+=1
            for x in vals(r.get('species','Unknown')): species[str(x)]+=1
          stats={'generated':'2026-09-05','effective_total_records':len(eff),'current_treatment_opportunities':len(matching),'by_country':dict(sorted(countries.items())),'by_species':dict(sorted(species.items())),'added_from_zurich_primary_sweep':added}
          Path('data/catalog_stats.json').write_text(json.dumps(stats,indent=2,ensure_ascii=False)+'\n')
          print(json.dumps(stats,indent=2))
          PY
      - name: Validate
        run: python -m json.tool data/trial_updates.json >/dev/null && python -m json.tool data/catalog_stats.json >/dev/null
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add data/trial_updates.json data/catalog_stats.json
          git diff --cached --quiet && exit 0
          git commit -m 'Merge Zurich oncology treatment opportunities'
          git push
