name: Live smoke debug
on:
  push:
    branches: [streamlit-prod]
    paths: ['.github/workflows/live-smoke-debug-20260911.yml']
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install deps
        run: |
          pip install -r requirements.txt playwright
          python -m playwright install --with-deps chromium
      - name: Run browser smoke test
        run: |
          set +e
          streamlit run app.py --server.headless true --server.port 8765 > /tmp/streamlit.log 2>&1 &
          PID=$!
          sleep 6
          python - <<'PY'
          from playwright.sync_api import sync_playwright
          with sync_playwright() as p:
              browser=p.chromium.launch(headless=True)
              page=browser.new_page()
              page.on('console', lambda m: print('BROWSER CONSOLE:', m.type, m.text))
              page.on('pageerror', lambda e: print('PAGE ERROR:', e))
              page.goto('http://127.0.0.1:8765', wait_until='domcontentloaded', timeout=30000)
              page.wait_for_timeout(15000)
              print('TITLE:', page.title())
              print('URL:', page.url)
              print('BODY:', page.locator('body').inner_text()[:4000])
              browser.close()
          PY
          echo '=== STREAMLIT LOG ==='
          cat /tmp/streamlit.log
          kill $PID 2>/dev/null || true
