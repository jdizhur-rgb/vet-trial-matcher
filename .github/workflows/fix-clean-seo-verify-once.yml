name: Check clean cancer URLs after Pages deploy

on:
  workflow_run:
    workflows: ["Build and deploy SEO site"]
    types: [completed]

permissions:
  contents: read

jobs:
  verify-clean-urls:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Rebuild expected site
        run: python seo/build_production_site.py
      - name: Compare every clean cancer URL with generated cards
        run: |
          python - <<'PY'
          from pathlib import Path
          import html,re,time,urllib.request,sys
          sys.path.insert(0,'seo')
          import generate_seo as g
          from site_config import SITE

          def card_titles(s):
              return [html.unescape(re.sub(r'<.*?>','',x)).strip() for x in re.findall(r'<article class="card"><h3>(.*?)</h3>',s,re.S)]

          failures=[]
          checked=0
          for region in ('north-america','uk-europe'):
              for species in ('dogs','cats'):
                  for key in sorted(g.DISEASE_INFO):
                      path=f'{region}/{species}/{g.slugify(key)}/'
                      exp=(Path('seo/site')/path/'index.html').read_text(errors='replace')
                      expected=card_titles(exp)
                      actual=[]
                      err=None
                      for attempt in range(6):
                          try:
                              req=urllib.request.Request(SITE+'/'+path,headers={'User-Agent':'Mozilla/5.0'})
                              text=urllib.request.urlopen(req,timeout=20).read().decode('utf-8','replace')
                              actual=card_titles(text)
                              err=None
                          except Exception as e:
                              err=repr(e)
                              actual=[]
                          if actual==expected:
                              break
                          time.sleep(10)
                      checked+=1
                      if actual!=expected:
                          failures.append((path,len(expected),len(actual),err,expected[:3],actual[:3]))
                      if region=='north-america' and species=='dogs' and g.slugify(key) in {'histiocytic-sarcoma','soft-tissue-sarcoma','osteosarcoma','lymphoma','oral-melanoma'}:
                          print('COUNT',path,'expected',len(expected),'clean_live',len(actual))
          print('CLEAN_URLS_CHECKED',checked)
          if failures:
              print('CLEAN_URL_FAILURES',len(failures))
              for f in failures[:20]: print(f)
              raise SystemExit(1)
          print('CLEAN_ALL_ENGLISH_CANCER_PAGES_OK',checked)
          PY
