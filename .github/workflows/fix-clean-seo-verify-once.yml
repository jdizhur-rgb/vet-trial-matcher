name: Fix clean SEO verification once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-clean-seo-verify-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Make live verification use clean URLs
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/build-seo.yml')
          s=p.read_text(encoding='utf-8')
          old1="req=urllib.request.Request(base+path+'?verify='+str(time.time()),headers={'Cache-Control':'no-cache','User-Agent':'Mozilla/5.0'})"
          new1="req=urllib.request.Request(base+path,headers={'User-Agent':'Mozilla/5.0'})"
          old2="req=urllib.request.Request(base+path+'?verify='+str(time.time()),headers={'Cache-Control':'no-cache','Pragma':'no-cache','User-Agent':'Mozilla/5.0'})"
          new2="req=urllib.request.Request(base+path,headers={'User-Agent':'Mozilla/5.0'})"
          if s.count(old1) != 1 or s.count(old2) != 1:
              raise SystemExit(f'Unexpected verify patterns: center={s.count(old1)} cancer={s.count(old2)}')
          s=s.replace(old1,new1,1).replace(old2,new2,1)
          p.write_text(s,encoding='utf-8')
          print('CLEAN_URL_VERIFY_PATCHED')
          PY
      - name: Commit patch and remove one-time workflow
        run: |
          rm .github/workflows/fix-clean-seo-verify-once.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/workflows/build-seo.yml .github/workflows/fix-clean-seo-verify-once.yml
          git commit -m "Verify deployed SEO pages through clean URLs"
          git push
