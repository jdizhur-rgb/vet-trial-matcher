name: Address directory training v3
on:
  push:
    branches: [addresses-schema-test-20260911]
    paths: ['.github/workflows/address-directory-training-v3.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: addresses-schema-test-20260911
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Build training candidate
        run: |
          PYTHONPATH=. python tools/patch_trial_address_renderer.py
          PYTHONPATH=. python tools/build_trial_site_directory.py | tee /tmp/address_audit.txt
          python -m py_compile pages/1_Clinical_Trial_Finder.py seo/trial_site_directory.py tools/build_trial_site_directory.py
      - name: Validate directory behavior
        run: |
          PYTHONPATH=. python - <<'PY'
          from seo.trial_site_directory import active_trial_addresses, trial_site_records
          from tools.build_trial_site_directory import load_trials
          trials=load_trials(); by={t['id']:t for t in trials}
          ucd=active_trial_addresses(by['ucd-pdl1-metastatic'])
          uf=active_trial_addresses(by['uf-oral-melanoma-vaccine-pd1'])
          assert any('1 Garrod Dr' in x for x in ucd), ucd
          assert any('2089 SW 16th Ave' in x for x in uf), uf
          synthetic={'id':'training-multisite','center':'Training Network','sites':[{'name':'Active A','street':'1 Active Rd','city':'Testville','state':'MA','postal_code':'01001','status':'active'},{'name':'Active B','street':'2 Active Rd','city':'Testville','state':'MA','postal_code':'01002','status':'active'}],'inactive_sites':[{'name':'Sleeping C','street':'3 Old Rd','city':'Testville','state':'MA','postal_code':'01003','status':'inactive'}]}
          recs=trial_site_records(synthetic)
          assert [r['status'] for r in recs].count('active')==2
          assert [r['status'] for r in recs].count('inactive')==1
          shown=active_trial_addresses(synthetic)
          assert any('1 Active Rd' in x for x in shown)
          assert any('2 Active Rd' in x for x in shown)
          assert not any('3 Old Rd' in x for x in shown)
          print('SCHEMA_OK', ucd, uf)
          PY
      - name: Install app and Chromium
        run: |
          pip install -r requirements.txt playwright
          python -m playwright install --with-deps chromium
      - name: Browser address field desktop and mobile
        run: |
          set -e
          streamlit run app.py --server.headless true --server.port 8765 > /tmp/app.log 2>&1 &
          PID=$!
          sleep 8
          python - <<'PY'
          from playwright.sync_api import sync_playwright
          def choose(page,label,value):
              lab=page.get_by_text(label,exact=True).first
              combo=lab.locator('xpath=following::div[@role="combobox"][1]')
              combo.click(); page.get_by_role('option',name=value,exact=True).click(); page.wait_for_timeout(500)
          with sync_playwright() as p:
              b=p.chromium.launch(headless=True)
              for label,w,h in [('DESKTOP',1440,1200),('MOBILE',390,844)]:
                  page=b.new_page(viewport={'width':w,'height':h}); errs=[]
                  page.on('pageerror',lambda e: errs.append(str(e)))
                  page.goto('http://127.0.0.1:8765',wait_until='domcontentloaded',timeout=60000); page.wait_for_timeout(7000)
                  choose(page,'Country / region','USA'); choose(page,'Cancer type','Cancer — any type')
                  page.get_by_role('button',name='Find potential trials').click(); page.wait_for_timeout(5000)
                  body=page.locator('body').inner_text(); print(label,'BODYLEN',len(body))
                  assert 'Results' in body and 'Address:' in body
                  assert '1 Garrod Dr' in body
                  assert '2089 SW 16th Ave' in body
                  assert not errs, errs
                  page.close()
              b.close()
          PY
          kill $PID
