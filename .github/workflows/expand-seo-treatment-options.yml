name: Expand treatment options SEO
on:
  push:
    paths: ['.github/workflows/expand-seo-treatment-options.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/expand_seo_treatment_options_20260906.py
      - run: python -m py_compile seo/generate_seo.py
      - run: python seo/generate_seo.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add seo/generate_seo.py seo/site
          git commit -m "Expand SEO to cancer treatment options for dogs and cats" && git push || true
