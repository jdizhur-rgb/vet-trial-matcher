name: Apply SEO page order cosmetic update
on:
  push:
    paths: ['.github/workflows/apply-seo-page-order-20260908.yml']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python -m py_compile seo/generate_seo.py seo/generate_seo_strict.py
      - run: cd seo && python generate_seo_strict.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add seo/site
          git commit -m "Apply cancer overview page order" && git push || true
