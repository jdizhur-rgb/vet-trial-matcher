name: Weekly recruitment content review

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/weekly_content_audit.py'
      - '.github/workflows/weekly-content-audit.yml'
  schedule:
    - cron: '37 13 * * 0'

permissions:
  contents: read

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build manual review queue
        run: python scripts/weekly_content_audit.py --markdown-report "$GITHUB_STEP_SUMMARY"
