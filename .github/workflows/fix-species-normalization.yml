name: Fix and verify catalog species normalization
on:
  push:
    paths:
      - '.github/workflows/fix-species-normalization.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix-test-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/fix_species_normalization_20260907.py
      - name: Validate catalog and matcher invariants
        run: |
          python - <<'PY'
          import json, glob
          from pathlib import Path
          base=json.load(open('data/trials_base.json',encoding='utf-8'))
          by={x['id']:x for x in base}
          for fn in ['data/trial_updates.json']+sorted(glob.glob('data/catalog_patch_*.json')):
              d=json.load(open(fn,encoding='utf-8'))
              for rid in d.get('delete',[]): by.pop(rid,None)
              for r in d.get('upsert',[]):
                  old=dict(by.get(r['id'],{})); old.update(r); by[r['id']]=old
          def sp(v):
              if isinstance(v,list): return set(v)
              return {x.strip() for x in str(v or '').split('/') if x.strip()}
          china=[r for r in by.values() if r.get('country')=='China' and 'Dog' in sp(r.get('species')) and r.get('study_type')=='treatment' and r.get('available_for_matching',True) and r.get('status_confidence') in {'current','confirmed_current'}]
          taiwan=[r for r in by.values() if r.get('country')=='Taiwan' and 'Dog' in sp(r.get('species')) and r.get('available_for_matching',True)]
          korea=[r for r in by.values() if r.get('country')=='South Korea' and 'Dog' in sp(r.get('species')) and r.get('available_for_matching',True)]
          assert len(china)>=4, f'China expected >=4, got {len(china)}'
          assert len(taiwan)>=2, f'Taiwan expected >=2, got {len(taiwan)}'
          assert len(korea)>=2, f'Korea expected >=2, got {len(korea)}'
          ids=[r['id'] for r in by.values()]
          assert len(ids)==len(set(ids))
          src=Path('pages/1_Clinical_Trial_Finder.py').read_text(encoding='utf-8')
          assert "def species_matches(" in src
          assert "species not in str(tr.get('species', '')).split('/')" not in src
          print('PASS China',len(china),'Taiwan',len(taiwan),'South Korea',len(korea))
          PY
      - name: Commit only after tests pass
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pages/1_Clinical_Trial_Finder.py
          git diff --cached --quiet || (git commit -m "Fix list species matching for international trials" && git push origin main)
