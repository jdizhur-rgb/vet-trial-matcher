name: Remove Supabase feedback once
on:
  push:
    paths:
      - '.github/workflows/remove-supabase-feedback-once.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove feedback backend and form
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('app.py')
          s = p.read_text()
          s = s.replace('import json, urllib.request, re', 'import re')
          s = s.replace('_SUPABASE_URL="https://bvghrabcfrexvynlyhqb.supabase.co";_SUPABASE_KEY=st.secrets.get("SUPABASE_KEY","")\n', '')
          old = '''    if body==_feedback_text:\n        _save_controls();_orig["write"]("If a trial team says your pet is not eligible, you can share the reason without providing your name or email.")\n        with st.expander("Share eligibility feedback"):\n            with st.form("eligibility_feedback_form",clear_on_submit=True):\n                trial=_orig["text_input"]("Trial / center",max_chars=300);reason=st.text_area("Reason the trial team said your pet was not eligible",max_chars=2000);st.caption("No name or email is required. Please do not include identifying information.");sent=st.form_submit_button("Submit feedback",use_container_width=True)\n                if sent:\n                    if not trial.strip() or not reason.strip():st.warning("Please enter the trial / center and the reason given by the trial team.")\n                    elif not _SUPABASE_KEY:st.error("Feedback service is not configured.")\n                    else:\n                        try:\n                            data=json.dumps({"trial_center":trial.strip(),"exclusion_reason":reason.strip()}).encode();req=urllib.request.Request(f"{_SUPABASE_URL}/rest/v1/eligibility_feedback",data=data,method="POST",headers={"apikey":_SUPABASE_KEY,"Content-Type":"application/json","Prefer":"return=minimal"});urllib.request.urlopen(req,timeout=10);st.success("Thank you. Your feedback was submitted.")\n                        except Exception:st.error("Feedback could not be submitted. Please try again later.")\n        return\n'''
          new = '''    if body==_feedback_text:\n        _save_controls()\n        return\n'''
          if old not in s:
              raise SystemExit('Expected feedback block not found; refusing to modify app.py')
          s = s.replace(old, new)
          p.write_text(s)
          PY
      - name: Verify no Supabase dependency remains
        run: |
          python -m py_compile app.py
          ! grep -q 'supabase.co\|SUPABASE_KEY\|eligibility_feedback' app.py
      - name: Commit change
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.py
          git commit -m 'Remove Supabase eligibility feedback' || exit 0
          git push
