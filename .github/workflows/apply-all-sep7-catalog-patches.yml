name: Apply all Sep 7 catalog patches
on:
  push:
    paths:
      - '.github/workflows/apply-all-sep7-catalog-patches.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/apply_all_20260907_catalog_patches.py
      - name: Commit merged catalog
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/trial_updates.json
          if git diff --cached --quiet; then
            echo "No catalog changes needed"
          else
            git commit -m "Promote all staged Sep 7 treatment records"
            git push origin main
          fi
