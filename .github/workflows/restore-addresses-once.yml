name: Restore trial center addresses once

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/restore-addresses-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch address renderer only
        run: python scripts/restore_trial_addresses_once.py
      - name: Commit address restore
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app.py
          git diff --cached --quiet && exit 1
          git commit -m "Restore full center addresses in trial result cards"
          git push
