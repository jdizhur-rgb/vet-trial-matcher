name: Regenerate SEO after dedupe
on:
  push:
    paths: ['.github/workflows/regenerate-seo-after-dedupe.yml']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python seo/generate_seo.py
      - run: |
          if [ -f seo/postprocess_design.py ]; then python seo/postprocess_design.py; fi
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if ! git diff --quiet -- seo/site; then
            git add seo/site
            git commit -m 'Regenerate SEO pages from deduped catalog'
            git push
          fi
