name: Add VetOmics CGP option
on:
  push:
    paths: ['.github/workflows/add-vetomics-option-20260907.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/add_vetomics_option_20260907.py
      - run: python -m py_compile pages/2_Additional_Oncology_Options.py
      - run: |
          grep -q 'vetomics-cgp-genomic-guidance' pages/2_Additional_Oncology_Options.py
          grep -q 'VetOmics Canine CGP' pages/2_Additional_Oncology_Options.py
          grep -q '\$900' pages/2_Additional_Oncology_Options.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pages/2_Additional_Oncology_Options.py
          git commit -m "Add VetOmics Canine CGP to treatment options" && git push || true
