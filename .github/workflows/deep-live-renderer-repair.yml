name: Deep live renderer repair
on:
  push:
    branches: [live-main-repair]
    paths: ['.github/workflows/deep-live-renderer-repair.yml']
permissions:
  contents: write
jobs:
  repair-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: live-main-repair
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Repair renderer only
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          # BARC: confirmed single physical center address.
          p=Path('seo/center_directory.py'); s=p.read_text()
          barc='    "Bridge Animal Referral Center (BARC)": "Bridge Animal Referral Center, 8401 Main St, Edmonds, WA 98026",\n'
          if barc not in s:
              anchor='    "Aurelius Biotherapeutics": "Aurelius Biotherapeutics, 720 Virginia St, Bellingham, WA 98225",\n'
              if anchor not in s: raise SystemExit('BARC anchor not found')
              s=s.replace(anchor,anchor+barc,1)
          compile(s,'seo/center_directory.py','exec'); p.write_text(s)

          # Shell: delete stale metadata buffering. Result metadata must render where it is emitted.
          p=Path('app.py'); s=p.read_text()
          s=s.replace('        if body.startswith("**Contact:**"):_pending["contact"]=body.replace("**Contact:**","",1).strip();return\n','')
          s=s.replace('        if body.startswith("**Participating sites:**"):_pending["sites"]=body.replace("**Participating sites:**","",1).strip();return\n','')
          compile(s,'app.py','exec'); p.write_text(s)

          # Page: make direct dict reads resilient; existing renderer then emits Contact + Participating sites natively.
          p=Path('pages/1_Clinical_Trial_Finder.py'); s=p.read_text()
          s=s.replace("tr['notes']", "tr.get('notes', 'See the official study page for current study details.')")
          s=s.replace("tr['status']", "tr.get('status', 'Status not recorded')")
          s=s.replace("tr['center']", "tr.get('center', 'Study center')")
          s=s.replace("tr['title']", "tr.get('title', 'Clinical study')")
          compile(s,'pages/1_Clinical_Trial_Finder.py','exec'); p.write_text(s)
          PY
      - name: Install test tools
        run: |
          pip install -r requirements.txt
          pip install playwright
          python -m playwright install chromium
      - name: Pass 1 static and data
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from seo.center_directory import addresses_for
          app=Path('app.py').read_text(); page=Path('pages/1_Clinical_Trial_Finder.py').read_text()
          assert 'if body.startswith("**Contact:**"):_pending' not in app
          assert 'if body.startswith("**Participating sites:**"):_pending' not in app
          assert "tr['notes']" not in page and "tr['status']" not in page
          by={t['id']:t for t in json.loads(Path('data/trials_base.json').read_text())}
          for f in [Path('data/trial_updates.json')]+sorted(Path('data').glob('catalog_patch_*.json')):
              d=json.loads(f.read_text())
              for tid in d.get('delete',[]): by.pop(tid,None)
              for x in d.get('upsert',[]):
                  m=dict(by.get(x['id'],{}))
                  for k,v in x.items():
                      if k in {'requires','excludes'} and isinstance(v,dict):
                          n=dict(m.get(k,{})); n.update(v); m[k]=n
                      else: m[k]=v
                  by[x['id']]=m
          e=by['ethos-gilvetmab-melanoma']
          assert len(e.get('sites') or [])==3, e.get('sites')
          assert any('8401 Main St' in x for x in addresses_for('Bridge Animal Referral Center (BARC)'))
          bad=[]
          for tid,t in by.items():
              if not t.get('available_for_matching',True): continue
              if t.get('status_confidence') not in {'current','confirmed_current'}: continue
              if t.get('study_type','treatment') not in {'treatment','other_treatment_access'}: continue
              miss=[k for k in ('title','center','status') if not t.get(k)]
              if miss: bad.append((tid,miss))
          assert not bad,bad
          print('PASS1_OK')
          PY
      - name: Pass 2 Streamlit simulation
        run: |
          python - <<'PY'
          from streamlit.testing.v1 import AppTest
          at=AppTest.from_file('app.py',default_timeout=30).run()
          def sb(label): return next(x for x in at.selectbox if x.label==label)
          sb('Country / region').select('USA'); sb('Cancer type').select('Oral melanoma'); at.run()
          next(b for b in at.button if b.label=='Find potential trials').click(); at.run()
          text='\n'.join(str(getattr(e,'value','')) for kind in ('markdown','text','caption') for e in getattr(at,kind))
          needed=['Ethos Veterinary Health','Metropolitan Veterinary Hospital — Cleveland, OH','Summit Veterinary Referral Center — Tacoma, WA','Veterinary Specialty Hospital — San Diego, CA','Bridge Animal Referral Center, 8401 Main St, Edmonds, WA 98026']
          missing=[x for x in needed if x not in text]
          if at.exception: raise SystemExit('exceptions '+repr(at.exception))
          if missing: raise SystemExit('missing '+repr(missing))
          print('PASS2_OK')
          PY
      - name: Pass 3 Chromium DOM
        run: |
          streamlit run app.py --server.headless=true --server.port=8501 >/tmp/st.log 2>&1 &
          for i in {1..45}; do curl -fsS http://127.0.0.1:8501/_stcore/health && break || sleep 1; done
          python - <<'PY'
          from playwright.sync_api import sync_playwright
          with sync_playwright() as p:
              b=p.chromium.launch(headless=True)
              pg=b.new_page(viewport={'width':1280,'height':1600})
              pg.goto('http://127.0.0.1:8501',wait_until='networkidle',timeout=60000)
              sels=pg.locator('div[data-baseweb="select"]')
              sels.nth(1).click(); pg.get_by_text('USA',exact=True).last.click()
              sels=pg.locator('div[data-baseweb="select"]')
              sels.nth(3).click(); pg.get_by_text('Oral melanoma',exact=True).last.click()
              pg.get_by_role('button',name='Find potential trials').click()
              pg.get_by_text('Results',exact=True).wait_for(timeout=30000)
              body=pg.locator('body').inner_text()
              needed=['Ethos Veterinary Health','Metropolitan Veterinary Hospital — Cleveland, OH','Summit Veterinary Referral Center — Tacoma, WA','Veterinary Specialty Hospital — San Diego, CA','Bridge Animal Referral Center, 8401 Main St, Edmonds, WA 98026']
              missing=[x for x in needed if x not in body]
              if missing: raise SystemExit('browser missing '+repr(missing))
              b.close()
          print('PASS3_OK')
          PY
      - name: Commit tested repair
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app.py pages/1_Clinical_Trial_Finder.py seo/center_directory.py
          git commit -m 'Fix live trial metadata rendering and BARC address'
          git push origin HEAD:live-main-repair
