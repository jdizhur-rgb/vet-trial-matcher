name: Add zero-trial cancer pages 2026-09-09
on:
  push:
    paths:
      - '.github/workflows/add-zero-trial-cancer-pages-20260909.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Keep every canonical cancer page even with zero current trials
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('seo/generate_seo.py')
          s=p.read_text()
          old_cancers="cancers=sorted({c for r in rows for c in row_cancers(r)})"
          new_cancers="cancers=sorted(DISEASE_INFO)"
          assert old_cancers in s, 'expected catalog-derived cancer list not found'
          s=s.replace(old_cancers,new_cancers,1)
          old='    if not hit: continue\n    label=display_name(key); slug=slugify(key)'
          new='    label=display_name(key); slug=slugify(key)'
          assert old in s, 'expected zero-trial skip not found'
          p.write_text(s.replace(old,new,1))

          p=Path('seo/cancer_page_enhancements.py')
          s=p.read_text()
          old="""    summary = (\n        f'<div class=\"cancer-summary\"><strong class=\"opportunity-count\">{count} current treatment opportunities</strong>'\n        f'<p>Clinical trials and advanced cancer treatment studies currently represented in our catalog for {label_html}.</p>'\n        '<p class=\"summary-detail\">See locations, key eligibility, costs when provided, contacts and official enrollment links below.</p></div>'\n    )"""
          new="""    if count == '0':\n        summary = (\n            '<div class=\"cancer-summary\"><strong class=\"opportunity-count\">No current treatment opportunities in our catalog</strong>'\n            f'<p>We do not currently have an active {label_html} trial or advanced treatment listing for this species and region.</p>'\n            '<p class=\"summary-detail\">The cancer information on this page remains available, and new studies can be added here when enrollment opens.</p></div>'\n        )\n    else:\n        summary = (\n            f'<div class=\"cancer-summary\"><strong class=\"opportunity-count\">{count} current treatment opportunities</strong>'\n            f'<p>Clinical trials and advanced cancer treatment studies currently represented in our catalog for {label_html}.</p>'\n            '<p class=\"summary-detail\">See locations, key eligibility, costs when provided, contacts and official enrollment links below.</p></div>'\n        )"""
          assert old in s, 'expected summary block not found'
          s=s.replace(old,new,1)
          old2="""    text = text.replace(\n        '<h2>Treatment &amp; research</h2><p>Below are treatment-focused clinical trials and advanced oncology options currently represented in our live catalog.</p>',\n        '<h2>Current clinical trials &amp; treatment options</h2><p class=\"section-intro\">Browse the current listings below, then use the free matcher to check the study-specific criteria against your pet’s diagnosis and situation.</p>',\n        1,\n    )"""
          new2="""    research_intro = (\n        '<h2>Current clinical trials &amp; treatment options</h2><p class=\"section-intro\">No active listings are currently represented in our catalog for this species and region. We keep this page available so new opportunities can appear here when they open.</p>'\n        if count == '0' else\n        '<h2>Current clinical trials &amp; treatment options</h2><p class=\"section-intro\">Browse the current listings below, then use the free matcher to check the study-specific criteria against your pet’s diagnosis and situation.</p>'\n    )\n    text = text.replace(\n        '<h2>Treatment &amp; research</h2><p>Below are treatment-focused clinical trials and advanced oncology options currently represented in our live catalog.</p>',\n        research_intro,\n        1,\n    )"""
          assert old2 in s, 'expected research intro block not found'
          p.write_text(s.replace(old2,new2,1))
          PY
      - name: Compile and regenerate all pages
        run: |
          python -m py_compile seo/generate_seo.py seo/generate_seo_strict.py seo/cancer_page_enhancements.py seo/cancer_owner_content.py
          python seo/generate_seo_strict.py
      - name: Verify zero-trial pages and all canonical combinations
        run: |
          python - <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0,'seo')
          import generate_seo as g
          root=Path('seo/site')
          cancers=sorted(g.DISEASE_INFO)
          expected=[]
          for region in ('north-america','uk-europe'):
            for species in ('dogs','cats'):
              for key in cancers:
                expected.append(root/region/species/g.slugify(key)/'index.html')
          missing=[str(p) for p in expected if not p.exists()]
          assert not missing, 'missing canonical cancer pages: '+', '.join(missing[:20])
          for p in expected:
            s=p.read_text()
            assert 'How it is usually treated' in s, p
            assert 'What can affect treatment choices' in s, p
            assert '<link rel="canonical"' in s, p
          zeros=[p for p in expected if 'No current treatment opportunities in our catalog' in p.read_text()]
          assert zeros, 'expected at least one zero-trial page'
          print('CANONICAL_ENGLISH_PAGES',len(expected),'ZERO_TRIAL_PAGES',len(zeros))
          PY
      - name: Commit generator and complete generated site
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add seo/generate_seo.py seo/cancer_page_enhancements.py seo/site
          git diff --cached --quiet || git commit -m 'Keep cancer pages available with zero active trials'
          git push
