name: Normalize static site shape once
on:
  push:
    paths: ['.github/workflows/normalize-static-site-shape-once.yml']
permissions:
  contents: write
jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python - <<'PY'
          import json
          from pathlib import Path
          files=list(Path('data').glob('catalog_patch_zzzzzzzz*static_location*.json'))
          for p in files:
            d=json.loads(p.read_text())
            for r in d.get('upsert',[]):
              for key in ('sites','inactive_sites'):
                for s in r.get(key,[]) or []:
                  if s.get('label') and not s.get('hospital'):
                    s['hospital']=s['label']; s['city']=''; s['state']=''
            p.write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\n')
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add data/catalog_patch_zzzzzzzz*static_location*.json
          git commit -m 'Normalize stored static site fields'
          git push origin main
