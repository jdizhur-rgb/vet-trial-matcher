name: Correct semantic dedupe
on:
  push:
    paths:
      - '.github/workflows/fix-semantic-dedup-20260906.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore pre-audit catalog and apply conservative duplicate groups
        run: |
          python - <<'PY'
          import json, subprocess
          from pathlib import Path
          PRE='6be491f3374c8a9ca1f3fadac9d5726757c772fe'
          raw=subprocess.check_output(['git','show',f'{PRE}:data/trial_updates.json'],text=True)
          upd=json.loads(raw)
          base=json.loads(Path('data/trials_base.json').read_text())
          base_ids={r['id'] for r in base}

          # Each group is one protocol represented under multiple legacy IDs.
          # Keep the most specific/current canonical ID; DO NOT collapse different protocols
          # merely because they share an index/listing URL.
          groups={
            'fr-fregis-chemodectoma-thermoablation':['eu-fr-chemodectoma-thermoablation'],
            'uf-osa-mrna':['uf-osa-vaccine'],
            'osu-sts-mic-nk':['osu-sts-nk'],
            'umn-canine-oral-melanoma-aav-vaccine':['umn-melanoma-aav','umn-oral-melanoma-aav-vaccine'],
            'umn-feline-mammary-olaparib-meloxicam':['umn-feline-mammary'],
            'illinois-oral-melanoma-il12-il15':['ill-melanoma'],
            'illinois-osa-pulm-met-treatment':['ill-osa-pulm'],
            'illinois-osa-radiation':['ill-osa-rt'],
            'illinois-sts-treatment':['ill-sts'],
            'illinois-sts-surgery':['ill-sts-surg'],
            'illinois-ucc-gilvetmab-epacadostat':['ill-uc'],
            'penn-flash-rt-extremity-sts':['penn-flash-sts','upenn-extremity-sarcoma-proton-flash'],
            'penn-psma-theranostic-prostate':['penn-prostate','upenn-prostate-psma-theranostic'],
            'upenn-osa-car-inkt-met':['penn-osa-car-inkt-met'],
            'csu-ucc-lapatinib-rt':['csu-tcc-lapatinib-rt'],
            'csu-cotc033-vaccine-immunity':['csu-cotc033-vaccine'],
            'csu-osa-3d-limb-spare':['csu-osa-implant'],
            'ncsu-canine-ucc-il12':['ncsu-bladder-immunotherapy'],
            'ncsu-canine-osa-rt-surgery':['ncsu-osa-rt-compare'],
            'ncsu-canine-sts-xcsgel':['ncsu-sts-xcsgel'],
            'umn-sarcoma-trike-rt':['umn-trike-sarcoma'],
            'tufts-sts-fap-car-t':['tufts-sts-fap-cart'],
            'tufts-z007-broad-solid-2026':['tufts-z007-solid-tumors'],
            'tufts-met-osa-vaccine-tme':['tufts-osa-met-vax'],
            'lsu-scc-intratumoral-chemo':['lsu-scc-intratumoral'],
            'utsw-vroc-glioma-car-neutrophils-rt':['vroc-car-neutrophil-glioma','utsw-glioma-car-neutrophil-rt'],
            'utsw-vroc-glioma-ferumoxytol-rt':['vroc-ferumoxytol-glioma','utsw-glioma-ferumoxytol-rt'],
            'utsw-solid-cpmv':['vroc-cpmv-solid'],
            'utsw-vroc-melanoma-crtnp-hifu-pdl1':['vroc-melanoma-crtnp','utsw-melanoma-crtnp-hifu-pdl1'],
            'utsw-vroc-melanoma-carboplatin-hifu':['vroc-melanoma-carboplatin-hifu','utsw-melanoma-carboplatin-hifu'],
            'utsw-advanced-tumor-compassionate':['vroc-compassionate-advanced'],
            'vt-thyroid-histotripsy':['vtech-thyroid-histotripsy'],
            'ucd-care-canine-glioma':['ucd-care-glioma-autophagy-rt','ucd-glioma-care'],
          }
          drop={x for xs in groups.values() for x in xs}
          # Remove duplicate update records; base duplicates must be deleted explicitly.
          upd['upsert']=[r for r in upd.get('upsert',[]) if r.get('id') not in drop]
          existing_del=[x for x in upd.get('delete',[]) if x not in groups]
          upd['delete']=list(dict.fromkeys(existing_del+[x for x in sorted(drop) if x in base_ids]))
          Path('data/trial_updates.json').write_text(json.dumps(upd,indent=2,ensure_ascii=False)+'\n')

          # Build effective catalog and stats after conservative dedupe.
          by={r['id']:dict(r) for r in base}
          for x in upd.get('delete',[]): by.pop(x,None)
          for p in upd.get('upsert',[]):
            by[p['id']]={**by.get(p['id'],{}),**p}
          matching=[r for r in by.values() if r.get('available_for_matching') is True and r.get('study_type')=='treatment']
          from collections import Counter
          def scalar(v):
            if isinstance(v,list): return '/'.join(map(str,v))
            return str(v or 'Unknown')
          stats={
            'generated':'2026-09-06',
            'effective_total_records':len(by),
            'current_treatment_opportunities':len(matching),
            'by_country':dict(sorted(Counter(scalar(r.get('country')) for r in matching).items())),
            'by_species':dict(sorted(Counter(scalar(r.get('species')) for r in matching).items())),
            'dedupe_note':'Conservative semantic dedupe completed. Distinct protocols sharing institutional listing URLs were restored; only explicitly reviewed same-protocol legacy IDs were collapsed.',
            'duplicate_groups_collapsed':groups
          }
          Path('data/catalog_stats.json').write_text(json.dumps(stats,indent=2,ensure_ascii=False)+'\n')
          report={
            'generated':'2026-09-06',
            'method':'manual review of semantic candidates; shared index URL alone is never sufficient',
            'canonical_groups':groups,
            'duplicate_ids_removed':sorted(drop),
            'distinct_protocols_restored_after_overaggressive_pass':[
              'eu-fr-hepatic-chemoembolization','csu-mct-cryo','vroc/UTSW ferumoxytol glioma protocol',
              'Illinois osteosarcoma immunotherapy vs radiation protocols','ELIAS ECI novel-adjuvant vs chemotherapy protocols',
              'country-specific Immuvvera/Nebumet access records','CSU B-cell lymphoma protocols'
            ],
            'effective_total_after':len(by),
            'treatment_total_after':len(matching)
          }
          Path('data/duplicate_audit_20260906_final.json').write_text(json.dumps(report,indent=2,ensure_ascii=False)+'\n')
          print(json.dumps(stats,indent=2))
          PY
      - name: Validate and commit
        run: |
          python -m json.tool data/trial_updates.json >/dev/null
          python -m json.tool data/catalog_stats.json >/dev/null
          python -m json.tool data/duplicate_audit_20260906_final.json >/dev/null
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add data/trial_updates.json data/catalog_stats.json data/duplicate_audit_20260906_final.json
          git diff --cached --quiet && exit 0
          git commit -m 'Correct semantic duplicate cleanup and restore distinct trials'
          git push
