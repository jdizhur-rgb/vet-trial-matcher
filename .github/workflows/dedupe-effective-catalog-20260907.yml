name: Dedupe effective catalog 20260907
on:
  push:
    paths:
      - '.github/workflows/dedupe-effective-catalog-20260907.yml'
  workflow_dispatch:
jobs:
  dedupe:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/dedupe_effective_catalog_20260907.py
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add data/trial_updates.json
          git commit -m "Dedupe effective treatment catalog" || exit 0
          git push
