name: Apply verified semantic dedupe
on:
  push:
    paths: ['.github/workflows/apply-semantic-dedupe-once.yml']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python scripts/semantic_dedupe_catalog.py --apply
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if ! git diff --quiet -- data/trial_updates.json; then
            git add data/trial_updates.json
            git commit -m 'Remove verified semantic duplicate trials'
            git push
          fi
      - run: python scripts/semantic_dedupe_catalog.py
