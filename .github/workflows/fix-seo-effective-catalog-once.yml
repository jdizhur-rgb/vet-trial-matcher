name: One-time fix SEO effective catalog parity

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-seo-effective-catalog-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Patch SEO loader to mirror live effective catalog
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('seo/generate_seo.py')
          s = p.read_text()
          old = '''def load_effective():
 base=json.loads((ROOT/'data'/'trials_base.json').read_text()); upd=json.loads((ROOT/'data'/'trial_updates.json').read_text()); rows={r['id']:r for r in base}
 for p in upd.get('upsert',[]): rows[p['id']]={**rows.get(p['id'],{}),**p}
 for rid in upd.get('delete',[]): rows.pop(rid,None)
 return [r for r in rows.values() if r.get('study_type')=='treatment' and r.get('available_for_matching') is True]
'''
          new = '''CURRENT_STATUS_CONFIDENCE={'current','confirmed_current'}
def _merge_record(old,patch):
 new=dict(old)
 for k,v in patch.items():
  if k in {'requires','excludes'} and isinstance(v,dict):
   nested=dict(new.get(k,{}) if isinstance(new.get(k),dict) else {}); nested.update(v); new[k]=nested
  else: new[k]=v
 return new
def load_effective():
 base=json.loads((ROOT/'data'/'trials_base.json').read_text()); rows={r['id']:r for r in base}
 patch_paths=[ROOT/'data'/'trial_updates.json']+sorted((ROOT/'data').glob('catalog_patch_*.json'))
 for path in patch_paths:
  if not path.exists(): continue
  doc=json.loads(path.read_text())
  for rid in doc.get('delete',[]): rows.pop(rid,None)
  for patch in doc.get('upsert',[]): rows[patch['id']]=_merge_record(rows.get(patch['id'],{}),patch)
 return [r for r in rows.values() if r.get('study_type')=='treatment' and r.get('available_for_matching') is True and r.get('status_confidence') in CURRENT_STATUS_CONFIDENCE]
'''
          if old not in s:
              raise SystemExit('expected load_effective block not found')
          p.write_text(s.replace(old,new,1))

          w = Path('.github/workflows/build-seo.yml')
          ws = w.read_text()
          needle = "      - 'data/trial_updates.json'\n"
          repl = needle + "      - 'data/catalog_patch_*.json'\n"
          if "      - 'data/catalog_patch_*.json'\n" not in ws:
              if needle not in ws:
                  raise SystemExit('build-seo trigger insertion point not found')
              w.write_text(ws.replace(needle,repl,1))

          Path('.github/workflows/fix-seo-effective-catalog-once.yml').unlink()
          PY
      - name: Validate
        run: |
          python -m py_compile seo/generate_seo.py seo/generate_seo_strict.py
          python seo/generate_seo_strict.py
          python - <<'PY'
          from pathlib import Path
          s=Path('seo/site/north-america/dogs/histiocytic-sarcoma/index.html').read_text()
          assert 'Combination trametinib and sapanisertib for canine malignant neoplasia' not in s
          assert '4 current treatment opportunities in our catalog.' in s
          print('HS SEO parity OK')
          PY
      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add seo/generate_seo.py .github/workflows/build-seo.yml .github/workflows/fix-seo-effective-catalog-once.yml seo/site
          git commit -m 'Make SEO use the live effective catalog'
          git push
