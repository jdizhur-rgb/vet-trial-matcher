name: Merge daily oncology audit 2026-09-06

on:
  push:
    paths:
      - 'data/daily_audit_20260906.json'
      - '.github/workflows/merge-daily-audit-20260906.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Merge current treatment additions and watchlist
        run: |
          python - <<'PY'
          import json, re
          from pathlib import Path
          from collections import Counter

          base = json.loads(Path('data/trials_base.json').read_text())
          upd_path = Path('data/trial_updates.json')
          upd = json.loads(upd_path.read_text())
          patch = json.loads(Path('data/daily_audit_20260906.json').read_text())
          upserts = upd.setdefault('upsert', [])

          def norm(s):
              return re.sub(r'[^a-z0-9]+', ' ', str(s).lower()).strip()
          def sig(r):
              return (norm(r.get('title','')), norm(r.get('center','')))
          def scalar(v, default='Unknown'):
              if isinstance(v, list):
                  return '/'.join(str(x) for x in v) if v else default
              if isinstance(v, dict):
                  return json.dumps(v, sort_keys=True, ensure_ascii=False)
              return v if v not in (None, '') else default

          effective = {r.get('id'): r for r in base if r.get('id')}
          for r in upserts:
              rid = r.get('id')
              if rid:
                  effective[rid] = {**effective.get(rid, {}), **r}
          existing_ids = set(effective)
          existing_sigs = {sig(r) for r in effective.values() if r.get('title')}

          added=[]
          for r in patch.get('upsert', []):
              if r['id'] in existing_ids or sig(r) in existing_sigs:
                  continue
              upserts.append(r)
              effective[r['id']] = r
              existing_ids.add(r['id'])
              existing_sigs.add(sig(r))
              added.append(r['id'])

          upd_path.write_text(json.dumps(upd, indent=2, ensure_ascii=False) + '\n')

          wp = Path('data/watchlist.json')
          wd = json.loads(wp.read_text())
          wl = wd.setdefault('watchlist', [])
          byid = {r.get('id'): i for i,r in enumerate(wl) if r.get('id')}
          for r in patch.get('watchlist', []):
              if r['id'] in byid:
                  wl[byid[r['id']]] = {**wl[byid[r['id']]], **r}
              else:
                  wl.append(r)
                  byid[r['id']] = len(wl)-1
          wp.write_text(json.dumps(wd, indent=2, ensure_ascii=False) + '\n')

          matching=[r for r in effective.values() if r.get('available_for_matching') is True and r.get('study_type') == 'treatment']
          countries=Counter(scalar(r.get('country')) for r in matching)
          species=Counter(scalar(r.get('species')) for r in matching)
          stats={
              'generated':'2026-09-06',
              'effective_total_records':len(effective),
              'current_treatment_opportunities':len(matching),
              'by_country':dict(sorted(countries.items())),
              'by_species':dict(sorted(species.items())),
              'daily_audit_added':added,
              'audit_note':'Daily external oncology audit: added newly confirmed MSU histiocytic-sarcoma quasiorganelle therapy and UC Davis CARE glioma treatment trial. Clinaxel CX23/F01 and CX22/B01 remain insufficiently disclosed for matching; SLU OXC-101 lacks confirmed patient recruitment; Utrecht holmium lacks fresh recruitment; LISANEXT is temporarily not accepting applications.'
          }
          Path('data/catalog_stats.json').write_text(json.dumps(stats, indent=2, ensure_ascii=False)+'\n')
          print(json.dumps(stats, indent=2, ensure_ascii=False))
          PY
      - name: Validate JSON
        run: |
          python -m json.tool data/trial_updates.json >/dev/null
          python -m json.tool data/watchlist.json >/dev/null
          python -m json.tool data/catalog_stats.json >/dev/null
      - name: Commit merged catalog
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add data/trial_updates.json data/watchlist.json data/catalog_stats.json
          git diff --cached --quiet && exit 0
          git commit -m 'Merge Sep 6 daily veterinary oncology audit'
          git push
