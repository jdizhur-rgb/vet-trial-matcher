name: Merge expanded source discoveries

on:
  push:
    paths:
      - 'data/discovery_expansion_20260905.json'
      - '.github/workflows/merge-discovery-expansion-20260905.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Merge treatment records and recalculate stats
        run: |
          python - <<'PY'
          import json, re
          from pathlib import Path
          base=json.loads(Path('data/trials_base.json').read_text())
          p=Path('data/trial_updates.json'); upd=json.loads(p.read_text())
          incoming=json.loads(Path('data/discovery_expansion_20260905.json').read_text())
          upserts=upd.setdefault('upsert',[])
          def norm(s): return re.sub(r'[^a-z0-9]+',' ',str(s).lower()).strip()
          def center(r): return r.get('center') or r.get('institution') or ''
          def sig(r): return (norm(r.get('title','')),norm(center(r)))
          effective={r.get('id'):r for r in base if r.get('id')}
          for r in upserts:
            if r.get('id'): effective[r['id']]={**effective.get(r['id'],{}),**r}
          ids=set(effective); sigs={sig(r) for r in effective.values() if r.get('title')}
          added=[]
          for r in incoming.get('upserts',[]):
            if r.get('id') in ids or sig(r) in sigs: continue
            # normalize schema used by Finder
            if 'institution' in r and 'center' not in r: r['center']=r.pop('institution')
            if isinstance(r.get('species'),list) and len(r['species'])==1: r['species']=r['species'][0]
            if 'cancer_types' in r and 'cancers' not in r: r['cancers']=r.pop('cancer_types')
            upserts.append(r); effective[r['id']]=r; ids.add(r['id']); sigs.add(sig(r)); added.append(r['id'])
          p.write_text(json.dumps(upd,indent=2,ensure_ascii=False)+'\n')
          matching=[r for r in effective.values() if r.get('available_for_matching') is True and r.get('study_type')=='treatment']
          def species_values(v): return v if isinstance(v,list) else [v]
          from collections import Counter
          countries=Counter(r.get('country','Unknown') for r in matching)
          species=Counter(s for r in matching for s in species_values(r.get('species','Unknown')))
          stats={'generated':'2026-09-05','effective_total_records':len(effective),'current_treatment_opportunities':len(matching),'by_country':dict(sorted(countries.items())),'by_species':dict(sorted(species.items())),'added_from_source_expansion':added}
          Path('data/catalog_stats.json').write_text(json.dumps(stats,indent=2,ensure_ascii=False)+'\n')
          print(json.dumps(stats,indent=2))
          PY
      - name: Validate
        run: python -m json.tool data/trial_updates.json >/dev/null && python -m json.tool data/catalog_stats.json >/dev/null
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add data/trial_updates.json data/catalog_stats.json
          git diff --cached --quiet && exit 0
          git commit -m 'Merge expanded treatment opportunities'
          git push
