name: Deploy cancer pages info first 2026-09-09

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Put cancer information before availability
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          root=Path('seo/site')
          pages=[]
          for region in ('north-america','uk-europe'):
            for species in ('dogs','cats'):
              pages += list((root/region/species).glob('*/index.html'))

          assert len(pages) >= 88, len(pages)
          changed=0
          disease_re=re.compile(r'<section class="disease">.*?</section>', re.S)
          summary_marker='<div class="cancer-summary">'

          for p in pages:
            s=p.read_text(encoding='utf-8', errors='replace')
            m=disease_re.search(s)
            b=s.find(summary_marker)
            assert m and b >= 0, (p, bool(m), b)
            if m.start() > b:
              block=m.group(0)
              s=s[:m.start()] + s[m.end():]
              b=s.find(summary_marker)
              s=s[:b] + block + s[b:]
              p.write_text(s, encoding='utf-8')
              changed += 1

          for p in pages:
            s=p.read_text(encoding='utf-8', errors='replace')
            a=s.find('<section class="disease">')
            b=s.find(summary_marker)
            assert a >= 0 and b >= 0 and a < b, (p,a,b)
            assert 'How it is usually treated' in s,p
            assert 'What can affect treatment choices' in s,p

          print('INFO_FIRST_OK',len(pages),'CHANGED',changed)
          PY
      - name: Add private Umami analytics
        run: |
          python - <<'PY'
          from pathlib import Path

          site = Path('seo/site')
          tracker = '<script defer src="https://cloud.umami.is/script.js" data-website-id="20597fc4-68b1-4552-94c8-0771d1d74673"></script>'
          pages = list(site.rglob('*.html'))
          assert pages, 'No static HTML pages found'

          for page in pages:
              html = page.read_text(encoding='utf-8')
              if tracker not in html:
                  assert '</head>' in html, page
                  page.write_text(html.replace('</head>', tracker + '</head>', 1), encoding='utf-8')

          assert all(page.read_text(encoding='utf-8').count(tracker) == 1 for page in pages)
          print('PRIVATE_ANALYTICS_OK', len(pages))
          PY
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: seo/site
  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
