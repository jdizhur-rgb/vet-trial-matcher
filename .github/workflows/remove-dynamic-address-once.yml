name: Remove dynamic address lookup once
on:
  push:
    paths: ['.github/workflows/remove-dynamic-address-once.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('app.py'); s=p.read_text()
          a=s.index('            try:\n                from seo.center_directory import addresses_for as _addresses_for')
          b=s.index('            return\n',a)
          s=s[:a]+s[b:]
          p.write_text(s)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.py && git commit -m 'Remove runtime center address lookup' && git push origin main
