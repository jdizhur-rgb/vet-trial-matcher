name: Add Aurelius T-cell therapy
on:
  push:
    paths:
      - '.github/workflows/add-aurelius-other-option-20260906.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add verified Aurelius ACT option and validate
        run: |
          echo '' | base64 -d | python
          python -m py_compile pages/2_Additional_Oncology_Options.py
          grep -q 'bcell-lymphoma-aurelius-act' pages/2_Additional_Oncology_Options.py
      - name: Commit option
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add pages/2_Additional_Oncology_Options.py
          git diff --cached --quiet || git commit -m 'Add Aurelius adoptive T-cell therapy to Other Options'
          git push
