name: Check copied evidence keys
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test evidence redaction
        run: python scripts/test_evidence_keys.py
      - name: Reject copied Google API keys
        run: python scripts/check_evidence_keys.py
