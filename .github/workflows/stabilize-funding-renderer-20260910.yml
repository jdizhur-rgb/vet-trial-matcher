name: Stabilize funding renderer
on:
  push:
    branches: [main]
    paths: ['.github/workflows/stabilize-funding-renderer-20260910.yml']
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install stable funding renderer in Finder page
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('pages/1_Clinical_Trial_Finder.py')
          s = p.read_text(encoding='utf-8')

          bad = '''                    _funding = tr.get('funding', 'Ask the study team about covered study costs')
          _funding_low = _funding.lower()
          if any(x in _funding_low for x in ('fully funded', 'no cost to the owner', 'at no cost', 'all treatments and procedures')):
              st.success('**Trial funding:** ' + _funding)
          elif any(x in _funding_low for x in ('partially funded', 'partial funding', 'partially covered', 'some study costs', 'some costs')):
              st.warning('**Trial funding:** ' + _funding)
          else:
              st.write('**Trial funding:** ' + _funding)
'''
          plain = "                    st.write('**Trial funding:** ' + tr.get('funding', 'Ask the study team about covered study costs'))\n"
          call = "                    _render_funding(tr)\n"

          helper = '''\ndef _render_funding(tr):
    """Render study funding consistently; keep this UI rule independent of catalog updates."""
    funding = str(tr.get('funding', 'Ask the study team about covered study costs'))
    low = funding.lower()
    fully_funded_terms = (
        'fully funded', 'no cost to the owner', 'at no cost',
        'all treatments and procedures', 'all study-related costs are covered',
        'study-related costs are covered'
    )
    partial_terms = (
        'partially funded', 'partial funding', 'partially covered',
        'some study costs', 'some costs are covered', 'some costs covered'
    )
    if any(term in low for term in fully_funded_terms):
        st.success('**Trial funding:** ' + funding)
    elif any(term in low for term in partial_terms):
        st.warning('**Trial funding:** ' + funding)
    else:
        st.write('**Trial funding:** ' + funding)
\n'''

          # Repair the failed earlier patch or replace the old plain renderer.
          if bad in s:
              s = s.replace(bad, call, 1)
          elif plain in s:
              s = s.replace(plain, call, 1)
          elif call not in s:
              raise SystemExit('Funding render site not found')

          if 'def _render_funding(tr):' not in s:
              marker = "search_clicked = st.button('Find potential trials', type='primary', use_container_width=True)\n"
              if marker not in s:
                  raise SystemExit('Stable helper insertion point not found')
              s = s.replace(marker, helper + '\n' + marker, 1)

          p.write_text(s, encoding='utf-8')
          PY
      - name: Compile-check Streamlit Python files
        run: |
          python -m py_compile app.py pages/1_Clinical_Trial_Finder.py pages/2_Additional_Oncology_Options.py
      - name: Verify stable funding hook
        run: |
          grep -q "def _render_funding(tr):" pages/1_Clinical_Trial_Finder.py
          grep -q "_render_funding(tr)" pages/1_Clinical_Trial_Finder.py
      - name: Commit fixed page
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pages/1_Clinical_Trial_Finder.py
          git diff --cached --quiet || git commit -m "Stabilize funding badges in Finder page"
          git push
