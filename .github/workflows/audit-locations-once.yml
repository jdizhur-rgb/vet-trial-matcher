name: Audit trial location coverage once
on:
  push:
    branches: [streamlit-prod]
    paths: ['.github/workflows/audit-locations-once.yml']
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: streamlit-prod
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Audit effective active trial locations
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from seo.center_directory import addresses_for
          root=Path('.')
          base=json.loads((root/'data/trials_base.json').read_text())
          by_id={t['id']:t for t in base}
          for p in [root/'data/trial_updates.json']+sorted((root/'data').glob('catalog_patch_*.json')):
              d=json.loads(p.read_text())
              for tid in d.get('delete',[]): by_id.pop(tid,None)
              for x in d.get('upsert',[]):
                  tid=x['id']
                  if tid in by_id:
                      m=dict(by_id[tid])
                      for k,v in x.items():
                          if k in {'requires','excludes'} and isinstance(v,dict):
                              n=dict(m.get(k,{})); n.update(v); m[k]=n
                          else: m[k]=v
                      by_id[tid]=m
                  else: by_id[tid]=x
          active=[]; missing=[]
          for t in by_id.values():
              if not t.get('available_for_matching',True): continue
              if t.get('status_confidence') not in {'current','confirmed_current'}: continue
              if t.get('study_type','treatment') not in {'treatment','other_treatment_access'}: continue
              sites=t.get('sites') or []
              addrs=addresses_for(t.get('center',''))
              active.append((t['id'],t.get('center'),len(sites),len(addrs)))
              if not sites and not addrs:
                  missing.append((t['id'],t.get('center'),t.get('state'),t.get('country'),t.get('url')))
          print('ACTIVE_COUNT',len(active))
          print('MISSING_LOCATION_COUNT',len(missing))
          for row in missing: print('MISSING',row)
          PY