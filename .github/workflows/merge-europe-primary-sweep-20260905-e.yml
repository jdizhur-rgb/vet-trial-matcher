name: Merge Europe primary sweep E and repair stats
on:
  push:
    paths:
      - 'data/europe_primary_sweep_20260905_e.json'
      - '.github/workflows/merge-europe-primary-sweep-20260905-e.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Merge patch and recalculate effective stats
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from collections import Counter
          base=json.loads(Path('data/trials_base.json').read_text())
          upd=json.loads(Path('data/trial_updates.json').read_text())
          patch=json.loads(Path('data/europe_primary_sweep_20260905_e.json').read_text())
          if isinstance(upd,list): upd={'upsert':upd,'delete':[]}
          ups=upd.setdefault('upsert',[])
          byid={r.get('id'):i for i,r in enumerate(ups) if isinstance(r,dict) and r.get('id')}
          for r in patch.get('upsert',[]):
              rid=r['id']
              if rid in byid: ups[byid[rid]].update(r)
              else: byid[rid]=len(ups); ups.append(r)
          Path('data/trial_updates.json').write_text(json.dumps(upd,indent=2,ensure_ascii=False)+'\n')
          rows={r.get('id'):dict(r) for r in base if isinstance(r,dict) and r.get('id')}
          for rid in upd.get('delete',[]): rows.pop(rid,None)
          for r in ups:
              if not isinstance(r,dict) or not r.get('id'): continue
              rid=r['id']
              if rid in rows: rows[rid].update(r)
              else: rows[rid]=dict(r)
          closed={'closed','completed','not recruiting','on hold','suspended','terminated'}
          current=[r for r in rows.values() if r.get('study_type')=='treatment' and r.get('available_for_matching') is True and str(r.get('status','')).strip().lower() not in closed]
          def vals(v):
              if isinstance(v,list): return [str(x) for x in v]
              return [str(v)] if v not in (None,'') else []
          cc=Counter(x for r in current for x in vals(r.get('country')))
          ss=Counter(x for r in current for x in vals(r.get('species')))
          stats={
            'generated':'2026-09-05',
            'effective_total_records':len(rows),
            'current_treatment_opportunities':len(current),
            'by_country':dict(sorted(cc.items())),
            'by_species':dict(sorted(ss.items())),
            'audit_note':'Effective stats rebuilt using base + partial upsert merge + deletes; SLU OXC-101 excluded pending recruitment confirmation; Liverpool DOG-FIGhT added.'
          }
          Path('data/catalog_stats.json').write_text(json.dumps(stats,indent=2,ensure_ascii=False)+'\n')
          print(json.dumps(stats,indent=2))
          PY
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add data/trial_updates.json data/catalog_stats.json
          git diff --cached --quiet || git commit -m 'Merge Liverpool DOG-FIGhT and repair effective catalog stats'
          git push
