name: Full live catalog duplicate audit
on:
  push:
    paths:
      - '.github/workflows/full-live-dedup-audit-20260907.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Audit exact live catalog
        run: |
          python - <<'PY'
          import json,re
          from pathlib import Path
          from difflib import SequenceMatcher
          from itertools import combinations
          from collections import defaultdict
          D=Path('data')
          base=json.loads((D/'trials_base.json').read_text())
          upd=json.loads((D/'trial_updates.json').read_text())
          by={r['id']:dict(r) for r in base}
          for x in upd.get('delete',[]): by.pop(x,None)
          for p in upd.get('upsert',[]): by[p['id']]={**by.get(p['id'],{}),**p}
          rows=list(by.values())
          def norm(x):
            if isinstance(x,list): x=' '.join(map(str,x))
            x=str(x or '').lower().replace('—',' ').replace('–',' ')
            x=re.sub(r'https?://(www\.)?','',x).rstrip('/')
            x=re.sub(r'[^a-z0-9]+',' ',x)
            return ' '.join(x.split())
          def cancers(r): return set(norm(r.get('cancers',[])).split())
          def score(a,b):
            ta,tb=norm(a.get('title')),norm(b.get('title'))
            ca,cb=norm(a.get('center')),norm(b.get('center'))
            ua,ub=norm(a.get('url')),norm(b.get('url'))
            title=SequenceMatcher(None,ta,tb).ratio()
            center=SequenceMatcher(None,ca,cb).ratio()
            cs=cancers(a); ds=cancers(b); cancer=len(cs&ds)/max(1,len(cs|ds))
            sameurl=bool(ua and ub and ua==ub)
            return title,center,cancer,sameurl
          candidates=[]
          for a,b in combinations(rows,2):
            if a.get('species')!=b.get('species'): continue
            title,center,cancer,sameurl=score(a,b)
            reasons=[]
            if title>=.82 and center>=.55 and cancer>=.25: reasons.append('strong title/center/cancer similarity')
            if title>=.70 and center>=.85 and cancer>=.25: reasons.append('same-center semantic similarity')
            if sameurl and title>=.55 and cancer>=.25: reasons.append('same URL plus semantic similarity')
            if reasons:
              candidates.append({'id_a':a['id'],'id_b':b['id'],'title_a':a.get('title'),'title_b':b.get('title'),'center_a':a.get('center'),'center_b':b.get('center'),'url_a':a.get('url'),'url_b':b.get('url'),'title_similarity':round(title,3),'center_similarity':round(center,3),'cancer_similarity':round(cancer,3),'same_url':sameurl,'reasons':reasons})
          exact=defaultdict(list)
          for r in rows:
            key=(norm(r.get('species')),norm(r.get('center')),norm(r.get('title')),norm(r.get('cancers')))
            exact[key].append(r['id'])
          exact_groups=[v for v in exact.values() if len(v)>1]
          report={'generated':'2026-09-07','loader_verified':'pages/1_Clinical_Trial_Finder.py currently loads trials_base.json then trial_updates.json only','effective_total':len(rows),'exact_duplicate_groups':exact_groups,'semantic_candidates_count':len(candidates),'semantic_candidates':candidates,'rule':'Candidate generation only. Same URL alone never deletes a record. Every candidate requires protocol-level review before cleanup.'}
          (D/'duplicate_audit_20260907_full_live.json').write_text(json.dumps(report,indent=2,ensure_ascii=False)+'\n')
          print('effective_total',len(rows),'exact_groups',len(exact_groups),'semantic_candidates',len(candidates))
          PY
      - name: Commit audit
        run: |
          python -m json.tool data/duplicate_audit_20260907_full_live.json >/dev/null
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add data/duplicate_audit_20260907_full_live.json
          git commit -m 'Audit full live catalog for duplicate protocols'
          git push
