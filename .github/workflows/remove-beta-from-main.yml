name: Remove beta from deployed main
on:
  push:
    paths:
      - 'scripts/remove_beta_from_main_20260906.py'
      - '.github/workflows/remove-beta-from-main.yml'
  workflow_dispatch:
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/remove_beta_from_main_20260906.py
      - run: python -m py_compile app.py pages/1_Clinical_Trial_Finder.py
      - name: Verify beta copy is gone
        run: '! grep -RniE "Beta prototype|Beta: trial|improve this beta|Trial Finder — Beta" app.py pages/1_Clinical_Trial_Finder.py'
      - name: Commit fix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add pages/1_Clinical_Trial_Finder.py
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Remove remaining beta copy from deployed main"
          git push origin HEAD:main
