name: Fix visible trial locations once
on:
  push:
    branches: [streamlit-prod]
    paths: ['.github/workflows/fix-visible-locations-once.yml']
permissions:
  contents: write
jobs:
  fix-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: streamlit-prod
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore direct metadata rendering and BARC address
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('app.py')
          s=p.read_text()
          old='    if isinstance(body,str) and body.startswith("**Contact:**"):return _orig["write"](body,*a,**k)\n    if isinstance(body,str) and body.startswith("**Participating sites:**"):return _orig["write"](body,*a,**k)\n'
          new='    if isinstance(body,str) and body.startswith("**Contact:**"):\n        contact=body.replace("**Contact:**","",1).strip();linked=_linkify_contact(contact)\n        if linked:_orig["markdown"]("**Contact:** "+linked)\n        return\n    if isinstance(body,str) and body.startswith("**Participating sites:**"):return _orig["markdown"](body)\n'
          if old not in s: raise SystemExit('expected renderer block not found')
          s=s.replace(old,new,1)
          p.write_text(s)
          compile(s,'app.py','exec')

          d=Path('seo/center_directory.py')
          t=d.read_text()
          line='    "Bridge Animal Referral Center (BARC)": "Bridge Animal Referral Center, 8401 Main St, Edmonds, WA 98026",\n'
          if line not in t:
              anchor='    "Aurelius Biotherapeutics": "Aurelius Biotherapeutics, 720 Virginia St, Bellingham, WA 98225",\n'
              if anchor not in t: raise SystemExit('BARC insertion anchor not found')
              t=t.replace(anchor,anchor+line,1)
          d.write_text(t)
          compile(t,'seo/center_directory.py','exec')
          PY
      - run: pip install -r requirements.txt
      - name: Verify actual result output
        run: |
          python - <<'PY'
          from streamlit.testing.v1 import AppTest
          at=AppTest.from_file('app.py', default_timeout=30).run()
          def sb(label): return next(x for x in at.selectbox if x.label==label)
          sb('Country / region').select('USA'); sb('Cancer type').select('Oral melanoma'); at.run()
          next(b for b in at.button if b.label=='Find potential trials').click(); at.run()
          vals=[str(getattr(e,'value','')) for kind in ('markdown','text','caption') for e in getattr(at,kind)]
          joined='\n'.join(vals)
          required=[
            'Ethos Veterinary Health',
            'Metropolitan Veterinary Hospital — Cleveland, OH',
            'Summit Veterinary Referral Center — Tacoma, WA',
            'Veterinary Specialty Hospital — San Diego, CA',
            'Bridge Animal Referral Center, 8401 Main St, Edmonds, WA 98026'
          ]
          missing=[x for x in required if x not in joined]
          if at.exception: raise SystemExit('Streamlit exceptions: '+repr(at.exception))
          if missing: raise SystemExit('Missing visible location fields: '+repr(missing))
          print('VISIBLE_LOCATION_TEST_OK')
          PY
      - name: Commit tested fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.py seo/center_directory.py
          git commit -m 'Restore visible trial locations in result cards'
          git push origin HEAD:streamlit-prod
