name: Fix global eligibility patch loading
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-global-eligibility-20260907.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python - <<'PY'
          from pathlib import Path
          import json
          p=Path('pages/1_Clinical_Trial_Finder.py'); s=p.read_text()
          old='''    _updates_path = _root / "data" / "trial_updates.json"\n    if _updates_path.exists():\n        with _updates_path.open(encoding="utf-8") as _fh:\n            _doc = _json.load(_fh)\n        for _trial_id in _doc.get("delete", []):\n            _by_id.pop(_trial_id, None)\n        for _patch in _doc.get("upsert", []):\n            _trial_id = _patch["id"]\n            if _trial_id in _by_id:\n                _by_id[_trial_id].update(_patch)\n            else:\n                _by_id[_trial_id] = _patch\n    return list(_by_id.values())'''
          new='''    _patch_paths = [_root / "data" / "trial_updates.json"]\n    _patch_paths += sorted((_root / "data").glob("catalog_patch_*.json"))\n    for _updates_path in _patch_paths:\n        if not _updates_path.exists(): continue\n        with _updates_path.open(encoding="utf-8") as _fh: _doc = _json.load(_fh)\n        for _trial_id in _doc.get("delete", []): _by_id.pop(_trial_id, None)\n        for _patch in _doc.get("upsert", []):\n            _trial_id = _patch["id"]\n            if _trial_id in _by_id:\n                _merged = dict(_by_id[_trial_id])\n                for _key, _value in _patch.items():\n                    if _key in {"requires", "excludes"} and isinstance(_value, dict):\n                        _nested = dict(_merged.get(_key, {})); _nested.update(_value); _merged[_key] = _nested\n                    else: _merged[_key] = _value\n                _by_id[_trial_id] = _merged\n            else: _by_id[_trial_id] = _patch\n    return list(_by_id.values())'''
          if old not in s: raise SystemExit('loader block not found')
          p.write_text(s.replace(old,new))
          q=Path('data/catalog_patch_hs_matching_20260907.json'); d=json.loads(q.read_text()); r=d['upsert'][0]
          r['requires']={'confirmed':True,'active_treatment_target':True,'measurable':True,'min_weight_kg':15,'max_weight_kg':60}
          r['notes']='COTC033 current CSU treatment study. Published eligibility includes confirmed eligible cancer, a 2–8 cm tumor accessible for biopsy, and body weight 15–60 kg (33–132 lb). Structured criteria are applied by the global matcher; any known hard failure excludes the study.'
          q.write_text(json.dumps(d,indent=2,ensure_ascii=False)+'\n')
          PY
          python -m py_compile pages/1_Clinical_Trial_Finder.py app.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add pages/1_Clinical_Trial_Finder.py data/catalog_patch_hs_matching_20260907.json
          git commit -m "Apply eligibility hard fails through global matcher"
          git push
