name: Build closed trial archive

on:
  push:
    paths:
      - 'scripts/build_trial_archive.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build archive and cleanup patch
        run: python scripts/build_trial_archive.py
      - name: Commit archive snapshot
        run: |
          if git diff --quiet -- data/archive/trials_closed.json data/catalog_patch_zzzz_archive_closed.json; then
            echo "Archive already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/archive/trials_closed.json data/catalog_patch_zzzz_archive_closed.json
          git commit -m "Archive completed clinical trials"
          git push
