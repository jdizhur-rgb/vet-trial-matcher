name: Trial catalog validation

on:
  pull_request:
    branches: [main]
    paths:
      - 'data/trials_base.json'
      - 'scripts/validate_trials_catalog.py'
      - '.github/workflows/trial-catalog-validation.yml'
  push:
    branches: [main]
    paths:
      - 'data/trials_base.json'
      - 'scripts/validate_trials_catalog.py'
      - '.github/workflows/trial-catalog-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate canonical trial catalog
        run: python scripts/validate_trials_catalog.py
