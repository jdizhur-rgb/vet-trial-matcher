name: Rollback app.py before counters
on:
  push:
    paths:
      - '.github/workflows/rollback-app-before-counters-20260906.yml'
permissions:
  contents: write
jobs:
  rollback:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore app.py from clean pre-counter commit
        run: |
          git show 2eb9686e9d1795ac0ffb8458edea5d3f52ff2b37:app.py > app.py
          rm -f .github/workflows/rollback-app-before-counters-20260906.yml
          python -m py_compile app.py
      - name: Commit rollback
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.py .github/workflows/rollback-app-before-counters-20260906.yml
          git commit -m 'Restore app.py from pre-counter version'
          git push