name: Full catalog integrity audit
on:
  schedule:
    - cron: '17 10 * * 6'
  push:
    paths:
      - 'data/**'
      - 'scripts/full_catalog_audit.py'
      - 'scripts/validate_source_inventory.py'
      - '.github/workflows/full-catalog-audit.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run full catalog audit
        run: |
          python scripts/audit_preflight.py
          python scripts/validate_catalog_sanitation.py
          python scripts/full_catalog_audit.py
