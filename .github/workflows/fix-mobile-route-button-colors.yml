name: Fix mobile route button colors
on:
  push:
    paths: ['.github/workflows/fix-mobile-route-button-colors.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/fix_mobile_route_button_colors_20260906.py
      - run: python -m py_compile pages/2_Additional_Oncology_Options.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pages/2_Additional_Oncology_Options.py
          git commit -m "Fix treatment route colors on mobile" && git push || true
