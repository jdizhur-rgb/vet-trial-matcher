name: Build and deploy SEO site

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'data/trials_base.json'
      - 'data/trial_updates.json'
      - 'seo/generate_seo.py'
      - 'seo/generate_seo_strict.py'
      - 'seo/static/**'
      - '.github/workflows/build-seo.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate SEO pages with strict diagnosis mapping
        run: python seo/generate_seo_strict.py
      - name: Include static files
        run: cp -a seo/static/. seo/site/
      - name: Validate every generated diagnosis page
        run: |
          python - <<'PY'
          from pathlib import Path
          import json,re,sys,html
          import xml.etree.ElementTree as ET
          sys.path.insert(0,'seo')
          import generate_seo_strict as strict
          root=ET.parse('seo/site/sitemap.xml').getroot(); ns={'s':'http://www.sitemaps.org/schemas/sitemap/0.9'}
          locs=[x.text for x in root.findall('s:url/s:loc',ns)]
          assert locs and len(locs)==len(set(locs))
          pages=list(Path('seo/site').rglob('index.html'))
          assert len(pages)>=40, f'too few pages: {len(pages)}'
          audit=json.loads(Path('seo/site/mapping-audit.json').read_text())
          cells=audit['cells']
          assert audit['matrix_cells']==len(cells) and audit['assignments']>0
          by_id={r['id']:r for r in strict.g.load_effective()}
          forbidden=('active_treatment_target:', 'chemo_washout_days:', 'radiation_washout_days:', "{'", "': True")
          def titles(s): return [html.unescape(x) for x in re.findall(r'<article class="card"><h3>(.*?)</h3>',s,re.S)]
          # Systemic identity check for every North America + UK/Europe matrix cell.
          for rel, ids in cells.items():
            p=Path('seo/site')/rel/'index.html'
            assert p.exists(), (rel,p)
            actual=titles(p.read_text(errors='replace'))
            expected=[by_id[i].get('title','') for i in ids]
            assert sorted(actual)==sorted(expected), (rel,actual,expected)
          for p in pages:
            s=p.read_text(errors='replace')
            assert 'Cancer Trial Finder For Dogs And Cats' in s, p
            assert 'class="wrap"' in s, p
            assert not any(x in s for x in forbidden), f'raw internal field on {p}'
            if p not in (Path('seo/site/index.html'), Path('seo/site/centers/index.html')): assert 'class="card"' in s, p
          hs=Path('seo/site/north-america/dogs/histiocytic-sarcoma/index.html').read_text()
          markers=('100% FREE','No registration. No hidden results. No paid report.','About Histiocytic Sarcoma','Standard treatment','lomustine (CCNU)','Treatment &amp; research')
          for marker in markers: assert marker in hs, marker
          assert hs.count('class="free"')==1
          print(f"VALID_ALL pages={len(pages)} matrix_cells={len(cells)} assignments={audit['assignments']}")
          PY
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: seo/site
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
  verify:
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Rebuild strict matrix for live verification
        run: python seo/generate_seo_strict.py
      - name: Verify every live diagnosis page in North America and Europe
        run: |
          python - <<'PY'
          from pathlib import Path
          import html,re,time,urllib.request
          base='https://jdizhur-rgb.github.io/vet-trial-matcher/'
          local_pages=sorted(Path('seo/site').glob('*/*/*/index.html'))
          paths=['']+[str(p.parent.relative_to('seo/site')).replace('\\','/')+'/' for p in local_pages]
          forbidden=('active_treatment_target:', 'chemo_washout_days:', 'radiation_washout_days:', "{'", "': True")
          def titles(s): return [html.unescape(x) for x in re.findall(r'<article class="card"><h3>(.*?)</h3>',s,re.S)]
          for path in paths:
            expected=(Path('seo/site')/path/'index.html').read_text() if path else Path('seo/site/index.html').read_text()
            expected_titles=titles(expected)
            text=''
            for i in range(12):
              try:
                req=urllib.request.Request(base+path+'?verify='+str(time.time()),headers={'Cache-Control':'no-cache'})
                text=urllib.request.urlopen(req,timeout=20).read().decode('utf-8','replace')
              except Exception: text=''
              if 'Cancer Trial Finder For Dogs And Cats' in text and not any(x in text for x in forbidden) and titles(text)==expected_titles:
                break
              time.sleep(10)
            assert 'Cancer Trial Finder For Dogs And Cats' in text, path
            assert not any(x in text for x in forbidden), path
            assert titles(text)==expected_titles, (path,titles(text),expected_titles)
            print('LIVE_OK',path or '/',len(expected_titles),'cards')
          PY
