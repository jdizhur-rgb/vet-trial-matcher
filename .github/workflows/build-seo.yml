name: Build and deploy SEO site

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'data/trials_base.json'
      - 'data/trial_updates.json'
      - 'seo/generate_seo.py'
      - 'seo/postprocess_design.py'
      - 'seo/static/**'
      - '.github/workflows/build-seo.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate SEO pages
        run: python seo/generate_seo.py
      - name: Polish SEO page design
        run: python seo/postprocess_design.py
      - name: Include static files
        run: cp -a seo/static/. seo/site/
      - name: Validate generated sitemap and every SEO page UI
        run: |
          python - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          base='https://jdizhur-rgb.github.io/vet-trial-matcher/'
          site=Path('seo/site')
          root=ET.parse(site/'sitemap.xml').getroot()
          ns={'sm':'http://www.sitemaps.org/schemas/sitemap/0.9'}
          locs=[x.text for x in root.findall('sm:url/sm:loc',ns)]
          assert locs and len(locs)==len(set(locs))
          assert all(x.startswith(base) for x in locs)
          for url in locs:
              rel=url[len(base):].strip('/')
              page=site/'index.html' if not rel else site/rel/'index.html'
              assert page.exists(), url
              html=page.read_text()
              assert '100% FREE' in html, url
              assert 'Free means free. No hidden results. No paid report.' in html, url
              assert 'background:#287fb8' in html, url
              assert 'class="cta"' in html, url
              assert 'font-size:2rem' in html, url
              if rel:
                  assert '← Cancer Trial Finder</a>' in html, url
                  assert 'Find cancer treatment options and clinical trials for dogs and cats.' in html, url
                  assert '<section class="cancer-info">' in html, url
                  assert '<h2>About ' in html, url
                  assert '<h2>Treatment &amp; research</h2>' in html, url
              if '<article>' in html:
                  assert html.index('class="cta"') < html.index('<article>'), url
          print(f'GENERATED_ALL_PAGES_CURRENT pages={len(locs)}')
          PY
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload SEO site
        uses: actions/upload-pages-artifact@v4
        with:
          path: seo/site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  verify:
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - name: Verify every live SEO page matches current UI
        run: |
          python - <<'PY'
          import time, urllib.request, xml.etree.ElementTree as ET
          base='https://jdizhur-rgb.github.io/vet-trial-matcher/'
          sha='${{ github.sha }}'
          def get(url):
              req=urllib.request.Request(url,headers={'Cache-Control':'no-cache','User-Agent':'vet-trial-matcher-deploy-check'})
              with urllib.request.urlopen(req,timeout=30) as r: return r.read().decode('utf-8')
          root=ET.fromstring(get(base+'sitemap.xml?deploy='+sha))
          ns={'sm':'http://www.sitemaps.org/schemas/sitemap/0.9'}
          locs=[x.text for x in root.findall('sm:url/sm:loc',ns)]
          assert locs
          pending=list(locs); last_errors={}
          for attempt in range(10):
              still=[]
              for url in pending:
                  try:
                      sep='&' if '?' in url else '?'
                      html=get(f'{url}{sep}deploy={sha}&attempt={attempt}')
                      assert '100% FREE' in html
                      assert 'Free means free. No hidden results. No paid report.' in html
                      assert 'background:#287fb8' in html
                      assert 'class="cta"' in html
                      assert 'font-size:2rem' in html
                      if url != base:
                          assert '← Cancer Trial Finder</a>' in html
                          assert 'Find cancer treatment options and clinical trials for dogs and cats.' in html
                          assert '<section class="cancer-info">' in html
                          assert '<h2>About ' in html
                          assert '<h2>Treatment &amp; research</h2>' in html
                      if '<article>' in html: assert html.index('class="cta"') < html.index('<article>')
                  except Exception as e:
                      still.append(url); last_errors[url]=str(e)
                  time.sleep(.03)
              pending=still
              print(f'attempt={attempt+1} current={len(locs)-len(pending)}/{len(locs)} pending={len(pending)}')
              if not pending: break
              time.sleep(15)
          if pending:
              for url in pending: print(url,last_errors.get(url,''))
              raise SystemExit(f'{len(pending)} live SEO pages are not current')
          print(f'LIVE_ALL_PAGES_CURRENT pages={len(locs)}')
          PY
