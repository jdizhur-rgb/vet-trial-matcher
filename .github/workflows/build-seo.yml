name: Build and deploy SEO site

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'data/trials_base.json'
      - 'data/trial_updates.json'
      - 'seo/generate_seo.py'
      - 'seo/static/**'
      - '.github/workflows/build-seo.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate SEO pages
        run: python seo/generate_seo.py
      - name: Include static files
        run: cp -a seo/static/. seo/site/
      - name: Validate generated sitemap
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          p='seo/site/sitemap.xml'
          root=ET.parse(p).getroot()
          ns={'sm':'http://www.sitemaps.org/schemas/sitemap/0.9'}
          urls=root.findall('sm:url',ns)
          locs=[u.find('sm:loc',ns).text for u in urls]
          assert len(locs)==len(set(locs)), 'duplicate sitemap URLs'
          assert all(x.startswith('https://jdizhur-rgb.github.io/vet-trial-matcher/') for x in locs)
          print(f'VALID_SITEMAP urls={len(locs)} bytes={__import__("os").path.getsize(p)}')
          PY
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload SEO site
        uses: actions/upload-pages-artifact@v4
        with:
          path: seo/site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  verify:
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - name: Verify live sitemap over HTTP
        run: |
          URL='https://jdizhur-rgb.github.io/vet-trial-matcher/sitemap.xml'
          echo "Checking $URL"
          for i in 1 2 3 4 5 6; do
            code=$(curl -L -sS -o /tmp/sitemap.xml -D /tmp/headers.txt -w '%{http_code}' "$URL" || true)
            echo "attempt=$i status=$code"
            cat /tmp/headers.txt || true
            if [ "$code" = "200" ]; then break; fi
            sleep 10
          done
          test "$code" = "200"
          python - <<'PY'
          import os, xml.etree.ElementTree as ET
          p='/tmp/sitemap.xml'
          root=ET.parse(p).getroot()
          ns={'sm':'http://www.sitemaps.org/schemas/sitemap/0.9'}
          locs=[x.text for x in root.findall('sm:url/sm:loc',ns)]
          print(f'LIVE_SITEMAP_OK urls={len(locs)} bytes={os.path.getsize(p)} root={root.tag}')
          assert locs
          PY
