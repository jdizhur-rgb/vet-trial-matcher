name: Build and deploy SEO site

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'data/trials_base.json'
      - 'data/trial_updates.json'
      - 'data/catalog_patch_*.json'
      - 'seo/generate_seo.py'
      - 'seo/generate_seo_strict.py'
      - 'seo/sitecustomize.py'
      - 'seo/center_profiles.py'
      - 'seo/center_profiles_extra.py'
      - 'seo/static/**'
      - '.github/workflows/build-seo.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate all SEO pages
        run: python seo/generate_seo_strict.py
      - name: Include static files
        run: cp -a seo/static/. seo/site/
      - name: Validate rebuilt diagnosis and center pages
        run: |
          python - <<'PY'
          from pathlib import Path
          import json,re,sys,html
          import xml.etree.ElementTree as ET
          sys.path.insert(0,'seo')
          import generate_seo_strict as strict
          root=ET.parse('seo/site/sitemap.xml').getroot(); ns={'s':'http://www.sitemaps.org/schemas/sitemap/0.9'}
          locs=[x.text for x in root.findall('s:url/s:loc',ns)]; assert locs and len(locs)==len(set(locs))
          pages=list(Path('seo/site').rglob('index.html')); assert len(pages)>=40
          audit=json.loads(Path('seo/site/mapping-audit.json').read_text()); cells=audit['cells']; by_id={r['id']:r for r in strict.g.load_effective()}
          forbidden=('active_treatment_target:', 'chemo_washout_days:', 'radiation_washout_days:', "{'", "': True")
          def titles(s): return [html.unescape(x) for x in re.findall(r'<article class="card"><h3>(.*?)</h3>',s,re.S)]
          for rel,ids in cells.items():
            p=Path('seo/site')/rel/'index.html'; assert p.exists(); assert sorted(titles(p.read_text(errors='replace')))==sorted(by_id[i].get('title','') for i in ids),rel
          for p in pages:
            s=p.read_text(errors='replace'); assert 'Cancer Trial Finder For Dogs And Cats' in s; assert 'class="wrap"' in s; assert not any(x in s for x in forbidden)
            if p not in (Path('seo/site/index.html'),Path('seo/site/centers/index.html')): assert 'class="card"' in s
          centers=list(Path('seo/site/centers').glob('*/index.html')); assert centers
          for p in centers:
            s=p.read_text(errors='replace'); assert '100% FREE' in s,p
            for section in re.findall(r'<section class="center-locations">.*?</section>',s,re.S): assert section.count('<li>')<=1,(p,'network-wide location rollup survived')
          ethos=next((p for p in centers if 'ethos' in p.parent.name),None)
          if ethos:
            s=ethos.read_text(errors='replace'); assert 'Locations &amp; participating hospitals' not in s; assert 'Participating locations' in s; assert 'What is being offered:' in s
          print(f"VALID_ALL pages={len(pages)} centers={len(centers)}")
          PY
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: seo/site
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
  verify:
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Rebuild pages for live verification
        run: python seo/generate_seo_strict.py
      - name: Verify every live page matches rebuilt structure
        run: |
          python - <<'PY'
          from pathlib import Path
          import html,re,time,urllib.request
          base='https://jdizhur-rgb.github.io/vet-trial-matcher/'
          diagnosis=sorted(Path('seo/site').glob('*/*/*/index.html')); centers=sorted(Path('seo/site/centers').glob('*/index.html')); local=diagnosis+centers
          paths=['']+[str(p.parent.relative_to('seo/site')).replace('\\','/')+'/' for p in local]
          def titles(s): return [html.unescape(x) for x in re.findall(r'<article class="card"><h3>(.*?)</h3>',s,re.S)]
          for path in paths:
            expected=(Path('seo/site')/path/'index.html').read_text() if path else Path('seo/site/index.html').read_text(); text=''
            for i in range(12):
              try:
                req=urllib.request.Request(base+path+'?verify='+str(time.time()),headers={'Cache-Control':'no-cache','User-Agent':'Mozilla/5.0'})
                with urllib.request.urlopen(req,timeout=20) as r: text=r.read().decode('utf-8','replace')
              except Exception: text=''
              if 'Cancer Trial Finder For Dogs And Cats' in text and titles(text)==titles(expected): break
              time.sleep(10)
            assert 'Cancer Trial Finder For Dogs And Cats' in text,path; assert titles(text)==titles(expected),path
            if path.startswith('centers/') and path!='centers/':
              for section in re.findall(r'<section class="center-locations">.*?</section>',text,re.S): assert section.count('<li>')<=1,(path,'live network rollup')
              if 'ethos' in path: assert 'Locations &amp; participating hospitals' not in text and 'Participating locations' in text and 'What is being offered:' in text,path
            print('LIVE_OK',path or '/',len(titles(text)),'cards')
          print('LIVE_REBUILD_OK',len(local),'content pages')
          PY
