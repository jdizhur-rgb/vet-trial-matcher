name: Build and deploy SEO site

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'data/trials_base.json'
      - 'data/trial_updates.json'
      - 'seo/generate_seo.py'
      - 'seo/static/**'
      - '.github/workflows/build-seo.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate SEO pages
        run: python seo/generate_seo.py
      - name: Include static files
        run: cp -a seo/static/. seo/site/
      - name: Validate generated sitemap and every SEO page UI
        run: |
          python - <<'PY'
          from pathlib import Path
          from urllib.parse import urlparse
          import xml.etree.ElementTree as ET

          base='https://jdizhur-rgb.github.io/vet-trial-matcher/'
          site=Path('seo/site')
          sitemap=site/'sitemap.xml'
          root=ET.parse(sitemap).getroot()
          ns={'sm':'http://www.sitemaps.org/schemas/sitemap/0.9'}
          locs=[x.text for x in root.findall('sm:url/sm:loc',ns)]
          assert locs and len(locs)==len(set(locs)), 'empty/duplicate sitemap URLs'
          assert all(x.startswith(base) for x in locs), 'unexpected sitemap URL'

          checked=0
          for url in locs:
              rel=url[len(base):].strip('/')
              page=site/'index.html' if not rel else site/rel/'index.html'
              assert page.exists(), f'missing generated page: {page}'
              html=page.read_text()
              assert '100% FREE' in html, f'missing FREE banner: {url}'
              assert 'No hidden trial results. No paid report.' in html, f'missing free-access copy: {url}'
              assert 'background:#287fb8' in html, f'missing blue CTA style: {url}'
              assert 'Check your pet against these trials' in html, f'missing matcher CTA: {url}'
              if '<article>' in html:
                  assert html.index('Check your pet against these trials') < html.index('<article>'), f'CTA below trials: {url}'
              checked += 1
          print(f'GENERATED_ALL_PAGES_CURRENT pages={checked}')
          PY
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload SEO site
        uses: actions/upload-pages-artifact@v4
        with:
          path: seo/site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  verify:
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - name: Verify every live SEO page matches current UI
        run: |
          python - <<'PY'
          import time
          import urllib.request
          import xml.etree.ElementTree as ET

          base='https://jdizhur-rgb.github.io/vet-trial-matcher/'
          sha='${{ github.sha }}'

          def get(url):
              req=urllib.request.Request(url, headers={'Cache-Control':'no-cache','User-Agent':'vet-trial-matcher-deploy-check'})
              with urllib.request.urlopen(req, timeout=30) as r:
                  return r.read().decode('utf-8')

          sitemap_url=base+'sitemap.xml?deploy='+sha
          sitemap=get(sitemap_url)
          root=ET.fromstring(sitemap)
          ns={'sm':'http://www.sitemaps.org/schemas/sitemap/0.9'}
          locs=[x.text for x in root.findall('sm:url/sm:loc',ns)]
          assert locs

          pending=list(locs)
          last_errors={}
          for attempt in range(10):
              still=[]
              for i,url in enumerate(pending):
                  try:
                      sep='&' if '?' in url else '?'
                      html=get(f'{url}{sep}deploy={sha}&attempt={attempt}')
                      assert '100% FREE' in html
                      assert 'No hidden trial results. No paid report.' in html
                      assert 'background:#287fb8' in html
                      assert 'Check your pet against these trials' in html
                      if '<article>' in html:
                          assert html.index('Check your pet against these trials') < html.index('<article>')
                  except Exception as e:
                      still.append(url)
                      last_errors[url]=str(e)
                  time.sleep(0.03)
              pending=still
              print(f'attempt={attempt+1} current={len(locs)-len(pending)}/{len(locs)} pending={len(pending)}')
              if not pending:
                  break
              time.sleep(15)
          if pending:
              print('STALE_OR_INVALID_PAGES:')
              for url in pending:
                  print(url, last_errors.get(url,''))
              raise SystemExit(f'{len(pending)} live SEO pages are not current')
          print(f'LIVE_ALL_PAGES_CURRENT pages={len(locs)}')
          PY
