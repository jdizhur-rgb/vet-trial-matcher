name: Build and deploy SEO site

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'data/trials_base.json'
      - 'data/trial_updates.json'
      - 'seo/generate_seo.py'
      - 'seo/static/**'
      - '.github/workflows/build-seo.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate SEO pages
        run: python seo/generate_seo.py
      - name: Include static files
        run: cp -a seo/static/. seo/site/
      - name: Validate complete generated site
        run: |
          python - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          root=ET.parse('seo/site/sitemap.xml').getroot(); ns={'s':'http://www.sitemaps.org/schemas/sitemap/0.9'}
          locs=[x.text for x in root.findall('s:url/s:loc',ns)]
          assert locs and len(locs)==len(set(locs))
          pages=list(Path('seo/site').rglob('index.html'))
          assert len(pages)>=50, f'too few pages: {len(pages)}'
          forbidden=('active_treatment_target:', 'chemo_washout_days:', 'radiation_washout_days:', "{'", "': True")
          for p in pages:
            s=p.read_text(errors='replace')
            assert 'Cancer Trial Finder For Dogs And Cats' in s, p
            assert 'class="wrap"' in s, p
            assert 'class="card"' in s or p==Path('seo/site/index.html'), p
            assert not any(x in s for x in forbidden), f'raw internal field on {p}'
          hs=Path('seo/site/north-america/dogs/histiocytic-sarcoma/index.html').read_text()
          for marker in ('About Histiocytic Sarcoma','Treatment &amp; research','Costs:','Contact:','Official study / enrollment information'):
            assert marker in hs, marker
          print(f'VALID_SITE pages={len(pages)} sitemap={len(locs)}')
          PY
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: seo/site
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
  verify:
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Determine representative generated pages
        run: python seo/generate_seo.py
      - name: Verify representative live pages
        run: |
          python - <<'PY'
          from pathlib import Path
          import time,urllib.request
          base='https://jdizhur-rgb.github.io/vet-trial-matcher/'
          generated=[]
          for prefix in ('north-america/dogs/','north-america/cats/','uk-europe/dogs/','uk-europe/cats/'):
            found=sorted(Path('seo/site',prefix).glob('*/index.html')) if Path('seo/site',prefix).exists() else []
            if found:
              generated.append(str(found[0].parent.relative_to('seo/site')).replace('\\','/')+'/')
          paths=['','north-america/dogs/histiocytic-sarcoma/','north-america/dogs/lymphoma/'] + generated
          paths=list(dict.fromkeys(paths))
          forbidden=('active_treatment_target:', 'chemo_washout_days:', 'radiation_washout_days:', "{'", "': True")
          for path in paths:
            text=''
            for i in range(12):
              try:
                req=urllib.request.Request(base+path+'?verify='+str(time.time()),headers={'Cache-Control':'no-cache'})
                text=urllib.request.urlopen(req,timeout=20).read().decode('utf-8','replace')
              except Exception: text=''
              if 'Cancer Trial Finder For Dogs And Cats' in text and not any(x in text for x in forbidden): break
              time.sleep(10)
            assert 'Cancer Trial Finder For Dogs And Cats' in text, path
            assert not any(x in text for x in forbidden), path
            if path:
              assert 'class="card"' in text, path
            if path=='north-america/dogs/histiocytic-sarcoma/':
              for marker in ('About Histiocytic Sarcoma','Treatment &amp; research','Costs:','Contact:','Official study / enrollment information'):
                assert marker in text, marker
            print('LIVE_OK',path or '/')
          PY
