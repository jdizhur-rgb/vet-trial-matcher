name: Build and deploy SEO site

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'data/trials_base.json'
      - 'data/trial_updates.json'
      - 'data/catalog_patch_*.json'
      - 'seo/generate_seo.py'
      - 'seo/generate_seo_strict.py'
      - 'seo/generate_cancer_coverage.py'
      - 'seo/cancer_page_enhancements.py'
      - 'seo/cancer_owner_content.py'
      - 'seo/address_preflight_report.py'
      - 'seo/center_directory.py'
      - 'seo/center_profiles.py'
      - 'seo/center_profiles_extra.py'
      - 'seo/ensure_center_images.py'
      - 'seo/production_aliases.py'
      - 'seo/site_config.py'
      - 'seo/build_production_site.py'
      - 'seo/static/**'
      - '.github/workflows/build-seo.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate production SEO site
        run: python seo/build_production_site.py
      - name: Include static files
        run: cp -a seo/static/. seo/site/
      - name: Validate generated site
        run: |
          python - <<'PY'
          from pathlib import Path
          import html,re,sys
          sys.path.insert(0,'seo')
          import generate_seo as g
          from site_config import DOMAIN, SITE
          from center_directory import address_is_complete

          assert DOMAIN == 'vettrialfinder.com'
          assert SITE == 'https://vettrialfinder.com'
          pages=list(Path('seo/site').rglob('index.html'))
          centers=list(Path('seo/site/centers').glob('*/index.html'))
          assert len(pages)>=40 and centers
          assert Path('seo/site/cancer-coverage/index.html').exists()
          assert Path('seo/site/CNAME').read_text().strip() == DOMAIN
          sitemap=Path('seo/site/sitemap.xml').read_text(encoding='utf-8')
          robots=Path('seo/site/robots.txt').read_text(encoding='utf-8')
          assert 'jdizhur-rgb.github.io/vet-trial-matcher' not in sitemap
          assert SITE in sitemap
          assert f'Sitemap: {SITE}/sitemap.xml' in robots

          generic=('About this veterinary cancer research center','currently has veterinary cancer treatment or research opportunities represented in our catalog')
          for p in pages:
            s=p.read_text(errors='replace')
            assert 'Cancer Trial Finder For Dogs And Cats' in s,p
            assert 'jdizhur-rgb.github.io/vet-trial-matcher' not in s,p
            for block in re.findall(r'<div class="study-locations">.*?</div>',s,re.S):
              for item in re.findall(r'<li>(.*?)</li>',block,re.S):
                text=html.unescape(re.sub(r'<.*?>','',item)).strip()
                assert address_is_complete(text,''),(p,text)

          for p in centers:
            s=p.read_text(errors='replace')
            assert '<div class="center-page">' in s,p
            assert 'Find cancer treatment options near you' in s,p
            assert ': Veterinary Cancer Clinical Trials</h1>' not in s,p
            assert not any(x in s for x in generic),(p,'generic center description survived')

          expected=[]
          for region in ('north-america','uk-europe'):
            for species in ('dogs','cats'):
              for key in sorted(g.DISEASE_INFO):
                expected.append(Path('seo/site')/region/species/g.slugify(key)/'index.html')
          missing=[str(p) for p in expected if not p.exists()]
          assert not missing, 'missing canonical cancer pages: '+', '.join(missing[:20])
          for p in expected:
            s=p.read_text(errors='replace')
            assert 'How it is usually treated' in s,p
            assert 'What can affect treatment choices' in s,p
            assert '<link rel="canonical"' in s,p
            assert SITE+'/' in s,p
          print('VALID_ALL_CENTERS',len(centers))
          print('VALID_ALL_ENGLISH_CANCER_PAGES',len(expected))
          PY
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: seo/site
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
  verify:
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Rebuild expected site
        run: python seo/build_production_site.py
      - name: Verify live center and cancer pages
        run: |
          python - <<'PY'
          from pathlib import Path
          import html,re,time,urllib.request,sys
          sys.path.insert(0,'seo')
          import generate_seo as g
          from site_config import SITE
          base=SITE+'/'

          def h1(s):
            m=re.search(r'<h1>(.*?)</h1>',s,re.S)
            return html.unescape(re.sub(r'<.*?>','',m.group(1))).strip() if m else ''

          def card_titles(s):
            return [html.unescape(re.sub(r'<.*?>','',x)).strip() for x in re.findall(r'<article class="card"><h3>(.*?)</h3>',s,re.S)]

          local=sorted(Path('seo/site/centers').glob('*/index.html'))
          assert local
          for p in local:
            path=str(p.parent.relative_to('seo/site')).replace('\\','/')+'/'
            expected=p.read_text(errors='replace')
            text=''
            for _ in range(18):
              try:
                req=urllib.request.Request(base+path+'?verify='+str(time.time()),headers={'Cache-Control':'no-cache','User-Agent':'Mozilla/5.0'})
                text=urllib.request.urlopen(req,timeout=20).read().decode('utf-8','replace')
              except Exception:
                text=''
              if h1(text)==h1(expected) and card_titles(text)==card_titles(expected) and '<div class="center-page">' in text:
                break
              time.sleep(10)
            assert h1(text)==h1(expected),(path,h1(text),h1(expected))
            assert card_titles(text)==card_titles(expected),(path,'study cards differ')
            assert '<div class="center-page">' in text,path

          cancer_paths=[]
          for region in ('north-america','uk-europe'):
            for species in ('dogs','cats'):
              for key in sorted(g.DISEASE_INFO):
                cancer_paths.append(f'{region}/{species}/{g.slugify(key)}/')
          for path in cancer_paths:
            expected=Path('seo/site')/path/'index.html'
            exp=expected.read_text(errors='replace')
            text=''
            for _ in range(18):
              try:
                req=urllib.request.Request(base+path+'?verify='+str(time.time()),headers={'Cache-Control':'no-cache','User-Agent':'Mozilla/5.0'})
                text=urllib.request.urlopen(req,timeout=20).read().decode('utf-8','replace')
              except Exception:
                text=''
              if h1(text)==h1(exp) and 'How it is usually treated' in text and 'What can affect treatment choices' in text:
                break
              time.sleep(10)
            assert h1(text)==h1(exp),(path,h1(text),h1(exp))
            assert 'How it is usually treated' in text,path
            assert 'What can affect treatment choices' in text,path
          print('LIVE_ALL_CENTERS_OK',len(local))
          print('LIVE_ALL_ENGLISH_CANCER_PAGES_OK',len(cancer_paths))
          PY
