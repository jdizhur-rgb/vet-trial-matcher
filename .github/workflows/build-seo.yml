name: Build and deploy SEO site

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'data/trials_base.json'
      - 'data/trial_updates.json'
      - 'data/catalog_patch_*.json'
      - 'seo/generate_seo.py'
      - 'seo/generate_seo_strict.py'
      - 'seo/center_directory.py'
      - 'seo/center_profiles.py'
      - 'seo/center_profiles_extra.py'
      - 'seo/ensure_center_images.py'
      - 'seo/static/**'
      - '.github/workflows/build-seo.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate SEO site
        run: |
          python seo/generate_seo_strict.py
          python seo/ensure_center_images.py
      - name: Include static files
        run: cp -a seo/static/. seo/site/
      - name: Validate every generated center page
        run: |
          python - <<'PY'
          from pathlib import Path
          import html,re,sys
          sys.path.insert(0,'seo')
          from center_directory import address_is_complete
          pages=list(Path('seo/site').rglob('index.html'))
          centers=list(Path('seo/site/centers').glob('*/index.html'))
          assert len(pages)>=40 and centers
          generic=('About this veterinary cancer research center','currently has veterinary cancer treatment or research opportunities represented in our catalog')
          for p in pages:
            s=p.read_text(errors='replace')
            assert 'Cancer Trial Finder For Dogs And Cats' in s,p
            for block in re.findall(r'<div class="study-locations">.*?</div>',s,re.S):
              for item in re.findall(r'<li>(.*?)</li>',block,re.S):
                text=html.unescape(re.sub(r'<.*?>','',item)).strip()
                assert address_is_complete(text,''),(p,text)
          for p in centers:
            s=p.read_text(errors='replace')
            assert '<div class="center-page">' in s,p
            assert 'Find cancer treatment options near you' in s,p
            assert ': Veterinary Cancer Clinical Trials</h1>' not in s,p
            assert not any(x in s for x in generic),(p,'generic center description survived')
          print('VALID_ALL_CENTERS',len(centers))
          PY
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: seo/site
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
  verify:
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Rebuild expected center pages
        run: |
          python seo/generate_seo_strict.py
          python seo/ensure_center_images.py
      - name: Verify every live center page against rebuilt output
        run: |
          python - <<'PY'
          from pathlib import Path
          import html,re,time,urllib.request
          base='https://jdizhur-rgb.github.io/vet-trial-matcher/'
          local=sorted(Path('seo/site/centers').glob('*/index.html'))
          assert local
          def h1(s):
            m=re.search(r'<h1>(.*?)</h1>',s,re.S); return html.unescape(re.sub(r'<.*?>','',m.group(1))).strip() if m else ''
          def card_titles(s):return [html.unescape(re.sub(r'<.*?>','',x)).strip() for x in re.findall(r'<article class="card"><h3>(.*?)</h3>',s,re.S)]
          for p in local:
            path=str(p.parent.relative_to('seo/site')).replace('\\','/')+'/'
            expected=p.read_text(errors='replace'); text=''
            for _ in range(18):
              try:
                req=urllib.request.Request(base+path+'?verify='+str(time.time()),headers={'Cache-Control':'no-cache','User-Agent':'Mozilla/5.0'})
                text=urllib.request.urlopen(req,timeout=20).read().decode('utf-8','replace')
              except Exception:text=''
              if h1(text)==h1(expected) and card_titles(text)==card_titles(expected) and '<div class="center-page">' in text:break
              time.sleep(10)
            assert h1(text)==h1(expected),(path,h1(text),h1(expected))
            assert card_titles(text)==card_titles(expected),(path,'study cards differ')
            assert '<div class="center-page">' in text,path
            assert ': Veterinary Cancer Clinical Trials</h1>' not in text,path
            exp_locs=[html.unescape(re.sub(r'<.*?>','',x)).strip() for b in re.findall(r'<div class="study-locations">.*?</div>',expected,re.S) for x in re.findall(r'<li>(.*?)</li>',b,re.S)]
            live_locs=[html.unescape(re.sub(r'<.*?>','',x)).strip() for b in re.findall(r'<div class="study-locations">.*?</div>',text,re.S) for x in re.findall(r'<li>(.*?)</li>',b,re.S)]
            assert live_locs==exp_locs,(path,'locations differ')
            print('LIVE_CENTER_OK',path,len(card_titles(text)),'studies')
          print('LIVE_ALL_CENTERS_OK',len(local))
          PY
