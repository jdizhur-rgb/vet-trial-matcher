name: Build and deploy SEO site

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'data/trials_base.json'
      - 'data/trial_updates.json'
      - 'data/catalog_patch_*.json'
      - 'seo/generate_seo.py'
      - 'seo/generate_seo_strict.py'
      - 'seo/sitecustomize.py'
      - 'seo/usercustomize.py'
      - 'seo/center_profiles.py'
      - 'seo/center_profiles_extra.py'
      - 'seo/ensure_center_images.py'
      - 'seo/static/**'
      - '.github/workflows/build-seo.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate SEO site
        run: |
          python seo/generate_seo_strict.py
          python seo/ensure_center_images.py
      - name: Include static files
        run: cp -a seo/static/. seo/site/
      - name: Validate final generated HTML
        run: |
          python - <<'PY'
          from pathlib import Path
          import html,re
          pages=list(Path('seo/site').rglob('index.html'))
          centers=list(Path('seo/site/centers').glob('*/index.html'))
          assert len(pages)>=40 and centers
          for p in pages:
            s=p.read_text(errors='replace')
            assert 'Cancer Trial Finder For Dogs And Cats' in s,p
            for block in re.findall(r'<div class="study-locations">.*?</div>',s,re.S):
              for item in re.findall(r'<li>(.*?)</li>',block,re.S):
                text=html.unescape(re.sub(r'<.*?>','',item))
                assert re.search(r'\d',text),(p,text)
                assert re.search(r'\b[A-Z]{2}\s+\d{5}(?:-\d{4})?\b',text),(p,text)
          for p in centers:
            s=p.read_text(errors='replace')
            assert '<div class="center-page">' in s,p
            assert 'Find cancer treatment options near you' in s,p
            assert ': Veterinary Cancer Clinical Trials</h1>' not in s,p
          aurelius=Path('seo/site/centers/aurelius-biotherapeutics/index.html')
          if aurelius.exists():
            s=aurelius.read_text(errors='replace')
            assert 'adoptive T-cell immunotherapy' in s
            assert '720 Virginia Street' in s
          print('VALID_UNIFIED',len(pages),'pages',len(centers),'centers')
          PY
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: seo/site
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
  verify:
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - name: Verify live center pages
        run: |
          python - <<'PY'
          import time,urllib.request
          base='https://jdizhur-rgb.github.io/vet-trial-matcher/'
          checks={
            'centers/':'Veterinary Cancer Research Centers',
            'centers/aurelius-biotherapeutics/':'adoptive T-cell immunotherapy',
          }
          for path,needle in checks.items():
            text=''
            for _ in range(18):
              try:
                req=urllib.request.Request(base+path+'?verify='+str(time.time()),headers={'Cache-Control':'no-cache','User-Agent':'Mozilla/5.0'})
                text=urllib.request.urlopen(req,timeout=20).read().decode('utf-8','replace')
              except Exception:text=''
              if needle in text:break
              time.sleep(10)
            assert needle in text,(path,needle)
            if 'aurelius' in path:
              assert '720 Virginia Street' in text
              assert ': Veterinary Cancer Clinical Trials</h1>' not in text
            print('LIVE_OK',path)
          PY
