name: Build SEO static site
on:
  workflow_dispatch:
  push:
    paths:
      - 'data/trials_base.json'
      - 'data/trial_updates.json'
      - 'seo/generate_seo.py'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate SEO pages
        run: python seo/generate_seo.py
      - name: Commit generated pages
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add seo/site
          if git diff --cached --quiet; then
            echo 'No SEO changes'
          else
            git commit -m 'Regenerate SEO pages from current catalog'
            git push
          fi
