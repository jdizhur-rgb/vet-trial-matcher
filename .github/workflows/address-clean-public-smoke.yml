name: Clean address public smoke
on:
  push:
    branches: [address-clean-candidate-20260912]
    paths: ['.github/workflows/address-clean-public-smoke.yml']
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install Chromium
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium
      - name: Public Chromium desktop and mobile
        run: |
          python - <<'PY'
          from playwright.sync_api import sync_playwright
          URL='https://c-trials.streamlit.app/'
          def choose(page,label,value):
              boxes=page.locator('[data-testid="stSelectbox"]')
              for i in range(boxes.count()):
                  box=boxes.nth(i)
                  if label in box.inner_text():
                      box.get_by_role('combobox').click()
                      page.keyboard.type(value, delay=10)
                      page.keyboard.press('Enter')
                      page.wait_for_timeout(800)
                      return
              raise AssertionError(f'missing selectbox: {label}')
          with sync_playwright() as p:
              browser=p.chromium.launch(headless=True)
              for name,w,h in [('desktop',1440,1200),('mobile',390,844)]:
                  page=browser.new_page(viewport={'width':w,'height':h})
                  errors=[]
                  page.on('pageerror',lambda e: errors.append(str(e)))
                  page.goto(URL,wait_until='domcontentloaded',timeout=90000)
                  page.wait_for_timeout(12000)
                  body0=page.locator('body').inner_text()
                  assert 'Country / region' in body0, body0[:2500]
                  assert 'Cancer type' in body0, body0[:2500]
                  choose(page,'Country / region','USA')
                  choose(page,'Cancer type','Cancer — any type')
                  page.get_by_role('button',name='Find potential trials').click()
                  page.wait_for_timeout(6000)
                  body=page.locator('body').inner_text()
                  assert 'Results' in body
                  assert 'Location / Address:' in body
                  assert 'Participating sites:' not in body
                  assert '1 Garrod Dr' in body
                  assert not errors, errors
                  print(name,'PUBLIC_OK',len(body))
                  page.close()
              browser.close()
          PY
