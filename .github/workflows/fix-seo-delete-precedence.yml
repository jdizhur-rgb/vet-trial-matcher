name: Fix SEO delete precedence
on:
  push:
    paths: ['.github/workflows/fix-seo-delete-precedence.yml']
permissions: {contents: write}
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Patch loader without touching generator structure
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('seo/generate_seo.py');s=p.read_text()
          old=""" rows={r['id']:r for r in base}\n for rid in upd.get('delete',[]): rows.pop(rid,None)\n for p in upd.get('upsert',[]): rows[p['id']]={**rows.get(p['id'],{}),**p}\n return [r for r in rows.values() if r.get('study_type')=='treatment' and r.get('available_for_matching') is True]\n"""
          new=""" rows={r['id']:r for r in base}\n # Upserts override base, but delete markers have FINAL precedence.\n # Applying deletes first resurrected deleted upserts on SEO pages.\n for p in upd.get('upsert',[]): rows[p['id']]={**rows.get(p['id'],{}),**p}\n for rid in upd.get('delete',[]): rows.pop(rid,None)\n return [r for r in rows.values() if r.get('study_type')=='treatment' and r.get('available_for_matching') is True]\n"""
          assert old in s, 'expected loader block not found';p.write_text(s.replace(old,new,1))
          PY
      - run: python seo/generate_seo.py
      - run: |
          if [ -f seo/postprocess_design.py ]; then python seo/postprocess_design.py; fi
      - name: Verify deleted records stay out and dedupe gate passes
        run: |
          python scripts/semantic_dedupe_catalog.py
          ! grep -R -q 'Palbociclib study for multiple canine cancers' seo/site/north-america/dogs/histiocytic-sarcoma || exit 1
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add seo/generate_seo.py seo/site
          git commit -m 'Honor delete markers in SEO effective catalog'
          git push
