name: Brand SEO pages as Vet Cancer Trial Finder
on:
  push:
    paths: ['.github/workflows/brand-seo-finder-20260907.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/brand_seo_finder_20260907.py
      - run: python -m py_compile seo/generate_seo.py
      - run: python seo/generate_seo.py
      - run: |
          grep -q 'Vet Cancer Trial Finder' seo/site/index.html
          grep -q 'Search the Vet Cancer Trial Finder' seo/site/index.html
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add seo/generate_seo.py seo/site
          git commit -m "Brand SEO pages as Vet Cancer Trial Finder" && git push || true
