name: Repair result export syntax
on:
  push:
    paths:
      - '.github/workflows/fix-mobile-result-buttons.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repair and validate
        run: |
          echo '' | base64 -d | python
          python -m py_compile pages/1_Clinical_Trial_Finder.py
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add pages/1_Clinical_Trial_Finder.py
          git diff --cached --quiet || git commit -m 'Repair result export syntax'
          git push
