name: Revert SEO loader rewrite
on:
  push:
    paths: ['.github/workflows/revert-seo-loader-rewrite.yml']
permissions: {contents: write}
jobs:
  revert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git revert --no-edit bb798c8d735aa913804a703c9181d51f559541ce
          git push
