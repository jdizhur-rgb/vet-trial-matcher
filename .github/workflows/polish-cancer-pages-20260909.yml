name: Polish cancer pages 2026-09-09
on:
  push:
    paths: ['.github/workflows/polish-cancer-pages-20260909.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Wire cancer page enhancement into strict generator
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('seo/generate_seo_strict.py')
          s=p.read_text()
          imp='from cancer_page_enhancements import enhance_cancer_pages\n'
          if imp not in s:
              s=s.replace('import generate_seo as g\n', 'import generate_seo as g\n'+imp, 1)
          old='g.main();generate_centers(rows);audit(report)'
          new='g.main();enhance_cancer_pages(g.OUT);generate_centers(rows);audit(report)'
          if old in s:
              s=s.replace(old,new,1)
          elif new not in s:
              raise SystemExit('Could not find strict-generator main sequence')
          p.write_text(s)
          PY
      - name: Validate and regenerate SEO site
        run: |
          python -m py_compile seo/generate_seo.py seo/generate_seo_strict.py seo/cancer_page_enhancements.py
          python seo/generate_seo_strict.py
      - name: Verify cancer-page invariants
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          root=Path('seo/site')
          pages=list(root.glob('north-america/dogs/*/index.html'))+list(root.glob('north-america/cats/*/index.html'))+list(root.glob('uk-europe/dogs/*/index.html'))+list(root.glob('uk-europe/cats/*/index.html'))
          assert pages, 'No English cancer pages found'
          for p in pages:
              s=p.read_text()
              assert '<div class="cancer-page">' in s, p
              assert 'Common treatment approaches' in s, p
              assert re.search(r'<link rel="canonical" href="https://jdizhur-rgb.github.io/vet-trial-matcher/',s), p
              assert '100% FREE' in s, p
          assert (root/'centers').exists(), 'Center pages disappeared'
          assert (root/'sitemap.xml').exists(), 'Sitemap missing'
          print('Verified',len(pages),'English cancer pages; center pages and sitemap preserved')
          PY
      - name: Commit generated result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add seo/generate_seo_strict.py seo/cancer_page_enhancements.py seo/site
          git commit -m "Improve cancer landing pages without changing catalog" && git push || true
