name: Use full study details links in finder 2026-09-09
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/use-full-study-details-links-20260909.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prefer registry details links in finder results
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('pages/1_Clinical_Trial_Finder.py')
          s=p.read_text(encoding='utf-8')
          old="                st.link_button('Study page / enrollment', tr.get('url', ''), use_container_width=True)"
          new="                details_url = tr.get('registry_url') or tr.get('url', '')\n                if details_url:\n                    st.link_button('View full study details →', details_url, use_container_width=True)"
          assert old in s, 'result link button not found'
          s=s.replace(old,new,1)
          old_report='        if tr.get("url"):\n            lines.append("Study page: " + tr["url"])'
          new_report='        details_url = tr.get("registry_url") or tr.get("url")\n        if details_url:\n            lines.append("Full study details: " + details_url)'
          assert old_report in s, 'report link block not found'
          s=s.replace(old_report,new_report,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Verify
        run: |
          grep -q "registry_url.*tr.get('url'" pages/1_Clinical_Trial_Finder.py
          grep -q "View full study details" pages/1_Clinical_Trial_Finder.py
      - name: Commit
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add pages/1_Clinical_Trial_Finder.py
          git diff --cached --quiet || git commit -m "Prefer full registry study details links in finder"
          git push
