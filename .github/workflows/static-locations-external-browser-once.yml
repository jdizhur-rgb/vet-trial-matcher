name: Static locations external browser once
on:
  push:
    paths: ['.github/workflows/static-locations-external-browser-once.yml']
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install app and browser
        run: |
          pip install -r requirements.txt playwright
          python -m playwright install chromium
      - name: Start Streamlit
        run: |
          streamlit run app.py --server.headless true --server.address 127.0.0.1 --server.port 8501 > /tmp/streamlit.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8501/_stcore/health >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/streamlit.log
          exit 1
      - name: Test real browser DOM
        run: |
          python - <<'PY'
          from playwright.sync_api import sync_playwright

          def choose(page,label,value):
              box=page.get_by_text(label,exact=True).locator("xpath=ancestor::div[contains(@class,'stSelectbox')][1]").get_by_role('combobox')
              box.click(); box.fill(value); box.press('Enter'); page.wait_for_timeout(900)

          def run_case(page,cancer,need):
              page.goto('http://127.0.0.1:8501/',wait_until='domcontentloaded',timeout=60000)
              page.get_by_text('Country / region',exact=True).wait_for(timeout=60000)
              choose(page,'Country / region','USA')
              choose(page,'Cancer type',cancer)
              page.get_by_role('button',name='Find potential trials').click()
              page.get_by_text('Results',exact=True).wait_for(timeout=30000)
              body=page.locator('body').inner_text()
              missing=[x for x in need if x not in body]
              print('CASE',cancer,'MISSING',missing)
              if missing:
                  print(body[-18000:])
                  raise SystemExit(1)

          with sync_playwright() as p:
              b=p.chromium.launch(headless=True)
              page=b.new_page(viewport={'width':1440,'height':1800})
              run_case(page,'Oral melanoma',[
                  'Ethos Veterinary Health',
                  '734 Alpha Drive',
                  '2505 S 80th St',
                  '10435 Sorrento Valley Rd',
                  'Bridge Animal Referral Center (BARC)',
                  '8401 Main St',
                  'Edmonds, WA 98026'
              ])
              page.screenshot(path='/tmp/oral-melanoma-static.png',full_page=True)
              run_case(page,'Brain tumor / glioma',[
                  'UC Davis',
                  '1 Garrod Dr',
                  'Davis, CA 95616'
              ])
              page.screenshot(path='/tmp/glioma-static.png',full_page=True)
              b.close()
          print('EXTERNAL_BROWSER_STATIC_LOCATIONS_PASS')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: static-location-browser-screenshots
          path: /tmp/*-static.png
