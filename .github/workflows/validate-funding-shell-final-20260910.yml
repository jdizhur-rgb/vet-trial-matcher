name: Final funding shell validation
on:
  push:
    branches: [funding-shell-safe-20260910]
    paths: ['.github/workflows/validate-funding-shell-final-20260910.yml']
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: Test config
        run: |
          mkdir -p .streamlit
          printf 'SUPABASE_KEY = "test-only"\n' > .streamlit/secrets.toml
      - name: Compile
        run: python -m py_compile app.py pages/1_Clinical_Trial_Finder.py pages/2_Additional_Oncology_Options.py
      - name: Verify architecture
        run: |
          python - <<'PY'
          from pathlib import Path
          a=Path('app.py').read_text(encoding='utf-8')
          p=Path('pages/1_Clinical_Trial_Finder.py').read_text(encoding='utf-8')
          assert 'page=st.navigation' in a and 'try:page.run()' in a
          assert 'body.startswith("**Trial funding:**")' in a
          assert '.funding-full{' in a and '.funding-partial{' in a
          assert "st.write('**Trial funding:** '" in p
          assert 'import ui' not in p
          PY
      - name: AppTest
        run: |
          python - <<'PY'
          from streamlit.testing.v1 import AppTest
          at=AppTest.from_file('app.py').run(timeout=30)
          if at.exception:
              raise SystemExit('\n'.join(str(x.value) for x in at.exception))
          assert len(at.selectbox) >= 3, f'Expected Finder form, got {len(at.selectbox)} selectboxes'
          assert len(at.button) >= 1, 'Expected Finder button'
          PY
      - name: Live startup health
        run: |
          streamlit run app.py --server.headless true --server.port 8501 >/tmp/st.log 2>&1 &
          pid=$!
          ok=0
          for i in $(seq 1 30); do
            if python - <<'PY'
          import urllib.request
          urllib.request.urlopen('http://127.0.0.1:8501/_stcore/health',timeout=2).read()
          PY
            then ok=1; break; fi
            sleep 1
          done
          if [ "$ok" != 1 ]; then cat /tmp/st.log; kill $pid || true; exit 1; fi
          kill $pid; wait $pid || true